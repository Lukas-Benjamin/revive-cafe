  <script>
    firebase.initializeApp("__FIREBASE_CONFIG__");
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    // _authReady resolves once anonymous sign-in completes
    window._authReady = new Promise(resolve => {
      const unsub = firebase.auth().onAuthStateChanged(user => {
        if (user) { unsub(); resolve(user); }
      }, () => { unsub(); resolve(null); });
      firebase.auth().signInAnonymously().catch(() => resolve(null));
    });
    // adb = auth-aware Firestore wrapper; every call waits for _authReady
    const adb = (() => {
      const wrap = ref => ({
        get:    ()      => window._authReady.then(() => ref.get()),
        set:    (d, o)  => window._authReady.then(() => ref.set(d, o)),
        update: d       => window._authReady.then(() => ref.update(d)),
        delete: ()      => window._authReady.then(() => ref.delete()),
        add:    d       => window._authReady.then(() => ref.add(d)),
        onSnapshot: (...args) => {
          let unsub = () => {}, cancelled = false;
          window._authReady.then(() => { if (!cancelled) unsub = ref.onSnapshot(...args); });
          return () => { cancelled = true; unsub(); };
        },
        doc:        id   => wrap(ref.doc(id)),
        collection: name => wrap(ref.collection(name)),
      });
      return { collection: name => wrap(db.collection(name)) };
    })();
  </script>

// ─── Auth helpers ─────────────────────────────────────────────────────────────
const getSessToken = () => { try { return sessionStorage.getItem('k21-sess') || ''; } catch { return ''; } };
const setSessToken = t => { try { t ? sessionStorage.setItem('k21-sess', t) : sessionStorage.removeItem('k21-sess'); } catch {} };
const aFetch = (url, opts = {}) => fetch(url, { ...opts, headers: { ...(opts.headers||{}), 'X-Session': getSessToken() } });

// Retry a Firestore (or any Promise-returning) write up to 3 times with backoff
const withRetry = (fn, onErr) => {
  const attempt = (n) => fn().catch(e => {
    if (n >= 3) { if (onErr) onErr(e); return; }
    return new Promise(res => setTimeout(res, n * 600)).then(() => attempt(n + 1));
  });
  return attempt(1);
};

// Server-side write helper — routes all cafe data writes through the server proxy
// so they work even when Firestore security rules are expired
async function serverWrite(col, data) {
  const MAX_ATTEMPTS = 3;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      const r = await aFetch(`/api/data?c=${encodeURIComponent(col)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (r.ok) return;
    } catch {}
    if (attempt < MAX_ATTEMPTS) await new Promise(res => setTimeout(res, attempt * 500));
  }
}

// ─── SignaturePad ─────────────────────────────────────────────────────────────
const SignaturePad = ({ label, value, onChange }) => {
  const canvasRef = useRef(null);
  const drawing   = useRef(false);
  const lastPos   = useRef(null);

  const getXY = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const src  = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * (canvas.width  / rect.width),
      y: (src.clientY - rect.top)  * (canvas.height / rect.height),
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    drawing.current = true;
    const pos = getXY(e, canvasRef.current);
    lastPos.current = pos;
    const ctx = canvasRef.current.getContext('2d');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
  };

  const draw = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx    = canvas.getContext('2d');
    const pos    = getXY(e, canvas);
    ctx.beginPath();
    ctx.moveTo(lastPos.current.x, lastPos.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = '#000';
    ctx.lineWidth   = 2.2;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.stroke();
    lastPos.current = pos;
    onChange(canvas.toDataURL('image/png'));
  };

  const endDraw = () => { drawing.current = false; };

  const clear = (e) => {
    e.stopPropagation();
    const canvas = canvasRef.current;
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    onChange('');
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-xs font-bold text-slate-600">{label}</span>
        {value && (
          <button type="button" onClick={clear}
            className="text-xs text-slate-400 hover:text-red-500 flex items-center gap-0.5 transition-all">
            <SI p={IC.refresh} size={11}/> Löschen
          </button>
        )}
      </div>
      <div style={{position:'relative',borderRadius:'12px',overflow:'hidden',border:value?'1.5px solid #000':'1.5px dashed #cbd5e1',background:'#fff'}}>
        <canvas
          ref={canvasRef}
          width={500} height={130}
          style={{display:'block',width:'100%',height:'110px',cursor:'crosshair',touchAction:'none'}}
          onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
        />
        {!value && (
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
            <span style={{color:'#cbd5e1',fontSize:'11px',fontStyle:'italic'}}>Hier unterschreiben</span>
          </div>
        )}
      </div>
    </div>
  );
};

  const [pin,      setPin]      = useState('');
  const [showPin,  setShowPin]  = useState(false);
  const [err,      setErr]      = useState('');
  const [dropOpen, setDropOpen] = useState(false);

  const defaultProfile = profiles && profiles.length ? profiles[0].id : 'k21-cafe';

  // Load user names for the autocomplete dropdown (names only, no PINs needed)
  useEffect(() => {
    let cancelled = false;
    const load = async () => {
      try {
        const r = await fetch('/api/users?c=cafe-users');
        if (!r.ok) throw new Error('server');
        const data = await r.json();
        if (!cancelled) { setUsers(data); return; }
      } catch {}
      // Fallback: direct Firestore (names only for autocomplete)
      const unsub = adb.collection('cafe-users').onSnapshot(
        snap => { if (!cancelled) { setUsers(snap.docs.map(d=>({id:d.id,...d.data()}))); } },
        () => {}
      );
      return () => unsub();
    };
    load();
    return () => { cancelled = true; };
  }, []);

  const allNames = [OWNER_NAME, ...users.map(u=>u.name)];
  const filtered = name.trim() ? allNames.filter(n=>n.toLowerCase().includes(name.toLowerCase())) : allNames;

  const tryLogin = async () => {
    const n = name.trim();
    if (!n || !pin) { setErr('Bitte Name und PIN eingeben'); return; }
    setErr('');
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: n, pin })
      });
      const d = await r.json();
      if (r.ok && d.ok) {
        setSessToken(d.token || '');
        const { token: _t, exp: _e, ...userInfo } = d;
        onLogin(userInfo, defaultProfile);
      } else {
        setErr(d.error || 'Name oder PIN nicht korrekt');
        setPin('');
      }
    } catch {
      setErr('Verbindungsfehler – bitte erneut versuchen');
    }
  };

  const INP_L = "w-full border rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 text-sm transition-all";
  const INP_S = {background:'rgba(0,0,0,0.04)', borderColor:'rgba(0,0,0,0.1)'};

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px',background:'#f8fafc'}}>
      <div style={{width:'100%',maxWidth:'320px'}}>
        <div style={{textAlign:'center',marginBottom:'32px'}}>
          <img src="/logo.png" style={{width:80,height:80,margin:'0 auto 16px',display:'block',objectFit:'contain',mixBlendMode:'multiply'}} alt="K21"/>
          <h1 style={{fontFamily:'Gotham,sans-serif',fontWeight:900,fontSize:28,color:'#000000',letterSpacing:'-0.04em',margin:0,lineHeight:1}}>K21 Café</h1>
        </div>

        <div className="glass rounded-2xl glow" style={{overflow:'visible'}}>
          <div style={{padding:'20px',display:'flex',flexDirection:'column',gap:'12px'}}>

            {/* Name with dropdown */}
            <div style={{position:'relative'}}>
              <input value={name}
                onChange={e=>{setName(e.target.value);setErr('');setDropOpen(true);}}
                onFocus={()=>setDropOpen(true)}
                onBlur={()=>setTimeout(()=>setDropOpen(false),150)}
                placeholder="Dein Name" className={INP_L} style={INP_S}
                autoComplete="off" autoFocus/>
              {dropOpen && filtered.length > 0 && (
                <div className="glass glow" style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,borderRadius:12,zIndex:20,overflow:'hidden'}}>
                  {filtered.slice(0,6).map(n=>(
                    <button key={n} onMouseDown={()=>{setName(n);setDropOpen(false);setErr('');}}
                      style={{width:'100%',textAlign:'left',padding:'10px 16px',fontSize:14,color:'#000000',background:'transparent',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:10}}
                      className="glass-hover">
                      <div style={{width:24,height:24,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:'#000',color:'#fff',fontWeight:700,fontSize:9}}>
                        {n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
                      </div>
                      {n}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* PIN */}
            <div style={{position:'relative'}}>
              <input type={showPin?'text':'password'} autoComplete="off"
                value={pin} onChange={e=>{setPin(e.target.value);setErr('');}}
                onKeyDown={e=>e.key==='Enter'&&tryLogin()}
                placeholder="PIN" className={INP_L} style={{...INP_S,paddingRight:40}}/>
              <button type="button" onClick={()=>setShowPin(p=>!p)}
                style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'#94a3b8',padding:0}}>
                <SI p={showPin?IC.eyeOff:IC.eye} size={15}/>
              </button>
            </div>

            {err && <p style={{color:'#ef4444',fontSize:12,margin:0}}>{err}</p>}

            <button onClick={tryLogin} disabled={!name.trim()||!pin}
              style={{width:'100%',padding:'12px',borderRadius:30,background:'#000',color:'#fff',fontWeight:700,fontSize:14,border:'none',cursor:'pointer',opacity:(!name.trim()||!pin)?0.4:1,transition:'opacity .15s'}}>
              Anmelden
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── KasseView ────────────────────────────────────────────────────────────────
const KasseView = ({ cafe, user, toast, activeSchicht, profile }) => {
  const [warenkorb, setWarenkorb]   = useState([]);
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const [aktivKat, setAktivKat]     = useState('alle');

  const aktivProdukte = useMemo(() =>
    cafe.produkte.filter(p => p.aktiv !== false), [cafe.produkte]);

  const kategorien = useMemo(() => {
    const used = new Set(aktivProdukte.map(p=>p.kategorie_id));
    return cafe.kategorien.filter(k=>used.has(k.id));
  }, [cafe.kategorien, aktivProdukte]);

  const angezeigt = useMemo(() =>
    aktivKat==='alle' ? aktivProdukte : aktivProdukte.filter(p=>p.kategorie_id===aktivKat),
    [aktivProdukte, aktivKat]);

  const gesamt = useMemo(() => warenkorb.reduce((s,i)=>s+i.preis*i.menge,0), [warenkorb]);

  const addToCart = (p) => {
    setWarenkorb(prev => {
      const ex = prev.find(i=>i.produkt_id===p.id);
      if (ex) return prev.map(i=>i.produkt_id===p.id?{...i,menge:i.menge+1}:i);
      return [...prev, {produkt_id:p.id,name:p.name,preis:p.preis,menge:1}];
    });
  };

  const changeQty = (produkt_id, delta) => {
    setWarenkorb(prev => {
      const next = prev.map(i=>i.produkt_id===produkt_id?{...i,menge:i.menge+delta}:i)
        .filter(i=>i.menge>0);
      return next;
    });
  };

  const removeItem = (produkt_id) => setWarenkorb(prev=>prev.filter(i=>i.produkt_id!==produkt_id));

  const clearCart = () => setWarenkorb([]);

  return (
    <div style={{display:'flex',gap:'16px',height:'calc(100vh - 120px)',overflow:'hidden'}}>
      {/* Left: product grid */}
      <div style={{flex:'1 1 0',overflowY:'auto',paddingRight:'4px'}}>
        {/* Category tabs */}
        <div className="flex flex-wrap gap-2 mb-4">
          <button onClick={()=>setAktivKat('alle')}
            className={`pill transition-all ${aktivKat==='alle'?'text-white':'text-slate-600 bg-white border border-black/10'}`}
            style={aktivKat==='alle'?{background:'#000000'}:{}}>
            Alle
          </button>
          {kategorien.map(k => (
            <button key={k.id} onClick={()=>setAktivKat(k.id)}
              className={`pill transition-all ${aktivKat===k.id?'text-white border-transparent':'text-slate-700 bg-white border border-black/10'}`}
              style={aktivKat===k.id?{background:k.farbe||'#6366f1'}:{}}>
              {k.name}
            </button>
          ))}
        </div>
        {angezeigt.length === 0 && (
          <div className="text-center py-16 text-slate-400 text-sm">Keine Produkte verfügbar</div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:'10px'}}>
          {angezeigt.map(p => {
            const kat = cafe.kategorien.find(k=>k.id===p.kategorie_id);
            const inCart = warenkorb.find(i=>i.produkt_id===p.id);
            const inv = (cafe.inventar||{})[p.id];
            const istGetrackt = inv?.aktiv;
            const bestand = inv?.bestand ?? null;
            const warnschwelle = inv?.warnschwelle ?? 3;
            const ausverkauft = istGetrackt && bestand === 0;
            const tiefBestand = istGetrackt && bestand > 0 && bestand <= warnschwelle;
            return (
              <button key={p.id} onClick={()=>{ if(!ausverkauft) addToCart(p); }}
                className="product-btn glass rounded-2xl p-3 text-left relative hover:shadow-md transition-all"
                style={{minHeight:'90px', opacity: ausverkauft ? 0.45 : 1, cursor: ausverkauft ? 'not-allowed' : 'pointer'}}>
                {inCart && !ausverkauft && (
                  <span className="absolute top-2 right-2 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold text-white"
                    style={{background:'#000000',fontSize:'10px'}}>{inCart.menge}</span>
                )}
                {ausverkauft && (
                  <span className="absolute top-2 right-2 text-xs font-bold px-1.5 py-0.5 rounded-full"
                    style={{background:'rgba(239,68,68,0.15)',color:'#ef4444',fontSize:'9px'}}>0</span>
                )}
                {tiefBestand && (
                  <span className="absolute top-2 right-2 text-xs font-bold px-1.5 py-0.5 rounded-full"
                    style={{background:'rgba(245,158,11,0.15)',color:'#d97706',fontSize:'9px'}}>⚠{bestand}</span>
                )}
                {istGetrackt && bestand > warnschwelle && (
                  <span className="absolute top-2 right-2 text-xs font-bold px-1.5 py-0.5 rounded-full"
                    style={{background:'rgba(16,185,129,0.12)',color:'#10b981',fontSize:'9px'}}>{bestand}</span>
                )}
                <div className="text-xs font-semibold leading-tight" style={{color: ausverkauft?'#94a3b8':'#1e293b',marginTop: istGetrackt?'14px':'0'}}>{p.name}</div>
                <div className="text-xs font-bold mt-1" style={{color: ausverkauft?'#94a3b8':(kat?.farbe||'#6366f1')}}>{fmtEur(p.preis)}</div>
                {ausverkauft && <div className="text-xs text-red-400 font-semibold mt-0.5">Ausverkauft</div>}
              </button>
            );
          })}
        </div>
      </div>

      {/* Right: cart */}
      <div className="glass rounded-2xl glow flex flex-col" style={{width:'300px',flexShrink:0}}>
        <div className="px-4 py-3 flex items-center justify-between" style={{borderBottom:'1px solid rgba(0,0,0,0.08)'}}>
          <span className="font-semibold text-sm text-slate-800 flex items-center gap-2">
            <SI p={IC.bag} size={15}/>Warenkorb
          </span>
          {warenkorb.length > 0 && (
            <button onClick={clearCart} className="text-xs text-slate-400 hover:text-red-500 transition-all">Leeren</button>
          )}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'8px'}}>
          {warenkorb.length===0 && (
            <div className="text-center py-8 text-slate-400 text-xs">Noch leer</div>
          )}
          {warenkorb.map(item => (
            <div key={item.produkt_id} className="flex items-center gap-2 px-2 py-2 rounded-xl glass-hover">
              
              <div style={{flex:1,minWidth:0}}>
                <div className="text-xs font-semibold text-slate-800 truncate">{item.name}</div>
                <div className="text-xs text-slate-500">{fmtEur(item.preis * item.menge)}</div>
              </div>
              <div className="flex items-center gap-1">
                <button onClick={()=>changeQty(item.produkt_id,-1)}
                  className="w-6 h-6 rounded-lg flex items-center justify-center text-slate-600 hover:bg-black/10 transition-all">
                  <SI p={IC.minus} size={12}/>
                </button>
                <span className="text-xs font-bold w-4 text-center">{item.menge}</span>
                <button onClick={()=>changeQty(item.produkt_id,1)}
                  className="w-6 h-6 rounded-lg flex items-center justify-center text-slate-600 hover:bg-black/10 transition-all">
                  <SI p={IC.plus} size={12}/>
                </button>
              </div>
              <button onClick={()=>removeItem(item.produkt_id)}
                className="text-slate-300 hover:text-red-400 transition-all ml-1">
                <SI p={IC.x} size={13}/>
              </button>
            </div>
          ))}
        </div>
        <div className="p-4" style={{borderTop:'1px solid rgba(0,0,0,0.08)'}}>
          <div className="flex justify-between items-center mb-3">
            <span className="text-sm font-semibold text-slate-600">Gesamt</span>
            <span className="text-lg font-bold text-slate-900">{fmtEur(gesamt)}</span>
          </div>
          <button
            disabled={warenkorb.length===0 || !activeSchicht}
            onClick={()=>setCheckoutOpen(true)}
            className="w-full py-3 rounded-xl text-sm font-bold text-white transition-all disabled:opacity-40"

// ─── Checkout Modal ───────────────────────────────────────────────────────────
const CheckoutModal = ({ warenkorb, gesamt, cafe, schicht, user, toast, onClose, onSuccess, profile }) => {
  const methoden = useMemo(() => (cafe.zahlungsmethoden||[]).filter(m=>m.aktiv!==false), [cafe.zahlungsmethoden]);
  const [zahlungen, setZahlungen] = useState([]);
  const [aktuelleId, setAktuelleId] = useState(methoden[0]?.id||'bar');
  const [betrag, setBetrag] = useState('');
  const [kundenname, setKundenname] = useState('');
  const [notiz, setNotiz] = useState('');

  const bezahlt    = zahlungen.reduce((s,z)=>s+z.betrag,0);
  const restBetrag = Math.max(0, gesamt - bezahlt);
  const methode    = methoden.find(m=>m.id===aktuelleId);
  const wechsel    = methode?.id==='bar' && parseFloat(betrag)>restBetrag ? parseFloat(betrag)-restBetrag : 0;

  // Gutschein: compute effective Betrag based on type
  const gutscheinBetrag = useMemo(() => {
    if (!methode?.gutschein) return 0;
    if (methode.gutschein_typ==='betrag') return Math.min(methode.gutschein_wert||0, restBetrag);
    if (methode.gutschein_typ==='produkte') {
      const n = methode.gutschein_wert||0;
      // All individual item prices sorted most expensive first
      const allePreise = warenkorb.flatMap(i=>Array(i.menge).fill(i.preis)).sort((a,b)=>b-a);
      // Skip products already covered by previous same-type gutschein entries
      const bereitsAnzahl = zahlungen.filter(z=>z.gutschein && z.art===methode.id).length * n;
      const naechste = allePreise.slice(bereitsAnzahl, bereitsAnzahl + n);
      if (naechste.length === 0) return 0;
      return Math.min(naechste.reduce((s,v)=>s+v,0), restBetrag);
    }
    return 0;
  }, [methode, restBetrag, warenkorb, zahlungen]);

  const addZahlung = () => {
    if (!methode) return;
    // Mindestbetrag check
    if ((methode.mindestbetrag||0) > 0 && restBetrag < methode.mindestbetrag) {
      toast(`Mindestbetrag für ${methode.name}: ${fmtEur(methode.mindestbetrag)}`,'warn'); return;
    }
    // Maximalbetrag check
    const maxBetrag = methode.maximalbetrag||0;
    const bereitsGebucht = zahlungen.filter(z=>z.art===methode.id).reduce((s,z)=>s+z.betrag,0);
    if (maxBetrag > 0 && bereitsGebucht >= maxBetrag) {
      toast(`Maximalbetrag für ${methode.name} erreicht: ${fmtEur(maxBetrag)}`,'warn'); return;
    }
    if (methode.gutschein) {
      if (gutscheinBetrag <= 0) { toast('Gutscheinwert deckt nichts ab','warn'); return; }
      const label = methode.gutschein_typ==='produkte'
        ? `${methode.name} (${methode.gutschein_wert} Prod.)`
        : methode.name;
      setZahlungen(p=>[...p,{art:methode.id, name:label, betrag:gutscheinBetrag, gutschein:true}]);
      setBetrag('');
    } else {
      const eingabe = parseFloat(betrag)||0;
      // Karten-artige Methoden (kein Wechselgeld) — buchen exakt Restbetrag
      const b = methode.id==='bar' ? eingabe : restBetrag;
      let actual = Math.min(b, restBetrag);
      // Cap at remaining Maximalbetrag
      if (maxBetrag > 0) actual = Math.min(actual, maxBetrag - bereitsGebucht);
      if (actual <= 0) { toast('Betrag eingeben','error'); return; }
      setZahlungen(p=>[...p,{art:methode.id, name:methode.name, betrag:actual}]);
      setBetrag('');
    }
  };

  const saveOrder = () => {
    if (!kundenname.trim()) { toast('Bitte einen Namen eingeben','error'); return; }
    if (restBetrag > 0.005) { toast('Noch nicht vollständig bezahlt','error'); return; }
    const schichtBestellungen = (cafe.bestellungen||[]).filter(b=>b.schicht_id===schicht.id);
    const nummer = padNum(schichtBestellungen.length + 1);
    const neueBestellung = {
      id: genId(), schicht_id: schicht.id, nummer,
      kundenname: kundenname.trim(),
      notiz: notiz.trim(),
      artikel: warenkorb.map(i=>({...i,fertig:false})),
      gesamt, zahlung: zahlungen, status:'offen',
      erstellt_am: new Date().toISOString(),
      kassiererId: user.id, kassiererName: user.name,
    };
    const updSchichten = (cafe.schichten||[]).map(s=>
      s.id!==schicht.id ? s : {...s, bestellungen_count:(s.bestellungen_count||0)+1, umsatz:(s.umsatz||0)+gesamt}
    );
    // Deduct inventory for tracked products
    const updInventar = {...(cafe.inventar||{})};
    warenkorb.forEach(item => {
      const inv = updInventar[item.produkt_id];
      if (inv && inv.aktiv) {
        const neuBestand = Math.max(0, (inv.bestand||0) - item.menge);
        updInventar[item.produkt_id] = {...inv, bestand: neuBestand};
        if (neuBestand <= (inv.warnschwelle||0) && neuBestand > 0) toast(`⚠ ${item.name}: nur noch ${neuBestand} übrig`, 'warn');
        if (neuBestand === 0) toast(`⛔ ${item.name}: Bestand aufgebraucht`, 'warn');
      }
    });
    toast(`Bestellung #${nummer} gespeichert ✓`);
    onSuccess();
    const _d1 = {...DEFAULT_CAFE(),...cafe, schichten:updSchichten, bestellungen:[...(cafe.bestellungen||[]),neueBestellung], inventar:updInventar};
    serverWrite(profile||'k21-cafe', _d1);
    withRetry(() => adb.collection(profile||'k21-cafe').doc('data').set(_d1), e=>toast('Fehler: '+e.message,'error'));
  };

  return (
    <Modal title="Kasse" onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        {/* Artikel */}
        <div className="rounded-xl p-3" style={{background:'#f8fafc'}}>
          {warenkorb.map(i=>(
            <div key={i.produkt_id} className="flex justify-between text-sm py-0.5">
              <span className="text-slate-600">{i.name} ×{i.menge}</span>
              <span className="font-semibold">{fmtEur(i.preis*i.menge)}</span>
            </div>
          ))}
          <div className="flex justify-between text-sm font-bold pt-2 mt-2" style={{borderTop:'1px solid rgba(0,0,0,0.08)'}}>
            <span>Gesamt</span><span>{fmtEur(gesamt)}</span>
          </div>
        </div>

        {/* Bereits bezahlt */}
        {zahlungen.length > 0 && (
          <div className="rounded-xl p-3" style={{background:'#f0fdf4',border:'1px solid #bbf7d0'}}>
            <p className="text-xs font-semibold text-green-700 mb-1.5">Zahlungen</p>
            {zahlungen.map((z,i)=>(
              <div key={i} className="flex items-center justify-between text-xs py-0.5">
                <span className="text-green-800 flex items-center gap-1">
                  {z.gutschein && <span className="pill" style={{background:'#ede9fe',color:'#6d28d9',fontSize:'9px'}}>Gutschein</span>}
                  {z.name}
                </span>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-green-700">{fmtEur(z.betrag)}</span>
                  <button onClick={()=>setZahlungen(p=>p.filter((_,j)=>j!==i))} className="text-green-300 hover:text-red-400"><SI p={IC.x} size={11}/></button>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Rest / Bezahlt */}
        <div className="flex justify-between items-center">
          <span className="text-sm font-semibold text-slate-600">Noch offen</span>
          <span className={`text-xl font-bold ${restBetrag<=0.005?'text-emerald-600':'text-slate-900'}`}>
            {restBetrag<=0.005 ? '✓ Bezahlt' : fmtEur(restBetrag)}
          </span>
        </div>

        {/* Zahlung hinzufügen */}
        {restBetrag > 0.005 && (
          <div className="flex flex-col gap-3">
            <p className="text-xs font-semibold text-slate-500">Zahlungsart wählen</p>
            <div className="flex flex-wrap gap-2">
              {methoden.map(m=>{
                const bereitsGebT = zahlungen.filter(z=>z.art===m.id).reduce((s,z)=>s+z.betrag,0);
                const maxErr = (m.maximalbetrag||0)>0 && bereitsGebT>=m.maximalbetrag;
                const minErr = (m.mindestbetrag||0)>0 && restBetrag<m.mindestbetrag;
                const disabled = minErr || maxErr;
                const hint = maxErr ? `Max. ${fmtEur(m.maximalbetrag)} erreicht` : minErr ? `Min. ${fmtEur(m.mindestbetrag)}` : '';
                return (
                  <button key={m.id} onClick={()=>{setAktuelleId(m.id);setBetrag('');}}
                    disabled={disabled}
                    title={hint}
                    className={`pill transition-all disabled:opacity-40 ${aktuelleId===m.id?'text-white':'text-slate-600 bg-white border border-black/10'}`}
                    style={aktuelleId===m.id?{background: m.gutschein?'#6d28d9':'#000000'}:{}}>
                    {m.name}
                    {(m.mindestbetrag||0)>0 && !maxErr && <span className="ml-1 opacity-60">Min. {fmtEur(m.mindestbetrag)}</span>}
                    {(m.maximalbetrag||0)>0 && <span className="ml-1 opacity-60">Max. {fmtEur(m.maximalbetrag)}</span>}
                  </button>
                );
              })}
            </div>

            {methode?.gutschein ? (
              // Gutschein: zeige Wert und Einlösen-Button
              <div className="rounded-xl p-3 flex items-center justify-between" style={{background:'#ede9fe',border:'1px solid #ddd6fe'}}>
                <div>
                  <div className="text-xs font-semibold text-purple-700">{methode.name}</div>
                  <div className="text-xs text-purple-500 mt-0.5">
                    {methode.gutschein_typ==='produkte'
                      ? `${methode.gutschein_wert} teuerste Produkt(e) gratis`
                      : `Wert: ${fmtEur(methode.gutschein_wert||0)}`}
                    {' → '}<strong>{fmtEur(gutscheinBetrag)}</strong> abzugsfähig
                  </div>
                </div>
                <button onClick={addZahlung}
                  className="px-4 py-2 rounded-xl text-sm font-semibold text-white flex-shrink-0 ml-3"
                  style={{background:'#6d28d9'}}>
                  Einlösen
                </button>
              </div>
            ) : methode?.id==='bar' ? (
              // Bar: freier Betrag mit Wechselgeld
              <div className="flex flex-col gap-1">
                <div className="flex gap-2">
                  <input type="number" className={INP} placeholder={`Betrag (${fmtEur(restBetrag)})`}
                    value={betrag} onChange={e=>setBetrag(e.target.value)} step="0.01" min="0"
                    onKeyDown={e=>e.key==='Enter'&&addZahlung()} autoFocus/>
                  <button onClick={addZahlung} className="px-4 py-2.5 rounded-xl text-sm font-semibold text-white flex-shrink-0" style={{background:'#000000'}}>+</button>
                </div>
                {parseFloat(betrag)>restBetrag && (
                  <p className="text-xs text-emerald-600 font-semibold">Wechselgeld: {fmtEur(wechsel)}</p>
                )}
              </div>
            ) : (
              // Karte o.ä.: bucht exakt Restbetrag
              <button onClick={addZahlung}
                className="w-full py-2.5 rounded-xl text-sm font-semibold text-white"
                style={{background:'#000000'}}>
                {methode?.name}: {fmtEur(restBetrag)}
              </button>
            )}
          </div>
        )}

        {/* Name + Notiz */}
        <div className="flex flex-col gap-2">
          <input className={INP} placeholder="Name (z.B. Tisch 3 / Max) *" value={kundenname}
            onChange={e=>setKundenname(e.target.value)} autoFocus={restBetrag<=0.005}/>
          <textarea className={INP} placeholder="Notiz (optional)" value={notiz}
            onChange={e=>setNotiz(e.target.value)} rows={2} style={{resize:'none'}}/>
        </div>

        <button onClick={saveOrder} disabled={restBetrag>0.005||!kundenname.trim()}
          className="w-full py-3 rounded-xl text-sm font-bold text-white transition-all disabled:opacity-40"
          style={{background:'#10b981'}}>
          Bestellung abschließen ✓
        </button>
      </div>
    </Modal>
  );
};

// ─── BestellungenView ─────────────────────────────────────────────────────────
const BestellungenView = ({ cafe, user, toast, activeSchicht, profile }) => {
  const [filter, setFilter] = useState('aktiv');

  const bestellungen = useMemo(() => {
    let list = [...(cafe.bestellungen||[])];
    if (filter==='aktiv') list = list.filter(b=>b.status!=='storniert' && b.status!=='fertig');
    else if (filter==='fertig') list = list.filter(b=>b.status==='fertig');
    else if (filter==='schicht' && activeSchicht) list = list.filter(b=>b.schicht_id===activeSchicht.id);
    return list.sort((a,b)=>new Date(b.erstellt_am)-new Date(a.erstellt_am));
  }, [cafe.bestellungen, filter, activeSchicht]);

  const ref = () => adb.collection(profile||'k21-cafe').doc('data');
  const write = (patch) => { const d={...DEFAULT_CAFE(),...cafe,...patch}; serverWrite(profile||'k21-cafe',d); withRetry(() => ref().set(d), e=>toast(e.message,'error')); };

  const markItemFertig = (bestellung, artikelIdx) => {
    const updBestellungen = (cafe.bestellungen||[]).map(b => {
      if (b.id!==bestellung.id) return b;
      const artikel = b.artikel.map((a,i)=>i===artikelIdx?{...a,fertig:true}:a);
      const allFertig = artikel.every(a=>a.fertig);
      return { ...b, artikel, status: allFertig?'fertig':b.status };
    });
    write({bestellungen:updBestellungen});
  };

  const stornieren = (b) => {
    if (!can(user.role,'stornieren')) return;
    const updBestellungen = (cafe.bestellungen||[]).map(x=>x.id===b.id?{...x,status:'storniert'}:x);
    const updSchichten = (cafe.schichten||[]).map(s=>{
      if(s.id!==b.schicht_id) return s;
      return {...s, umsatz:Math.max(0,(s.umsatz||0)-b.gesamt), bestellungen_count:Math.max(0,(s.bestellungen_count||1)-1)};
    });
    toast('Bestellung storniert','warn');
    write({bestellungen:updBestellungen,schichten:updSchichten});
  };

  const artLabel = { bar:'Bar', karte:'Karte', gutschein:'Gutschein', wertkarte:'Wertkarte' };
  const statusStyle = { offen:{bg:'#fef3c7',col:'#92400e'}, fertig:{bg:'#d1fae5',col:'#065f46'}, storniert:{bg:'#fee2e2',col:'#991b1b'} };

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        {[['aktiv','Offen'],['fertig','Fertig'],['schicht','Diese Schicht'],['alle','Alle']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)}
            className={`pill transition-all ${filter===v?'text-white':'text-slate-600 bg-white border border-black/10'}`}
            style={filter===v?{background:'#000000'}:{}}>
            {l}
          </button>
        ))}
      </div>
      {bestellungen.length===0 && (
        <div className="text-center py-16 text-slate-400 text-sm">Keine Bestellungen</div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'12px'}}>
        {bestellungen.map(b => {
          const ss = statusStyle[b.status]||statusStyle.offen;
          return (
            <div key={b.id} className="glass rounded-2xl p-4 glow">
              <div className="flex items-start justify-between mb-3">
                <div>
                  <span className="text-lg font-bold text-slate-800">#{b.nummer}</span>
                  {b.kundenname && <span className="text-sm font-semibold text-slate-700 ml-2">{b.kundenname}</span>}
                  <div className="text-xs text-slate-400">{fmtDateTime(b.erstellt_am)}</div>
                  {b.notiz && <div className="text-xs text-slate-500 mt-0.5 italic">"{b.notiz}"</div>}
                </div>
                <span className="pill text-xs" style={{background:ss.bg,color:ss.col}}>
                  {b.status==='offen'?'Offen':b.status==='fertig'?'Fertig':'Storniert'}
                </span>
              </div>
              <div className="mb-3">
                {(b.artikel||[]).map((a,i)=>(
                  <div key={i} className="flex items-center gap-2 py-1">
                    {(user.role==='barista'||can(user.role,'kasse')) && b.status==='offen' && (
                      <button onClick={()=>markItemFertig(b,i)}
                        className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all ${a.fertig?'bg-green-500 border-green-500':'border-slate-300 hover:border-green-400'}`}>
                        {a.fertig && <SI p={IC.check} size={10} stroke={3}/>}
                      </button>
                    )}
                    <span className="text-sm text-slate-700">{a.name} ×{a.menge}</span>
                    <span className="text-xs text-slate-400 ml-auto">{fmtEur(a.preis*a.menge)}</span>
                  </div>
                ))}
              </div>
              <div style={{borderTop:'1px solid rgba(0,0,0,0.06)',paddingTop:'8px'}} className="flex justify-between items-center">
                <div className="text-xs text-slate-500">
                  {(b.zahlung||[]).map((z,i)=>(
                    <span key={i}>{i>0?', ':''}{artLabel[z.art]} {fmtEur(z.betrag)}</span>
                  ))}
                </div>
                <span className="text-sm font-bold text-slate-800">{fmtEur(b.gesamt)}</span>
              </div>
              {can(user.role,'stornieren') && b.status==='offen' && (
                <button onClick={()=>stornieren(b)}
                  className="w-full mt-2 py-1.5 rounded-lg text-xs font-semibold text-red-500 hover:bg-red-50 transition-all border border-red-200">
                  Stornieren
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ─── SchichtView ──────────────────────────────────────────────────────────────
const SchichtView = ({ cafe, user, toast, activeSchicht, setActiveSchicht, profile }) => {
  const [kassenstart, setKassenstart] = useState('');
  const [kassenende, setKassenende]   = useState('');
  const [showBericht, setShowBericht] = useState(false);
  const [showEndeModal, setShowEndeModal] = useState(false);
  const [endeKassenende, setEndeKassenende] = useState('');
  const [unterschrift1, setUnterschrift1]   = useState('');
  const [unterschrift2, setUnterschrift2]   = useState('');
  const [sig1, setSig1] = useState('');
  const [sig2, setSig2] = useState('');
  const [abschluss, setAbschluss]           = useState(null); // {code, kassenende, umsatz, ...}
  const ref  = () => adb.collection(profile||'k21-cafe').doc('data');
  const write = (patch) => { const d={...DEFAULT_CAFE(),...cafe,...patch}; serverWrite(profile||'k21-cafe',d); withRetry(() => ref().set(d), e=>toast(e.message,'error')); };
  const role  = (user.role||'').toLowerCase();
  const isAdmin = ['owner','admin'].includes(role);

  const generateCode = (schicht) => {
    const d = new Date(schicht.start);
    const p = n => String(n).padStart(2,'0');
    const datum = `${p(d.getDate())}${p(d.getMonth()+1)}${String(d.getFullYear()).slice(2)}`;
    const zeit  = `${p(d.getHours())}${p(d.getMinutes())}`;
    const rand  = Math.random().toString(36).toUpperCase().slice(2,6);
    return `K21-${datum}-${zeit}-${rand}`;
  };

  const deleteSchicht = (id) => {
    const s = (cafe.schichten||[]).find(x=>x.id===id);
    const bestellCount = (cafe.bestellungen||[]).filter(b=>b.schicht_id===id).length;
    const msg = bestellCount > 0
      ? `Schicht von ${s?.kassiererName||'?'} löschen?\n${bestellCount} Bestellungen werden ebenfalls aus der Statistik entfernt.`
      : `Schicht von ${s?.kassiererName||'?'} löschen?`;
    if (!window.confirm(msg)) return;
    write({
      schichten:    (cafe.schichten||[]).filter(x=>x.id!==id),
      bestellungen: (cafe.bestellungen||[]).filter(b=>b.schicht_id!==id),
    });
    toast('Schicht gelöscht','warn');
  };

  const startSchicht = () => {
    const neu = {
      id:genId(), kassiererId:user.id, kassiererName:user.name,
      start:new Date().toISOString(), ende:null,
      kassenstart:parseFloat(kassenstart)||0, kassenende:null,
      bestellungen_count:0, umsatz:0,
    };
    setActiveSchicht(neu);
    toast('Schicht gestartet ✓');
    { const _d={...DEFAULT_CAFE(),...cafe, schichten:[...(cafe.schichten||[]),neu]}; serverWrite(profile||'k21-cafe',_d); withRetry(() => ref().set(_d), e=>toast(e.message,'error')); }
  };

  const endeSchicht = () => {
    if (!sig1) { toast('Kassierer muss unterschreiben','error'); return; }
    if (!sig2) { toast('Zweite Person muss unterschreiben','error'); return; }
    const code = generateCode(activeSchicht);
    const updated = {
      ...activeSchicht,
      ende: new Date().toISOString(),
      kassenende: parseFloat(endeKassenende)||0,
      abgenommen_von: unterschrift2.trim()||'Person 2',
      abgenommen_kassierer: unterschrift1.trim()||activeSchicht.kassiererName,
      umschlag_code: code,
      sig_kassierer: sig1,
      sig_zweite: sig2,
    };
    setActiveSchicht(null);
    setShowEndeModal(false);
    setShowBericht(false);
    setAbschluss({
      code,
      kassenende: parseFloat(endeKassenende)||0,
      kassenstart: activeSchicht.kassenstart||0,
      umsatz: activeSchicht.umsatz||0,
      bestellungen: activeSchicht.bestellungen_count||0,
      kassierer: activeSchicht.kassiererName,
      start: activeSchicht.start,
      barEinnahmen,
      sig1, sig2,
    });
    { const _d={...DEFAULT_CAFE(),...cafe, schichten:(cafe.schichten||[]).map(s=>s.id===activeSchicht.id?updated:s)}; serverWrite(profile||'k21-cafe',_d); withRetry(() => ref().set(_d), e=>toast(e.message,'error')); }
  };

  const schichtBestellungen = useMemo(() =>
    activeSchicht ? (cafe.bestellungen||[]).filter(b=>b.schicht_id===activeSchicht.id&&b.status!=='storniert') : [],
    [cafe.bestellungen, activeSchicht]);

  const zahlungsBreakdown = useMemo(() => {
    const map = {};
    schichtBestellungen.forEach(b=>{
      (b.zahlung||[]).forEach(z=>{
        const key = z.name||z.art;
        map[key] = (map[key]||0) + z.betrag;
      });
    });
    return map;
  }, [schichtBestellungen]);

  const topProdukteSchicht = useMemo(() => {
    const map = {};
    schichtBestellungen.forEach(b=>(b.artikel||[]).forEach(a=>{
      if (!map[a.name]) map[a.name]={name:a.name,count:0,betrag:0};
      map[a.name].count+=a.menge; map[a.name].betrag+=a.preis*a.menge;
    }));
    return Object.values(map).sort((a,b)=>b.count-a.count).slice(0,6);
  }, [schichtBestellungen]);

  const schichtUmsatz = schichtBestellungen.reduce((s,b)=>s+b.gesamt,0);
  const barEinnahmen  = useMemo(()=>schichtBestellungen.reduce((s,b)=>s+(b.zahlung||[]).filter(z=>z.art==='bar'||(z.name||'').toLowerCase()==='bar'||(z.name||'').toLowerCase()==='bargeld').reduce((a,z)=>a+z.betrag,0),0),[schichtBestellungen]);
  const kassenDiff    = endeKassenende!=='' ? (parseFloat(endeKassenende)||0)-(activeSchicht?.kassenstart||0)-barEinnahmen : null;

  const dauer = useMemo(() => {
    if (!activeSchicht) return '';
    const ms = Date.now() - new Date(activeSchicht.start).getTime();
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
    return `${h}h ${m}min`;
  }, [activeSchicht]);

  const vergangeneSchichten = useMemo(() =>
    (cafe.schichten||[]).filter(s=>s.ende).sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,10),
    [cafe.schichten]);

  if (!activeSchicht) {
    return (
      <div>
        {/* Kassierer/Teamleiter: show start form. Admin/Owner: just show info */}
        {!isAdmin ? (
          <div className="glass rounded-2xl glow p-6 max-w-md mb-6">
            <h2 className="text-sm font-bold text-slate-800 mb-4">Neue Schicht starten</h2>
            <label className="text-xs font-semibold text-slate-600 mb-1 block">Kassenstart (Bargeld in Kasse)</label>
            <input type="number" className={INP + ' mb-4'} placeholder="z.B. 50.00"
              value={kassenstart} onChange={e=>setKassenstart(e.target.value)} step="0.01"/>
            <button onClick={startSchicht}
              className="w-full py-3 rounded-xl text-sm font-bold text-white"
              style={{background:'#000000'}}>
              Schicht starten
            </button>
          </div>
        ) : (
          <div className="glass rounded-2xl glow p-4 max-w-md mb-6 flex items-center gap-3" style={{borderLeft:'3px solid #f59e0b'}}>
            <SI p={IC.shift} size={18} stroke={1.5} style={{color:'#f59e0b',flexShrink:0}}/>
            <div>
              <div className="text-sm font-bold text-slate-700">Keine aktive Schicht</div>
              <div className="text-xs text-slate-400 mt-0.5">Schichten werden von Kassierern gestartet</div>
            </div>
          </div>
        )}
        {vergangeneSchichten.length > 0 && (
          <div>
            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Vergangene Schichten</h3>
            <div className="flex flex-col gap-2">
              {vergangeneSchichten.map(s=>(
                <div key={s.id} className="glass rounded-xl px-4 py-3 flex items-center justify-between">
                  <div>
                    <div className="text-sm font-semibold text-slate-700">{s.kassiererName}</div>
                    <div className="text-xs text-slate-400">{fmtDateTime(s.start)} – {fmtTime(s.ende)}</div>
                    {s.abgenommen_von && (
                      <div className="text-xs text-slate-400 mt-0.5">
                        Bestätigt: {s.abgenommen_kassierer||s.kassiererName} &amp; {s.abgenommen_von}
                      </div>
                    )}
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <div className="text-sm font-bold text-slate-800">{fmtEur(s.umsatz||0)}</div>
                      <div className="text-xs text-slate-400">{s.bestellungen_count||0} Bestellungen</div>
                    </div>
                    {can(user.role,'einstellungen') && (
                      <button onClick={()=>deleteSchicht(s.id)}
                        className="p-1.5 rounded-lg text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all">
                        <SI p={IC.trash} size={14}/>
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="max-w-xl">
      <div className="glass rounded-2xl glow p-6 mb-4">
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-sm font-bold text-slate-800">Aktive Schicht</h2>
          <span className="pill" style={{background:'#d1fae5',color:'#065f46'}}>Läuft</span>
        </div>
        <div className="grid grid-cols-2 gap-4 mb-4">
          {[
            ['Kassierer',activeSchicht.kassiererName],
            ['Gestartet',fmtDateTime(activeSchicht.start)],
            ['Dauer',dauer],
            ['Kassenstart',fmtEur(activeSchicht.kassenstart||0)],
            ['Bestellungen',activeSchicht.bestellungen_count||0],
            ['Umsatz',fmtEur(activeSchicht.umsatz||0)],
          ].map(([l,v])=>(
            <div key={l}>
              <div className="text-xs text-slate-400">{l}</div>
              <div className="text-sm font-bold text-slate-800">{v}</div>
            </div>
          ))}
        </div>
        {Object.entries(zahlungsBreakdown).length > 0 && (
          <div className="rounded-xl p-3 mb-4" style={{background:'#f8fafc'}}>
            <p className="text-xs font-semibold text-slate-500 mb-2">Zahlungsarten</p>
            {Object.entries(zahlungsBreakdown).map(([art,betrag])=>(
              <div key={art} className="flex justify-between text-xs py-0.5">
                <span className="text-slate-600">{art}</span>
                <span className="font-semibold">{fmtEur(betrag)}</span>
              </div>
            ))}
          </div>
        )}
        <button onClick={()=>{ setUnterschrift1(user.name||''); setUnterschrift2(''); setEndeKassenende(''); setSig1(''); setSig2(''); setShowEndeModal(true); }}
          className="w-full py-3 rounded-xl text-sm font-bold text-red-600 border border-red-200 hover:bg-red-50 transition-all">
          Schicht beenden
        </button>
      </div>

      {/* Vier-Augen-Schichtende-Modal */}
      {showEndeModal && (
        <div className="modal-overlay" style={{position:'fixed',inset:0,zIndex:5000,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px',background:'rgba(0,0,0,0.75)'}}
          onClick={e=>{ if(e.target===e.currentTarget) setShowEndeModal(false); }}>
          <div className="glass rounded-2xl glow w-full" style={{maxWidth:'560px',maxHeight:'92vh',overflowY:'auto'}}>
            {/* Header */}
            <div className="flex items-center justify-between px-5 py-4" style={{borderBottom:'1px solid rgba(0,0,0,0.08)',position:'sticky',top:0,background:'rgba(255,255,255,0.99)',zIndex:10}}>
              <div>
                <h3 className="font-semibold text-slate-800 text-sm">Schicht beenden — Vier-Augen-Prinzip</h3>
                <div className="text-xs text-slate-400 mt-0.5">Zwei Personen müssen die Schicht bestätigen</div>
              </div>
              <button onClick={()=>setShowEndeModal(false)} className="text-slate-400 hover:text-slate-700"><SI p={IC.x} size={15}/></button>
            </div>
            <div className="p-5 flex flex-col gap-5">

              {/* Schicht-Zusammenfassung */}
              <div>
                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-3">Schicht-Zusammenfassung</h4>
                <div className="grid gap-3" style={{gridTemplateColumns:'1fr 1fr'}}>
                  {[
                    ['Kassierer',    activeSchicht.kassiererName],
                    ['Gestartet',    fmtDateTime(activeSchicht.start)],
                    ['Dauer',        dauer],
                    ['Kassenstart',  fmtEur(activeSchicht.kassenstart||0)],
                    ['Bestellungen', schichtBestellungen.length],
                    ['Umsatz',       fmtEur(schichtUmsatz)],
                  ].map(([l,v])=>(
                    <div key={l} className="rounded-xl p-3" style={{background:'#f8fafc'}}>
                      <div className="text-xs text-slate-400">{l}</div>
                      <div className="text-sm font-bold text-slate-800">{v}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Zahlungsarten */}
              {Object.entries(zahlungsBreakdown).length > 0 && (
                <div>
                  <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Zahlungsarten</h4>
                  <div className="rounded-xl p-3 flex flex-col gap-1.5" style={{background:'#f8fafc'}}>
                    {Object.entries(zahlungsBreakdown).sort((a,b)=>b[1]-a[1]).map(([art,betrag])=>(
                      <div key={art} className="flex items-center gap-2">
                        <span className="text-xs text-slate-600 flex-1">{art}</span>
                        <div className="flex-1 rounded-full overflow-hidden" style={{height:'6px',background:'#e2e8f0'}}>
                          <div style={{height:'100%',width:`${schichtUmsatz>0?(betrag/schichtUmsatz*100).toFixed(1):0}%`,background:'#6366f1',borderRadius:'9px'}}/>
                        </div>
                        <span className="text-xs font-semibold text-slate-700 text-right" style={{width:'60px'}}>{fmtEur(betrag)}</span>
                        <span className="text-xs text-slate-400" style={{width:'30px',textAlign:'right'}}>{schichtUmsatz>0?(betrag/schichtUmsatz*100).toFixed(0):0}%</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Top Produkte */}
              {topProdukteSchicht.length > 0 && (
                <div>
                  <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Meistverkaufte Produkte</h4>
                  <div className="rounded-xl p-3 flex flex-col gap-1.5" style={{background:'#f8fafc'}}>
                    {topProdukteSchicht.map((p,i)=>(
                      <div key={p.name} className="flex items-center gap-2">
                        <span className="text-xs font-bold text-slate-300 w-4 text-right">{i+1}</span>
                        <span className="text-xs text-slate-600 flex-1 truncate">{p.name}</span>
                        <span className="text-xs text-slate-400">{p.count}×</span>
                        <span className="text-xs font-semibold text-slate-700" style={{width:'56px',textAlign:'right'}}>{fmtEur(p.betrag)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Kassenende + Differenz */}
              <div>
                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Kassenabschluss</h4>
                <label className="text-xs font-semibold text-slate-600 mb-1 block">Bargeld gezählt (Kassenende)</label>
                <input type="number" className={INP+' mb-2'} placeholder="z.B. 80.00"
                  value={endeKassenende} onChange={e=>setEndeKassenende(e.target.value)} step="0.01"/>
                {kassenDiff !== null && (
                  <div className="rounded-xl px-4 py-2.5 flex items-center justify-between" style={{background: kassenDiff<-0.01?'#fef2f2':kassenDiff>0.01?'#f0fdf4':'#f8fafc'}}>
                    <span className="text-xs font-semibold text-slate-600">Kassendifferenz (Ist − Soll)</span>
                    <span className="text-sm font-bold" style={{color:kassenDiff<-0.01?'#dc2626':kassenDiff>0.01?'#16a34a':'#475569'}}>
                      {kassenDiff>=0?'+':''}{fmtEur(kassenDiff)}
                    </span>
                  </div>
                )}
              </div>

              {/* Vier-Augen-Unterschriften */}
              <div className="flex flex-col gap-4">
                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wide">Unterschriften — Vier-Augen-Prinzip</h4>

                {/* Kassierer */}
                <div>
                  <input className={INP+' mb-2'} placeholder="Name Kassierer (optional)"
                    value={unterschrift1} onChange={e=>setUnterschrift1(e.target.value)}/>
                  <SignaturePad label="Unterschrift Kassierer" value={sig1} onChange={setSig1}/>
                </div>

                {/* Zweite Person */}
                <div>
                  <input className={INP+' mb-2'} placeholder="Name zweite Person (optional)"
                    value={unterschrift2} onChange={e=>setUnterschrift2(e.target.value)}/>
                  <SignaturePad label="Unterschrift zweite Person" value={sig2} onChange={setSig2}/>
                </div>

                <p className="text-xs text-slate-400">Beide Personen müssen das Feld mit der Hand unterschreiben.</p>
              </div>

              {/* Bestätigen */}
              <button onClick={endeSchicht}
                disabled={!sig1||!sig2}
                className="w-full py-3 rounded-xl text-sm font-bold transition-all"
                style={{background:sig1&&sig2?'#dc2626':'#f1f5f9', color:sig1&&sig2?'#fff':'#94a3b8', cursor:sig1&&sig2?'pointer':'not-allowed'}}>
                Schicht verbindlich beenden
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Abschluss-Code Modal ── */}
      {abschluss && (
        <div className="modal-overlay" style={{position:'fixed',inset:0,zIndex:6000,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px',background:'rgba(0,0,0,0.85)'}}>
          <div className="glass rounded-2xl glow w-full" style={{maxWidth:'440px'}}>
            <div className="p-6 flex flex-col gap-5">
              {/* Success header */}
              <div className="text-center">
                <div className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3" style={{background:'#f0fdf4'}}>
                  <SI p={IC.check} size={28} stroke={2.5} style={{color:'#16a34a'}}/>
                </div>
                <h3 className="text-lg font-bold text-slate-800">Schicht abgeschlossen</h3>
                <p className="text-xs text-slate-400 mt-1">Bitte den Code auf den Bargeld-Umschlag schreiben</p>
              </div>

              {/* Code */}
              <div className="rounded-2xl p-5 text-center" style={{background:'#f8fafc',border:'2px dashed #cbd5e1'}}>
                <div className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-widest">Umschlag-Code</div>
                <div className="text-2xl font-bold text-slate-900 tracking-widest mb-3" style={{fontFamily:'monospace,monospace'}}>{abschluss.code}</div>
                <button onClick={()=>{ navigator.clipboard?.writeText(abschluss.code); toast('Code kopiert'); }}
                  className="text-xs text-slate-400 hover:text-slate-700 flex items-center gap-1 mx-auto transition-all">
                  <SI p={IC.copy} size={12}/> Code kopieren
                </button>
              </div>

              {/* Abrechnung */}
              <div className="grid grid-cols-2 gap-2">
                {[
                  ['Kassierer',   abschluss.kassierer],
                  ['Datum',       fmtDate(abschluss.start)],
                  ['Kassenstart', fmtEur(abschluss.kassenstart)],
                  ['Kassenende',  fmtEur(abschluss.kassenende)],
                  ['Bar-Einnahmen', fmtEur(abschluss.barEinnahmen)],
                  ['Gesamt-Umsatz', fmtEur(abschluss.umsatz)],
                ].map(([l,v])=>(
                  <div key={l} className="rounded-xl px-3 py-2" style={{background:'#f8fafc'}}>
                    <div className="text-xs text-slate-400">{l}</div>
                    <div className="text-sm font-bold text-slate-800">{v}</div>
                  </div>
                ))}
              </div>

              {/* Signaturen */}
              {(abschluss.sig1||abschluss.sig2) && (
                <div className="grid gap-3" style={{gridTemplateColumns:'1fr 1fr'}}>
                  {[['Kassierer',abschluss.sig1],['Zweite Person',abschluss.sig2]].map(([lbl,src])=>src?(
                    <div key={lbl}>
                      <div className="text-xs text-slate-400 mb-1">{lbl}</div>
                      <img src={src} alt={lbl} style={{width:'100%',height:'60px',objectFit:'contain',border:'1px solid #e2e8f0',borderRadius:'8px',background:'#fff'}}/>
                    </div>
                  ):null)}
                </div>
              )}

              <button onClick={()=>setAbschluss(null)}
                className="w-full py-3 rounded-xl text-sm font-bold text-white"
                style={{background:'#000000'}}>
                Fertig
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── ProdukteView ─────────────────────────────────────────────────────────────
const ProdukteView = ({ cafe, toast, profile }) => {
  const [modal, setModal]       = useState(null);
  const [katModal, setKatModal] = useState(null);
  const [form, setForm]         = useState({name:'',preis:'',kategorie_id:'',beschreibung:'',aktiv:true});
  const [katForm, setKatForm]   = useState({name:'',farbe:'#6366f1'});
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#10b981','#06b6d4','#3b82f6'];
  const ref   = () => adb.collection(profile||'k21-cafe').doc('data');
  const write = (patch) => { const d={...DEFAULT_CAFE(),...cafe,...patch}; serverWrite(profile||'k21-cafe',d); withRetry(() => ref().set(d), e=>toast(e.message,'error')); };

  const saveProdukt = () => {
    if (!form.name.trim()||!form.preis) { toast('Name und Preis erforderlich','error'); return; }
    let produkte = [...(cafe.produkte||[])];
    if (modal==='add') {
      produkte = [...produkte, {id:genId(),name:form.name.trim(),preis:parseFloat(form.preis),kategorie_id:form.kategorie_id,beschreibung:form.beschreibung,aktiv:true}];
    } else {
      produkte = produkte.map(p=>p.id===modal?{...p,name:form.name.trim(),preis:parseFloat(form.preis),kategorie_id:form.kategorie_id,beschreibung:form.beschreibung}:p);
    }
    setModal(null);
    toast(modal==='add'?'Produkt hinzugefügt ✓':'Produkt aktualisiert ✓');
    write({produkte});
  };

  const toggleAktiv   = (p) => write({produkte:(cafe.produkte||[]).map(x=>x.id===p.id?{...x,aktiv:!x.aktiv}:x)});
  const deleteProdukt = (id) => { write({produkte:(cafe.produkte||[]).filter(p=>p.id!==id)}); toast('Produkt gelöscht','warn'); };

  const saveKat = () => {
    if (!katForm.name.trim()) return;
    let kategorien = [...(cafe.kategorien||[])];
    if (katModal==='add') {
      kategorien = [...kategorien,{id:genId(),name:katForm.name.trim(),farbe:katForm.farbe}];
    } else {
      kategorien = kategorien.map(k=>k.id===katModal?{...k,name:katForm.name.trim(),farbe:katForm.farbe}:k);
    }
    setKatModal(null);
    toast('Kategorie gespeichert ✓');
    write({kategorien});
  };

  const deleteKat = (id) => {
    const kat = (cafe.kategorien||[]).find(k=>k.id===id);
    const count = (cafe.produkte||[]).filter(p=>p.kategorie_id===id).length;
    const msg = count>0
      ? `"${kat?.name}" löschen? Die ${count} zugehörigen Produkte bleiben erhalten (ohne Kategorie).`
      : `"${kat?.name}" löschen?`;
    if (!window.confirm(msg)) return;
    write({kategorien:(cafe.kategorien||[]).filter(k=>k.id!==id)});
    toast('Kategorie gelöscht','warn');
  };

  const openAdd  = () => { setForm({name:'',preis:'',kategorie_id:cafe.kategorien?.[0]?.id||'',beschreibung:'',aktiv:true}); setModal('add'); };
  const openEdit = (p) => { setForm({name:p.name,preis:p.preis,kategorie_id:p.kategorie_id||'',beschreibung:p.beschreibung||'',aktiv:p.aktiv!==false}); setModal(p.id); };

  const groupedByKat = useMemo(() => {
    const map = {};
    (cafe.kategorien||[]).forEach(k=>{ map[k.id]={kat:k,produkte:[]}; });
    map['_none'] = {kat:{id:'_none',name:'Ohne Kategorie',farbe:'#94a3b8'},produkte:[]};
    (cafe.produkte||[]).forEach(p=>{
      if (map[p.kategorie_id]) map[p.kategorie_id].produkte.push(p);
      else map['_none'].produkte.push(p);
    });
    // always show real categories (even if empty), only hide _none if empty
    return Object.values(map).filter(g=>g.kat.id==='_none'?g.produkte.length>0:true);
  }, [cafe.produkte, cafe.kategorien]);

  const totalProdukte = (cafe.produkte||[]).length;
  const aktivCount    = (cafe.produkte||[]).filter(p=>p.aktiv!==false).length;

  return (
    <div>
      {/* Toolbar */}
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-sm font-bold text-slate-800">Produkte</h2>
          <p className="text-xs text-slate-400 mt-0.5">{aktivCount} aktiv · {totalProdukte} gesamt</p>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>{setKatForm({name:'',farbe:'#6366f1'});setKatModal('add');}}
            className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border border-black/10 text-slate-600 hover:bg-black/5 transition-all">
            <SI p={IC.tag} size={13}/>Kategorie
          </button>
          <button onClick={openAdd}
            className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white"
            style={{background:'#000000'}}>
            <SI p={IC.plus} size={14}/>Produkt
          </button>
        </div>
      </div>

      {totalProdukte===0 && (
        <div className="text-center py-20 text-slate-400 text-sm">
          <div className="text-3xl mb-3">🗂</div>
          Noch keine Produkte. Erstelle zuerst eine Kategorie, dann füge Produkte hinzu.
        </div>
      )}

      {/* Grouped sections */}
      <div className="flex flex-col gap-6">
        {groupedByKat.map(({kat,produkte}) => (
          <div key={kat.id}>
            {/* Category header */}
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <div style={{width:4,height:20,borderRadius:2,background:kat.farbe,flexShrink:0}}/>
                <span className="text-sm font-bold text-slate-800">{kat.name}</span>
                <span className="pill text-xs" style={{background:kat.farbe+'18',color:kat.farbe}}>
                  {produkte.length} {produkte.length===1?'Produkt':'Produkte'}
                </span>
              </div>
              {kat.id !== '_none' && (
                <div className="flex items-center gap-1">
                  <button onClick={()=>{setKatForm({name:kat.name,farbe:kat.farbe});setKatModal(kat.id);}}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-black/5 transition-all">
                    <SI p={IC.edit} size={13}/>
                  </button>
                  <button onClick={()=>deleteKat(kat.id)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all">
                    <SI p={IC.trash} size={13}/>
                  </button>
                </div>
              )}
            </div>

            {/* Product table */}
            <div className="glass rounded-2xl glow overflow-hidden">
              {produkte.map((p,i) => (
                <div key={p.id}
                  className={`flex items-center gap-4 px-4 py-3 transition-all ${p.aktiv===false?'opacity-40 bg-slate-50':''}`}
                  style={{borderBottom: i<produkte.length-1 ? '1px solid rgba(0,0,0,0.05)' : 'none'}}>

                  {/* Color dot */}
                  <div style={{width:8,height:8,borderRadius:'50%',background:p.aktiv!==false?kat.farbe:'#cbd5e1',flexShrink:0}}/>

                  {/* Name + description */}
                  <div style={{flex:1,minWidth:0}}>
                    <div className="text-sm font-semibold text-slate-800 truncate">{p.name}</div>
                    {p.beschreibung && <div className="text-xs text-slate-400 truncate">{p.beschreibung}</div>}
                  </div>

                  {/* Price */}
                  <span className="text-sm font-bold text-slate-900 flex-shrink-0">{fmtEur(p.preis)}</span>

                  {/* Active toggle */}
                  <button onClick={()=>toggleAktiv(p)}
                    className={`toggle flex-shrink-0 ${p.aktiv!==false?'on':''}`}
                    style={{background:p.aktiv!==false?kat.farbe:'#cbd5e1'}}/>

                  {/* Edit / Delete */}
                  <button onClick={()=>openEdit(p)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-black/5 transition-all flex-shrink-0">
                    <SI p={IC.edit} size={14}/>
                  </button>
                  <button onClick={()=>deleteProdukt(p.id)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all flex-shrink-0">
                    <SI p={IC.trash} size={14}/>
                  </button>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      {/* Produkt Modal */}
      {modal && (
        <Modal title={modal==='add'?'Produkt hinzufügen':'Produkt bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={form.name} onChange={e=>set('name',e.target.value)} placeholder="z.B. Cappuccino" autoFocus/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Preis (€)</label>
              <input type="number" className={INP} value={form.preis} onChange={e=>set('preis',e.target.value)} step="0.10" min="0" placeholder="2.50"/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Kategorie</label>
              <select className={INP} value={form.kategorie_id} onChange={e=>set('kategorie_id',e.target.value)}>
                <option value="">Keine Kategorie</option>
                {(cafe.kategorien||[]).map(k=><option key={k.id} value={k.id}>{k.name}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Beschreibung (optional)</label>
              <input className={INP} value={form.beschreibung} onChange={e=>set('beschreibung',e.target.value)} placeholder="z.B. Mit Oatly Haferdrink"/>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700 hover:bg-black/5 transition-all">Abbrechen</button>
              <button onClick={saveProdukt} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#000000'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}

      {/* Kategorie Modal */}
      {katModal && (
        <Modal title={katModal==='add'?'Kategorie hinzufügen':'Kategorie bearbeiten'} onClose={()=>setKatModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={katForm.name} onChange={e=>setKatForm(p=>({...p,name:e.target.value}))} placeholder="z.B. Heißgetränke" autoFocus/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Farbe</label>
              <div className="flex flex-wrap gap-2">
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>setKatForm(p=>({...p,farbe:c}))}
                    className="w-8 h-8 rounded-full transition-all hover:scale-110 flex items-center justify-center"
                    style={{background:c,outline:katForm.farbe===c?`3px solid ${c}`:'3px solid transparent',outlineOffset:'2px'}}>
                    {katForm.farbe===c && <SI p={IC.check} size={12} stroke={3}/>}
                  </button>
                ))}
              </div>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setKatModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={saveKat} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#000000'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── ZahlungsMethodenView ─────────────────────────────────────────────────────
const EMPTY_ZM = () => ({name:'', mindestbetrag:'', maximalbetrag:'', gutschein:false, gutschein_typ:'betrag', gutschein_wert:''});

const ZahlungsMethodenView = ({ cafe, toast, profile }) => {
  const [modal, setModal] = useState(null);
  const [form, setForm]   = useState(EMPTY_ZM());
  const sf = (k,v) => setForm(p=>({...p,[k]:v}));
  const methoden = cafe.zahlungsmethoden || [];

  const ref   = () => adb.collection(profile||'k21-cafe').doc('data');
  const write = (zm) => { const d={...DEFAULT_CAFE(),...cafe,zahlungsmethoden:zm}; serverWrite(profile||'k21-cafe',d); withRetry(() => ref().set(d), e=>toast(e.message,'error')); };

  const save = () => {
    if (!form.name.trim()) { toast('Name erforderlich','error'); return; }
    const entry = {
      name: form.name.trim(),
      mindestbetrag: parseFloat(form.mindestbetrag)||0,
      maximalbetrag: parseFloat(form.maximalbetrag)||0,
      gutschein: !!form.gutschein,
      gutschein_typ: form.gutschein ? form.gutschein_typ : null,
      gutschein_wert: form.gutschein ? (parseFloat(form.gutschein_wert)||0) : null,
    };
    let zm = [...methoden];
    if (modal==='add') {
      zm = [...zm, {id:genId(), ...entry, aktiv:true}];
    } else {
      zm = zm.map(m=>m.id===modal ? {...m, ...entry} : m);
    }
    setModal(null);
    toast(modal==='add'?'Hinzugefügt ✓':'Aktualisiert ✓');
    write(zm);
  };

  const toggleAktiv = (m) => write(methoden.map(x=>x.id===m.id?{...x,aktiv:!x.aktiv}:x));
  const del = (id) => { write(methoden.filter(x=>x.id!==id)); toast('Gelöscht','warn'); };

  const openAdd  = () => { setForm(EMPTY_ZM()); setModal('add'); };
  const openEdit = (m) => {
    setForm({
      name: m.name,
      mindestbetrag: m.mindestbetrag||'',
      maximalbetrag: m.maximalbetrag||'',
      gutschein: !!m.gutschein,
      gutschein_typ: m.gutschein_typ||'betrag',
      gutschein_wert: m.gutschein_wert||'',
    });
    setModal(m.id);
  };

  // Badge helper
  const badges = (m) => {
    const out = [];
    if (m.aktiv) out.push({label:'Aktiv', bg:'#d1fae5', col:'#065f46'});
    else         out.push({label:'Inaktiv', bg:'#f1f5f9', col:'#64748b'});
    if (m.mindestbetrag>0) out.push({label:`Min. ${fmtEur(m.mindestbetrag)}`, bg:'#fef3c7', col:'#92400e'});
    if (m.maximalbetrag>0) out.push({label:`Max. ${fmtEur(m.maximalbetrag)}`, bg:'#fee2e2', col:'#991b1b'});
    if (m.gutschein) {
      const v = m.gutschein_typ==='produkte'
        ? `${m.gutschein_wert} Produkt${m.gutschein_wert===1?'':'e'}`
        : fmtEur(m.gutschein_wert||0);
      out.push({label:`Gutschein · ${v}`, bg:'#ede9fe', col:'#6d28d9'});
    }
    return out;
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-sm font-bold text-slate-800">Zahlungsmethoden</h2>
          <p className="text-xs text-slate-400 mt-0.5">{methoden.filter(m=>m.aktiv).length} von {methoden.length} aktiv</p>
        </div>
        <button onClick={openAdd}
          className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white" style={{background:'#000000'}}>
          <SI p={IC.plus} size={14}/>Methode
        </button>
      </div>

      {methoden.length===0 && (
        <div className="text-center py-16 text-slate-400 text-sm">
          Noch keine Zahlungsmethoden
        </div>
      )}

      <div className="glass rounded-2xl glow overflow-hidden">
        {methoden.map((m,i)=>(
          <div key={m.id}
            className={`flex items-center gap-4 px-4 py-4 transition-all ${!m.aktiv?'opacity-50 bg-slate-50':''}`}
            style={{borderBottom:i<methoden.length-1?'1px solid rgba(0,0,0,0.05)':'none'}}>

            {/* Left: name + badges */}

              </button>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title={modal==='add'?'Zahlungsmethode hinzufügen':'Methode bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-4">

            {/* Name */}

              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>

                placeholder="z.B. Bar, Karte, PayPal" autoFocus/>
            </div>

            {/* Min / Max */}
            <div className="grid gap-3" style={{gridTemplateColumns:'1fr 1fr'}}>
              <div>
                <label className="text-xs font-semibold text-slate-600 mb-1 block">Mindestbetrag (€)</label>

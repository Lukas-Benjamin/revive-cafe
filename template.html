<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K21 Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp("__FIREBASE_CONFIG__");
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  </script>
  <style>
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    body { background: #f8fafc; color: #0f172a; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }
    .glass { background: #ffffff; border: 1px solid rgba(0,0,0,0.08); }
    .glass-hover:hover { background: #f1f5f9; }
    .glow { box-shadow: 0 4px 32px rgba(0,0,0,0.08); }
    .grad { color: #0f172a; -webkit-text-fill-color: #0f172a; background: none; font-weight: 900; letter-spacing: -0.03em; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: rgba(0,0,0,0.25) !important; }
    select option { background: #ffffff; color: #0f172a; }
    @keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .up { animation: up .2s ease; }
    .pill { display:inline-flex; align-items:center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .toggle { width: 36px; height: 20px; border-radius: 10px; position: relative; cursor: pointer; transition: background .2s; border: none; }
    .toggle::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s; }
    .toggle.on::after { transform: translateX(16px); }
    .modal-overlay { animation: fadeIn .15s ease; }
    .product-btn:active { transform: scale(0.96); }
    .product-btn { transition: transform .1s, box-shadow .1s; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── Icons ────────────────────────────────────────────────────────────────────
const SI = ({ p, size=16, stroke=2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">
    {[].concat(p).map((d,i) => <path key={i} d={d}/>)}
  </svg>
);
const IC = {
  plus:     "M12 5v14M5 12h14",
  edit:     ["M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5","M17.586 3.586a2 2 0 012.828 2.828L12 15l-4 1 1-4 8.586-8.586z"],
  trash:    ["M3 6h18","M19 6l-1 14H6L5 6","M8 6V4h8v2"],
  x:        "M18 6L6 18M6 6l12 12",
  check:    "M20 6L9 17l-5-5",
  chevDown: "M6 9l6 6 6-6",
  chevLeft: "M15 18l-6-6 6-6",
  chevRight:"M9 18l6-6-6-6",
  logout:   "M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1",
  users:    ["M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2","M9 11a4 4 0 100-8 4 4 0 000 8","M23 21v-2a4 4 0 00-3-3.87","M16 3.13a4 4 0 010 7.75"],
  person:   ["M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2","M12 11a4 4 0 100-8 4 4 0 000 8"],
  cart:     ["M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z","M3 6h18","M16 10a4 4 0 01-8 0"],
  bag:      ["M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z","M3 6h18"],
  orders:   ["M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2","M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2","M9 12h6M9 16h4"],
  shift:    ["M12 2v10l4 2","M2 12a10 10 0 1020 0 10 10 0 00-20 0"],
  tag:      ["M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z","M7 7h.01"],
  voucher:  ["M2 9a3 3 0 010-6h20a3 3 0 010 6","M2 15a3 3 0 000 6h20a3 3 0 000-6","M6 9v6M18 9v6"],
  card:     ["M1 4h22v16H1z","M1 10h22"],
  chart:    "M3 3v18h18M7 16l4-4 4 4 4-5",
  cog:      ["M12 15a3 3 0 100-6 3 3 0 000 6","M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"],
  lock:     ["M19 11H5a2 2 0 00-2 2v7a2 2 0 002 2h14a2 2 0 002-2v-7a2 2 0 00-2-2z","M17 11V7a5 5 0 00-10 0v4"],
  eye:      ["M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z","M12 9a3 3 0 100 6 3 3 0 000-6z"],
  eyeOff:   "M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22",
  copy:     ["M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1","M8 5a2 2 0 002 2h4a2 2 0 002-2M8 5a2 2 0 012-2h4a2 2 0 012 2"],
  minus:    "M5 12h14",
  refresh:  "M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15",
  cash:     ["M12 1v22","M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"],
  download: "M3 17v3h18v-3M12 3v11m-4-4l4 4 4-4",
};

// ─── Utilities ────────────────────────────────────────────────────────────────
const genId    = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const fmt2     = n => (n||0).toFixed(2);
const fmtEur   = n => `€${fmt2(n)}`;
const fmtTime  = ts => { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); };
const fmtDate  = ts => { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('de-DE'); };
const fmtDateTime = ts => { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); };
const initials = n => (n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
const padNum   = n => String(n).padStart(3,'0');

// ─── Constants ────────────────────────────────────────────────────────────────
const OWNER_NAME = 'Admin';
const OWNER_PIN  = 'K21ADMIN';

const DEFAULT_CAFE_PROFILES = [
  { id: 'k21-cafe', label: 'K21 Café', color: '#8b5cf6', grad: 'linear-gradient(135deg,#8b5cf6,#334155)' }
];
let CAFE_PROFILES = DEFAULT_CAFE_PROFILES;

const getAreaAccess = (user, areaId) => {
  if (!user) return 'none';
  if (user.role === 'owner') return 'full';
  const acc = user.areaAccess;
  if (!acc || acc === '__all__') return 'full';
  return Array.isArray(acc) && acc.includes(areaId) ? 'full' : 'none';
};

const COLOR_SWATCHES = ['#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#3b82f6','#f97316'];
const ColorPicker = ({ value, onChange }) => (
  <div className="flex gap-2 flex-wrap">
    {COLOR_SWATCHES.map(c => (
      <button key={c} onClick={()=>onChange(c)}
        className="w-7 h-7 rounded-full transition-all flex items-center justify-center"
        style={{background:c, outline: value===c?`3px solid ${c}`:'3px solid transparent', outlineOffset:2}}>
        {value===c && <SI p={IC.check} size={12} stroke={3} style={{color:'#fff'}}/>}
      </button>
    ))}
  </div>
);

const ROLE_LABELS = { owner:'Admin', finanzen:'Finanzen', teamleiter:'Team-Leiter', kassierer:'Kassierer', barista:'Barista' };
const ROLE_OPTIONS = ['finanzen','teamleiter','kassierer','barista'];
const INP    = "bg-black/5 border border-black/10 rounded-xl px-3 py-2.5 text-sm text-slate-800 placeholder-slate-500 transition-all w-full";
const INP_SM = "bg-black/5 border border-black/10 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 placeholder-slate-500 transition-all";

const DEFAULT_CAFE = () => ({
  produkte: [],
  kategorien: [],
  gutscheine: [],
  wertkarten: [],
  schichten: [],
  bestellungen: [],
  einstellungen: { min_karten_betrag: 10, waehrung: 'EUR' }
});

// ─── Role permissions ─────────────────────────────────────────────────────────
const can = (role, action) => {
  if (!role) return false;
  const map = {
    kasse:        ['owner','teamleiter','kassierer'],
    bestellungen: ['owner','teamleiter','kassierer','barista','finanzen'],
    schicht:      ['owner','teamleiter','kassierer'],
    produkte:     ['owner','teamleiter'],
    gutscheine:   ['owner','finanzen','teamleiter'],
    wertkarten:   ['owner','finanzen','teamleiter'],
    finanzen:     ['owner','finanzen'],
    einstellungen:['owner'],
    personen:     ['owner','teamleiter'],
    stornieren:   ['owner','teamleiter'],
  };
  return (map[action]||[]).includes(role);
};

// ─── Toast ────────────────────────────────────────────────────────────────────
const ToastContainer = ({ toasts }) => (
  <div style={{position:'fixed',bottom:20,right:20,zIndex:9000,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>
    {toasts.map(t => (
      <div key={t.id} className="up px-4 py-2.5 rounded-xl text-sm font-semibold shadow-xl"
        style={{background:t.type==='error'?'rgba(239,68,68,0.92)':t.type==='warn'?'rgba(245,158,11,0.92)':'rgba(16,185,129,0.92)',color:'#fff',pointerEvents:'auto'}}>
        {t.msg}
      </div>
    ))}
  </div>
);

const useToast = () => {
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((msg, type='ok') => {
    const id = genId();
    setToasts(p => [...p, {id,msg,type}]);
    setTimeout(() => setToasts(p => p.filter(t=>t.id!==id)), 3000);
  }, []);
  return [toasts, toast];
};

// ─── Modal ────────────────────────────────────────────────────────────────────
const Modal = ({ title, onClose, children, wide=false, extraWide=false }) => {
  useEffect(() => {
    const h = e => { if (e.key==='Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  const wCls = extraWide ? 'max-w-3xl' : wide ? 'max-w-2xl' : 'max-w-md';
  return (
    <div className="modal-overlay" style={{position:'fixed',inset:0,zIndex:5000,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px',background:'rgba(0,0,0,0.75)'}}
      onClick={e=>{ if (e.target===e.currentTarget) onClose(); }}>
      <div className={`glass rounded-2xl glow w-full ${wCls}`}
        style={{maxHeight:'92vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4"
          style={{borderBottom:'1px solid rgba(0,0,0,0.08)',position:'sticky',top:0,background:'rgba(255,255,255,0.99)',zIndex:10}}>
          <h3 className="font-semibold text-slate-800 text-sm">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 transition-all"><SI p={IC.x} size={15}/></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
};

// ─── Avatar ───────────────────────────────────────────────────────────────────
const Avatar = ({ name, color, size=32 }) => (
  <div style={{width:size,height:size,borderRadius:'50%',background:color||'#8b5cf6',display:'flex',alignItems:'center',justifyContent:'center',fontSize:Math.round(size*0.36),fontWeight:700,color:'#fff',flexShrink:0,letterSpacing:'-0.5px'}}>
    {initials(name)}
  </div>
);

// ─── SyncDot ──────────────────────────────────────────────────────────────────
const SyncDot = ({ state }) => {
  const MAP = { connecting:['#64748b','Verbinden…'], synced:['#10b981','Sync OK'], saving:['#f59e0b','Speichern…'], error:['#ef4444','Offline'] };
  const [col, label] = MAP[state] || MAP.connecting;
  return (
    <div title={label} style={{width:9,height:9,borderRadius:'50%',background:col,flexShrink:0,
      boxShadow:state==='synced'?`0 0 5px ${col}99`:'none',
      animation:state==='saving'?'pulse 1s infinite':'none'}}/>
  );
};

// ─── Login View ───────────────────────────────────────────────────────────────
const LoginView = ({ onLogin, profiles }) => {
  const [users,    setUsers]    = useState([]);
  const [ready,    setReady]    = useState(false);
  const [name,     setName]     = useState('');
  const [pin,      setPin]      = useState('');
  const [showPin,  setShowPin]  = useState(false);
  const [err,      setErr]      = useState('');
  const [dropOpen, setDropOpen] = useState(false);
  const [selProfile, setSelProfile] = useState((profiles&&profiles.length) ? profiles[0].id : 'k21-cafe');

  useEffect(() => {
    const unsub = db.collection('cafe-users').onSnapshot(
      snap => { setUsers(snap.docs.map(d=>({id:d.id,...d.data()}))); setReady(true); },
      () => setReady(true)
    );
    return () => unsub();
  }, []);

  const areaUsers = users.filter(u => getAreaAccess(u, selProfile) !== 'none');
  const allNames  = [OWNER_NAME, ...areaUsers.map(u=>u.name)];
  const filtered  = name.trim() ? allNames.filter(n=>n.toLowerCase().includes(name.toLowerCase())) : allNames;

  const tryLogin = () => {
    const n = name.trim();
    if (!n||!pin) { setErr('Bitte Name und PIN eingeben'); return; }
    if (n.toLowerCase()===OWNER_NAME.toLowerCase()&&pin===OWNER_PIN) {
      onLogin({id:'__owner__',name:OWNER_NAME,role:'owner'}, selProfile);
      return;
    }
    const u = users.find(x=>x.name.toLowerCase()===n.toLowerCase());
    if (u&&u.pin===pin) { onLogin(u, selProfile); }
    else { setErr('Name oder PIN nicht korrekt'); setPin(''); }
  };

  const INP_L = "w-full bg-black/5 border border-black/10 rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 text-sm transition-all";

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{background:'#f8fafc'}}>
      <div className="w-full max-w-xs up">
        {/* Logo + title */}
        <div className="text-center mb-8">
          <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5 border-2"
            style={{background:'#000000',borderColor:'#000000'}}>
            <span style={{fontFamily:'Montserrat,sans-serif',fontWeight:900,fontSize:22,color:'#ffffff',letterSpacing:'-1px'}}>K21</span>
          </div>
          <h1 style={{fontFamily:'Montserrat,sans-serif',fontWeight:900,fontSize:28,color:'#0f172a',letterSpacing:'-0.04em',margin:0,lineHeight:1}}>K21 Café</h1>
          <p className="text-slate-500 text-sm mt-2 tracking-wide">Point of Sale System</p>
        </div>

        <div className="glass rounded-2xl glow" style={{overflow:'visible'}}>
          <div className="p-5 space-y-3">

            {/* Area selector – only when multiple profiles */}
            {profiles && profiles.length > 1 && (
              <div>
                <p className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Bereich</p>
                <div className="flex flex-wrap gap-1.5">
                  {profiles.map(pp=>(
                    <button key={pp.id} onClick={()=>setSelProfile(pp.id)}
                      className="px-3 py-1.5 rounded-full text-xs font-bold transition-all"
                      style={{
                        background: selProfile===pp.id ? (pp.color||'#8b5cf6') : 'rgba(0,0,0,0.06)',
                        color:      selProfile===pp.id ? '#fff' : '#64748b',
                      }}>
                      {pp.label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Name input with autocomplete dropdown */}
            <div className="relative">
              <input value={name}
                onChange={e=>{setName(e.target.value);setErr('');setDropOpen(true);}}
                onFocus={()=>setDropOpen(true)}
                onBlur={()=>setTimeout(()=>setDropOpen(false),150)}
                placeholder="Dein Name" className={INP_L} autoComplete="off" autoFocus/>
              {dropOpen&&filtered.length>0&&(
                <div className="absolute top-full mt-1 left-0 right-0 glass rounded-xl z-20 glow overflow-hidden">
                  {filtered.slice(0,6).map(n=>(
                    <button key={n} onMouseDown={()=>{setName(n);setDropOpen(false);setErr('');}}
                      className="w-full text-left px-4 py-2.5 text-sm text-slate-800 hover:bg-black/5 transition-all flex items-center gap-2.5">
                      <div className="w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold"
                        style={{background:'#000000',fontSize:9}}>
                        {n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
                      </div>
                      {n}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* PIN input */}
            <div className="relative">
              <input type="text" autoComplete="off"
                style={{WebkitTextSecurity:showPin?'none':'disc'}}
                value={pin} onChange={e=>{setPin(e.target.value);setErr('');}}
                onKeyDown={e=>e.key==='Enter'&&tryLogin()}
                placeholder="PIN" className={INP_L+' pr-10'}/>
              <button type="button" onClick={()=>setShowPin(p=>!p)}
                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-all">
                <SI p={showPin?IC.eyeOff:IC.eye} size={15}/>
              </button>
            </div>

            {err&&<p className="text-red-500 text-xs">{err}</p>}

            <button onClick={tryLogin} disabled={!name.trim()||!pin||!ready}
              className="w-full py-3 text-sm font-bold text-white disabled:opacity-40 transition-all"
              style={{background:'#000000',borderRadius:30}}>
              {ready?'Anmelden':'Verbinde…'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── KasseView ────────────────────────────────────────────────────────────────
const KasseView = ({ cafe, user, toast, activeSchicht, profile }) => {
  const [warenkorb, setWarenkorb]   = useState([]);
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const [aktivKat, setAktivKat]     = useState('alle');

  const aktivProdukte = useMemo(() =>
    cafe.produkte.filter(p => p.aktiv !== false), [cafe.produkte]);

  const kategorien = useMemo(() => {
    const used = new Set(aktivProdukte.map(p=>p.kategorie_id));
    return cafe.kategorien.filter(k=>used.has(k.id));
  }, [cafe.kategorien, aktivProdukte]);

  const angezeigt = useMemo(() =>
    aktivKat==='alle' ? aktivProdukte : aktivProdukte.filter(p=>p.kategorie_id===aktivKat),
    [aktivProdukte, aktivKat]);

  const gesamt = useMemo(() => warenkorb.reduce((s,i)=>s+i.preis*i.menge,0), [warenkorb]);

  const addToCart = (p) => {
    setWarenkorb(prev => {
      const ex = prev.find(i=>i.produkt_id===p.id);
      if (ex) return prev.map(i=>i.produkt_id===p.id?{...i,menge:i.menge+1}:i);
      return [...prev, {produkt_id:p.id,name:p.name,preis:p.preis,menge:1,emoji:p.emoji}];
    });
  };

  const changeQty = (produkt_id, delta) => {
    setWarenkorb(prev => {
      const next = prev.map(i=>i.produkt_id===produkt_id?{...i,menge:i.menge+delta}:i)
        .filter(i=>i.menge>0);
      return next;
    });
  };

  const removeItem = (produkt_id) => setWarenkorb(prev=>prev.filter(i=>i.produkt_id!==produkt_id));

  const clearCart = () => setWarenkorb([]);

  return (
    <div style={{display:'flex',gap:'16px',height:'calc(100vh - 120px)',overflow:'hidden'}}>
      {/* Left: product grid */}
      <div style={{flex:'1 1 0',overflowY:'auto',paddingRight:'4px'}}>
        {/* Category tabs */}
        <div className="flex flex-wrap gap-2 mb-4">
          <button onClick={()=>setAktivKat('alle')}
            className={`pill transition-all ${aktivKat==='alle'?'text-white':'text-slate-600 bg-white border border-black/10'}`}
            style={aktivKat==='alle'?{background:'#0f172a'}:{}}>
            Alle
          </button>
          {kategorien.map(k => (
            <button key={k.id} onClick={()=>setAktivKat(k.id)}
              className={`pill transition-all ${aktivKat===k.id?'text-white border-transparent':'text-slate-700 bg-white border border-black/10'}`}
              style={aktivKat===k.id?{background:k.farbe||'#6366f1'}:{}}>
              {k.name}
            </button>
          ))}
        </div>
        {angezeigt.length === 0 && (
          <div className="text-center py-16 text-slate-400 text-sm">Keine Produkte verfügbar</div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:'10px'}}>
          {angezeigt.map(p => {
            const kat = cafe.kategorien.find(k=>k.id===p.kategorie_id);
            const inCart = warenkorb.find(i=>i.produkt_id===p.id);
            return (
              <button key={p.id} onClick={()=>addToCart(p)}
                className="product-btn glass rounded-2xl p-3 text-left relative hover:shadow-md"
                style={{minHeight:'90px'}}>
                {inCart && (
                  <span className="absolute top-2 right-2 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold text-white"
                    style={{background:'#0f172a',fontSize:'10px'}}>{inCart.menge}</span>
                )}
                <div className="text-2xl mb-1">{p.emoji||'🍵'}</div>
                <div className="text-xs font-semibold text-slate-800 leading-tight">{p.name}</div>
                <div className="text-xs font-bold mt-1" style={{color:kat?.farbe||'#6366f1'}}>{fmtEur(p.preis)}</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Right: cart */}
      <div className="glass rounded-2xl glow flex flex-col" style={{width:'300px',flexShrink:0}}>
        <div className="px-4 py-3 flex items-center justify-between" style={{borderBottom:'1px solid rgba(0,0,0,0.08)'}}>
          <span className="font-semibold text-sm text-slate-800 flex items-center gap-2">
            <SI p={IC.bag} size={15}/>Warenkorb
          </span>
          {warenkorb.length > 0 && (
            <button onClick={clearCart} className="text-xs text-slate-400 hover:text-red-500 transition-all">Leeren</button>
          )}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'8px'}}>
          {warenkorb.length===0 && (
            <div className="text-center py-8 text-slate-400 text-xs">Noch leer</div>
          )}
          {warenkorb.map(item => (
            <div key={item.produkt_id} className="flex items-center gap-2 px-2 py-2 rounded-xl glass-hover">
              <span className="text-base">{item.emoji||'🍵'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div className="text-xs font-semibold text-slate-800 truncate">{item.name}</div>
                <div className="text-xs text-slate-500">{fmtEur(item.preis * item.menge)}</div>
              </div>
              <div className="flex items-center gap-1">
                <button onClick={()=>changeQty(item.produkt_id,-1)}
                  className="w-6 h-6 rounded-lg flex items-center justify-center text-slate-600 hover:bg-black/10 transition-all">
                  <SI p={IC.minus} size={12}/>
                </button>
                <span className="text-xs font-bold w-4 text-center">{item.menge}</span>
                <button onClick={()=>changeQty(item.produkt_id,1)}
                  className="w-6 h-6 rounded-lg flex items-center justify-center text-slate-600 hover:bg-black/10 transition-all">
                  <SI p={IC.plus} size={12}/>
                </button>
              </div>
              <button onClick={()=>removeItem(item.produkt_id)}
                className="text-slate-300 hover:text-red-400 transition-all ml-1">
                <SI p={IC.x} size={13}/>
              </button>
            </div>
          ))}
        </div>
        <div className="p-4" style={{borderTop:'1px solid rgba(0,0,0,0.08)'}}>
          <div className="flex justify-between items-center mb-3">
            <span className="text-sm font-semibold text-slate-600">Gesamt</span>
            <span className="text-lg font-bold text-slate-900">{fmtEur(gesamt)}</span>
          </div>
          <button
            disabled={warenkorb.length===0 || !activeSchicht}
            onClick={()=>setCheckoutOpen(true)}
            className="w-full py-3 rounded-xl text-sm font-bold text-white transition-all disabled:opacity-40"
            style={{background:'#0f172a'}}>
            {!activeSchicht ? 'Keine Schicht aktiv' : 'Zur Kasse →'}
          </button>
          {!activeSchicht && (
            <p className="text-xs text-slate-400 text-center mt-2">Schicht starten um Bestellungen anzunehmen</p>
          )}
        </div>
      </div>

      {checkoutOpen && (
        <CheckoutModal
          warenkorb={warenkorb}
          gesamt={gesamt}
          cafe={cafe}
          schicht={activeSchicht}
          user={user}
          toast={toast}
          onClose={()=>setCheckoutOpen(false)}
          onSuccess={()=>{ clearCart(); setCheckoutOpen(false); }}
          profile={profile}
        />
      )}
    </div>
  );
};

// ─── Checkout Modal ───────────────────────────────────────────────────────────
const CheckoutModal = ({ warenkorb, gesamt, cafe, schicht, user, toast, onClose, onSuccess, profile }) => {
  const [zahlungen, setZahlungen] = useState([]);
  const [aktuelleArt, setAktuelleArt] = useState('bar');
  const [barBetrag, setBarBetrag]     = useState('');
  const [gutscheinCode, setGutscheinCode] = useState('');
  const [gutscheinBetrag, setGutscheinBetrag] = useState('');
  const [wertkarteCode, setWertkarteCode]     = useState('');
  const [wertkarteBetrag, setWertkarteBetrag] = useState('');
  const [validatedGutschein, setValidatedGutschein] = useState(null);
  const [validatedWertkarte, setValidatedWertkarte] = useState(null);
  const [saving, setSaving] = useState(false);

  const bezahlt  = zahlungen.reduce((s,z)=>s+z.betrag,0);
  const restBetrag = Math.max(0, gesamt - bezahlt);
  const wechsel   = aktuelleArt==='bar' && parseFloat(barBetrag)>restBetrag ? parseFloat(barBetrag)-restBetrag : 0;
  const minKarte  = (cafe.einstellungen||{}).min_karten_betrag || 10;

  const valGutschein = () => {
    const g = cafe.gutscheine.find(x=>x.code.toUpperCase()===gutscheinCode.toUpperCase() && x.aktiv!==false && (x.betrag_rest||0)>=0.01);
    if (!g) { toast('Gutschein nicht gefunden oder ungültig','error'); return; }
    setValidatedGutschein(g);
    setGutscheinBetrag(fmt2(Math.min(g.betrag_rest, restBetrag)));
  };

  const valWertkarte = () => {
    const w = cafe.wertkarten.find(x=>x.code.toUpperCase()===wertkarteCode.toUpperCase() && (x.guthaben||0)>=0.01);
    if (!w) { toast('Wertkarte nicht gefunden oder kein Guthaben','error'); return; }
    setValidatedWertkarte(w);
    setWertkarteBetrag(fmt2(Math.min(w.guthaben, restBetrag)));
  };

  const addZahlung = () => {
    if (aktuelleArt==='bar') {
      const b = Math.min(parseFloat(barBetrag)||0, restBetrag + wechsel);
      if (b<=0) { toast('Betrag eingeben','error'); return; }
      setZahlungen(p=>[...p,{art:'bar',betrag:Math.min(parseFloat(barBetrag)||0, restBetrag)}]);
      setBarBetrag('');
    } else if (aktuelleArt==='karte') {
      if (restBetrag < minKarte) { toast(`Mindestbetrag per Karte: ${fmtEur(minKarte)}`,'warn'); return; }
      setZahlungen(p=>[...p,{art:'karte',betrag:restBetrag}]);
    } else if (aktuelleArt==='gutschein') {
      if (!validatedGutschein) { toast('Gutschein validieren','error'); return; }
      const b = Math.min(parseFloat(gutscheinBetrag)||0, validatedGutschein.betrag_rest, restBetrag);
      if (b<=0) { toast('Betrag eingeben','error'); return; }
      setZahlungen(p=>[...p,{art:'gutschein',betrag:b,code:validatedGutschein.code,gutschein_id:validatedGutschein.id}]);
      setGutscheinCode(''); setGutscheinBetrag(''); setValidatedGutschein(null);
    } else if (aktuelleArt==='wertkarte') {
      if (!validatedWertkarte) { toast('Wertkarte validieren','error'); return; }
      const b = Math.min(parseFloat(wertkarteBetrag)||0, validatedWertkarte.guthaben, restBetrag);
      if (b<=0) { toast('Betrag eingeben','error'); return; }
      setZahlungen(p=>[...p,{art:'wertkarte',betrag:b,code:validatedWertkarte.code,wertkarte_id:validatedWertkarte.id}]);
      setWertkarteCode(''); setWertkarteBetrag(''); setValidatedWertkarte(null);
    }
  };

  const saveOrder = async () => {
    if (restBetrag > 0.005) { toast('Noch nicht vollständig bezahlt','error'); return; }
    setSaving(true);
    try {
      const ref = db.collection(profile||'k21-cafe').doc('data');
      const snap = await ref.get();
      const data = snap.exists ? snap.data() : DEFAULT_CAFE();

      // Count orders in shift for numbering
      const schichtBestellungen = (data.bestellungen||[]).filter(b=>b.schicht_id===schicht.id);
      const nummer = padNum(schichtBestellungen.length + 1);

      const neueBestellung = {
        id: genId(),
        schicht_id: schicht.id,
        nummer,
        artikel: warenkorb.map(i=>({...i, fertig:false})),
        gesamt,
        zahlung: zahlungen,
        status: 'offen',
        erstellt_am: new Date().toISOString(),
        kassiererId: user.id,
        kassiererName: user.name,
      };

      // Update gutscheine
      const updGutscheine = (data.gutscheine||[]).map(g => {
        const z = zahlungen.find(z=>z.art==='gutschein'&&z.gutschein_id===g.id);
        if (!z) return g;
        const rest = (g.betrag_rest||0) - z.betrag;
        return { ...g, betrag_rest: Math.max(0, rest), aktiv: rest > 0.005 };
      });

      // Update wertkarten
      const updWertkarten = (data.wertkarten||[]).map(w => {
        const z = zahlungen.find(z=>z.art==='wertkarte'&&z.wertkarte_id===w.id);
        if (!z) return w;
        return { ...w, guthaben: Math.max(0, (w.guthaben||0) - z.betrag) };
      });

      // Update schicht
      const updSchichten = (data.schichten||[]).map(s => {
        if (s.id!==schicht.id) return s;
        return { ...s, bestellungen_count:(s.bestellungen_count||0)+1, umsatz:(s.umsatz||0)+gesamt };
      });

      await ref.set({
        ...data,
        gutscheine: updGutscheine,
        wertkarten: updWertkarten,
        schichten: updSchichten,
        bestellungen: [...(data.bestellungen||[]), neueBestellung],
      });

      toast(`Bestellung #${nummer} gespeichert ✓`);
      onSuccess();
    } catch(e) {
      toast('Fehler beim Speichern: ' + e.message, 'error');
    }
    setSaving(false);
  };

  const artLabels = {bar:'Bar',karte:'Karte',gutschein:'Gutschein',wertkarte:'Wertkarte'};

  return (
    <Modal title="Kasse" onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        {/* Items summary */}
        <div className="rounded-xl p-3" style={{background:'#f8fafc'}}>
          {warenkorb.map(i=>(
            <div key={i.produkt_id} className="flex justify-between text-sm py-0.5">
              <span className="text-slate-600">{i.emoji} {i.name} x{i.menge}</span>
              <span className="font-semibold">{fmtEur(i.preis*i.menge)}</span>
            </div>
          ))}
          <div className="flex justify-between text-sm font-bold pt-2 mt-2" style={{borderTop:'1px solid rgba(0,0,0,0.08)'}}>
            <span>Gesamt</span><span>{fmtEur(gesamt)}</span>
          </div>
        </div>

        {/* Paid so far */}
        {zahlungen.length > 0 && (
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-2">Zahlungen</p>
            {zahlungen.map((z,i)=>(
              <div key={i} className="flex items-center justify-between text-xs py-1">
                <span className="text-slate-600">{artLabels[z.art]}{z.code?` (${z.code})`:''}</span>
                <div className="flex items-center gap-2">
                  <span className="font-semibold">{fmtEur(z.betrag)}</span>
                  <button onClick={()=>setZahlungen(p=>p.filter((_,j)=>j!==i))} className="text-slate-300 hover:text-red-400"><SI p={IC.x} size={11}/></button>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Rest */}
        <div className="flex justify-between items-center">
          <span className="text-sm font-semibold text-slate-600">Noch offen</span>
          <span className={`text-lg font-bold ${restBetrag<=0.005?'text-green-600':'text-slate-900'}`}>
            {restBetrag<=0.005 ? '✓ Bezahlt' : fmtEur(restBetrag)}
          </span>
        </div>

        {restBetrag > 0.005 && (
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-2">Zahlungsart hinzufügen</p>
            <div className="flex flex-wrap gap-2 mb-3">
              {['bar','karte','gutschein','wertkarte'].map(a=>(
                <button key={a} onClick={()=>setAktuelleArt(a)}
                  className={`pill transition-all ${aktuelleArt===a?'text-white':'text-slate-600 bg-white border border-black/10'}`}
                  style={aktuelleArt===a?{background:'#0f172a'}:{}}>
                  {artLabels[a]}
                </button>
              ))}
            </div>

            {aktuelleArt==='bar' && (
              <div className="flex gap-2">
                <input type="number" className={INP} placeholder={`Betrag (mind. ${fmtEur(restBetrag)})`}
                  value={barBetrag} onChange={e=>setBarBetrag(e.target.value)} step="0.01" min="0"/>
                <button onClick={addZahlung} className="px-4 py-2.5 rounded-xl text-sm font-semibold text-white flex-shrink-0"
                  style={{background:'#0f172a'}}>+</button>
              </div>
            )}
            {aktuelleArt==='bar' && parseFloat(barBetrag) > restBetrag && (
              <p className="text-xs text-green-600 mt-1 font-semibold">Wechselgeld: {fmtEur(parseFloat(barBetrag)-restBetrag)}</p>
            )}

            {aktuelleArt==='karte' && (
              <div>
                {restBetrag < minKarte
                  ? <p className="text-xs text-amber-600">Mindestbetrag für Kartenzahlung: {fmtEur(minKarte)}</p>
                  : <button onClick={addZahlung} className="w-full py-2.5 rounded-xl text-sm font-semibold text-white"
                      style={{background:'#0f172a'}}>
                      Karte: {fmtEur(restBetrag)} hinzufügen
                    </button>
                }
              </div>
            )}

            {aktuelleArt==='gutschein' && (
              <div className="flex flex-col gap-2">
                <div className="flex gap-2">
                  <input type="text" className={INP} placeholder="Gutschein-Code"
                    value={gutscheinCode} onChange={e=>{setGutscheinCode(e.target.value.toUpperCase());setValidatedGutschein(null);}}/>
                  <button onClick={valGutschein} className="px-4 rounded-xl text-sm font-semibold text-white flex-shrink-0"
                    style={{background:'#6366f1'}}>Prüfen</button>
                </div>
                {validatedGutschein && (
                  <div>
                    <p className="text-xs text-green-600 mb-2">Guthaben: {fmtEur(validatedGutschein.betrag_rest)}</p>
                    <div className="flex gap-2">
                      <input type="number" className={INP} placeholder="Betrag"
                        value={gutscheinBetrag} onChange={e=>setGutscheinBetrag(e.target.value)} step="0.01"/>
                      <button onClick={addZahlung} className="px-4 rounded-xl text-sm font-semibold text-white flex-shrink-0"
                        style={{background:'#0f172a'}}>+</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {aktuelleArt==='wertkarte' && (
              <div className="flex flex-col gap-2">
                <div className="flex gap-2">
                  <input type="text" className={INP} placeholder="Wertkarten-Code"
                    value={wertkarteCode} onChange={e=>{setWertkarteCode(e.target.value.toUpperCase());setValidatedWertkarte(null);}}/>
                  <button onClick={valWertkarte} className="px-4 rounded-xl text-sm font-semibold text-white flex-shrink-0"
                    style={{background:'#6366f1'}}>Prüfen</button>
                </div>
                {validatedWertkarte && (
                  <div>
                    <p className="text-xs text-green-600 mb-2">Guthaben: {fmtEur(validatedWertkarte.guthaben)}</p>
                    <div className="flex gap-2">
                      <input type="number" className={INP} placeholder="Betrag"
                        value={wertkarteBetrag} onChange={e=>setWertkarteBetrag(e.target.value)} step="0.01"/>
                      <button onClick={addZahlung} className="px-4 rounded-xl text-sm font-semibold text-white flex-shrink-0"
                        style={{background:'#0f172a'}}>+</button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        <button onClick={saveOrder} disabled={restBetrag>0.005||saving}
          className="w-full py-3 rounded-xl text-sm font-bold text-white transition-all disabled:opacity-40 mt-2"
          style={{background:'#10b981'}}>
          {saving ? 'Wird gespeichert…' : 'Bestellung abschließen ✓'}
        </button>
      </div>
    </Modal>
  );
};

// ─── BestellungenView ─────────────────────────────────────────────────────────
const BestellungenView = ({ cafe, user, toast, activeSchicht, profile }) => {
  const [filter, setFilter] = useState('aktiv');

  const bestellungen = useMemo(() => {
    let list = [...(cafe.bestellungen||[])];
    if (filter==='aktiv') list = list.filter(b=>b.status!=='storniert' && b.status!=='fertig');
    else if (filter==='fertig') list = list.filter(b=>b.status==='fertig');
    else if (filter==='schicht' && activeSchicht) list = list.filter(b=>b.schicht_id===activeSchicht.id);
    return list.sort((a,b)=>new Date(b.erstellt_am)-new Date(a.erstellt_am));
  }, [cafe.bestellungen, filter, activeSchicht]);

  const markItemFertig = async (bestellung, artikelIdx) => {
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    const updBestellungen = (data.bestellungen||[]).map(b => {
      if (b.id!==bestellung.id) return b;
      const artikel = b.artikel.map((a,i)=>i===artikelIdx?{...a,fertig:true}:a);
      const allFertig = artikel.every(a=>a.fertig);
      return { ...b, artikel, status: allFertig?'fertig':b.status };
    });
    await ref.set({...data, bestellungen:updBestellungen}).catch(()=>{});
  };

  const stornieren = async (b) => {
    if (!can(user.role,'stornieren')) return;
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    const updBestellungen = (data.bestellungen||[]).map(x=>x.id===b.id?{...x,status:'storniert'}:x);
    const updSchichten = (data.schichten||[]).map(s=>{
      if(s.id!==b.schicht_id) return s;
      return {...s, umsatz:Math.max(0,(s.umsatz||0)-b.gesamt), bestellungen_count:Math.max(0,(s.bestellungen_count||1)-1)};
    });
    await ref.set({...data,bestellungen:updBestellungen,schichten:updSchichten}).catch(()=>{});
    toast('Bestellung storniert','warn');
  };

  const artLabel = { bar:'Bar', karte:'Karte', gutschein:'Gutschein', wertkarte:'Wertkarte' };
  const statusStyle = { offen:{bg:'#fef3c7',col:'#92400e'}, fertig:{bg:'#d1fae5',col:'#065f46'}, storniert:{bg:'#fee2e2',col:'#991b1b'} };

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        {[['aktiv','Offen'],['fertig','Fertig'],['schicht','Diese Schicht'],['alle','Alle']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)}
            className={`pill transition-all ${filter===v?'text-white':'text-slate-600 bg-white border border-black/10'}`}
            style={filter===v?{background:'#0f172a'}:{}}>
            {l}
          </button>
        ))}
      </div>
      {bestellungen.length===0 && (
        <div className="text-center py-16 text-slate-400 text-sm">Keine Bestellungen</div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'12px'}}>
        {bestellungen.map(b => {
          const ss = statusStyle[b.status]||statusStyle.offen;
          return (
            <div key={b.id} className="glass rounded-2xl p-4 glow">
              <div className="flex items-start justify-between mb-3">
                <div>
                  <span className="text-lg font-bold text-slate-800">#{b.nummer}</span>
                  <span className="text-xs text-slate-400 ml-2">{fmtDateTime(b.erstellt_am)}</span>
                </div>
                <span className="pill text-xs" style={{background:ss.bg,color:ss.col}}>
                  {b.status==='offen'?'Offen':b.status==='fertig'?'Fertig':'Storniert'}
                </span>
              </div>
              <div className="mb-3">
                {(b.artikel||[]).map((a,i)=>(
                  <div key={i} className="flex items-center gap-2 py-1">
                    {(user.role==='barista'||can(user.role,'kasse')) && b.status==='offen' && (
                      <button onClick={()=>markItemFertig(b,i)}
                        className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all ${a.fertig?'bg-green-500 border-green-500':'border-slate-300 hover:border-green-400'}`}>
                        {a.fertig && <SI p={IC.check} size={10} stroke={3}/>}
                      </button>
                    )}
                    <span className="text-sm text-slate-700">{a.emoji||''} {a.name} x{a.menge}</span>
                    <span className="text-xs text-slate-400 ml-auto">{fmtEur(a.preis*a.menge)}</span>
                  </div>
                ))}
              </div>
              <div style={{borderTop:'1px solid rgba(0,0,0,0.06)',paddingTop:'8px'}} className="flex justify-between items-center">
                <div className="text-xs text-slate-500">
                  {(b.zahlung||[]).map((z,i)=>(
                    <span key={i}>{i>0?', ':''}{artLabel[z.art]} {fmtEur(z.betrag)}</span>
                  ))}
                </div>
                <span className="text-sm font-bold text-slate-800">{fmtEur(b.gesamt)}</span>
              </div>
              {can(user.role,'stornieren') && b.status==='offen' && (
                <button onClick={()=>stornieren(b)}
                  className="w-full mt-2 py-1.5 rounded-lg text-xs font-semibold text-red-500 hover:bg-red-50 transition-all border border-red-200">
                  Stornieren
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ─── SchichtView ──────────────────────────────────────────────────────────────
const SchichtView = ({ cafe, user, toast, activeSchicht, setActiveSchicht, profile }) => {
  const [kassenstart, setKassenstart] = useState('');
  const [kassenende, setKassenende]   = useState('');
  const [saving, setSaving]           = useState(false);
  const [showBericht, setShowBericht] = useState(false);

  const startSchicht = async () => {
    setSaving(true);
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    const neu = {
      id: genId(),
      kassiererId: user.id,
      kassiererName: user.name,
      start: new Date().toISOString(),
      ende: null,
      kassenstart: parseFloat(kassenstart)||0,
      kassenende: null,
      bestellungen_count: 0,
      umsatz: 0,
    };
    await ref.set({...data, schichten:[...(data.schichten||[]),neu]});
    setActiveSchicht(neu);
    toast('Schicht gestartet');
    setSaving(false);
  };

  const endeSchicht = async () => {
    setSaving(true);
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    const updated = { ...activeSchicht, ende: new Date().toISOString(), kassenende: parseFloat(kassenende)||0 };
    const updSchichten = (data.schichten||[]).map(s=>s.id===activeSchicht.id?updated:s);
    await ref.set({...data,schichten:updSchichten});
    setActiveSchicht(null);
    setShowBericht(false);
    toast('Schicht beendet');
    setSaving(false);
  };

  const schichtBestellungen = useMemo(() =>
    activeSchicht ? (cafe.bestellungen||[]).filter(b=>b.schicht_id===activeSchicht.id&&b.status!=='storniert') : [],
    [cafe.bestellungen, activeSchicht]);

  const zahlungsBreakdown = useMemo(() => {
    const map = {};
    schichtBestellungen.forEach(b=>{
      (b.zahlung||[]).forEach(z=>{
        map[z.art] = (map[z.art]||0) + z.betrag;
      });
    });
    return map;
  }, [schichtBestellungen]);

  const dauer = useMemo(() => {
    if (!activeSchicht) return '';
    const ms = Date.now() - new Date(activeSchicht.start).getTime();
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
    return `${h}h ${m}min`;
  }, [activeSchicht]);

  const vergangeneSchichten = useMemo(() =>
    (cafe.schichten||[]).filter(s=>s.ende).sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,10),
    [cafe.schichten]);

  if (!activeSchicht) {
    return (
      <div>
        <div className="glass rounded-2xl glow p-6 max-w-md mb-6">
          <h2 className="text-sm font-bold text-slate-800 mb-4">Neue Schicht starten</h2>
          <label className="text-xs font-semibold text-slate-600 mb-1 block">Kassenstart (Bargeld in Kasse)</label>
          <input type="number" className={INP + ' mb-4'} placeholder="z.B. 50.00"
            value={kassenstart} onChange={e=>setKassenstart(e.target.value)} step="0.01"/>
          <button onClick={startSchicht} disabled={saving}
            className="w-full py-3 rounded-xl text-sm font-bold text-white disabled:opacity-40"
            style={{background:'#0f172a'}}>
            Schicht starten
          </button>
        </div>
        {vergangeneSchichten.length > 0 && (
          <div>
            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Vergangene Schichten</h3>
            <div className="flex flex-col gap-2">
              {vergangeneSchichten.map(s=>(
                <div key={s.id} className="glass rounded-xl px-4 py-3 flex items-center justify-between">
                  <div>
                    <div className="text-sm font-semibold text-slate-700">{s.kassiererName}</div>
                    <div className="text-xs text-slate-400">{fmtDateTime(s.start)} – {fmtTime(s.ende)}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-sm font-bold text-slate-800">{fmtEur(s.umsatz||0)}</div>
                    <div className="text-xs text-slate-400">{s.bestellungen_count||0} Bestellungen</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="max-w-xl">
      <div className="glass rounded-2xl glow p-6 mb-4">
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-sm font-bold text-slate-800">Aktive Schicht</h2>
          <span className="pill" style={{background:'#d1fae5',color:'#065f46'}}>● Läuft</span>
        </div>
        <div className="grid grid-cols-2 gap-4 mb-4">
          {[
            ['Kassierer',activeSchicht.kassiererName],
            ['Gestartet',fmtDateTime(activeSchicht.start)],
            ['Dauer',dauer],
            ['Kassenstart',fmtEur(activeSchicht.kassenstart||0)],
            ['Bestellungen',activeSchicht.bestellungen_count||0],
            ['Umsatz',fmtEur(activeSchicht.umsatz||0)],
          ].map(([l,v])=>(
            <div key={l}>
              <div className="text-xs text-slate-400">{l}</div>
              <div className="text-sm font-bold text-slate-800">{v}</div>
            </div>
          ))}
        </div>
        {Object.entries(zahlungsBreakdown).length > 0 && (
          <div className="rounded-xl p-3 mb-4" style={{background:'#f8fafc'}}>
            <p className="text-xs font-semibold text-slate-500 mb-2">Zahlungsarten</p>
            {Object.entries(zahlungsBreakdown).map(([art,betrag])=>(
              <div key={art} className="flex justify-between text-xs py-0.5">
                <span className="text-slate-600">{art}</span>
                <span className="font-semibold">{fmtEur(betrag)}</span>
              </div>
            ))}
          </div>
        )}
        <label className="text-xs font-semibold text-slate-600 mb-1 block">Kassenende (Bargeld in Kasse)</label>
        <input type="number" className={INP + ' mb-3'} placeholder="z.B. 80.00"
          value={kassenende} onChange={e=>setKassenende(e.target.value)} step="0.01"/>
        <button onClick={endeSchicht} disabled={saving}
          className="w-full py-3 rounded-xl text-sm font-bold text-red-600 border border-red-200 hover:bg-red-50 transition-all disabled:opacity-40">
          Schicht beenden
        </button>
      </div>
    </div>
  );
};

// ─── ProdukteView ─────────────────────────────────────────────────────────────
const ProdukteView = ({ cafe, toast, profile }) => {
  const [modal, setModal] = useState(null);
  const [katModal, setKatModal] = useState(null);
  const [form, setForm] = useState({name:'',preis:'',kategorie_id:'',emoji:'',beschreibung:'',aktiv:true});
  const [katForm, setKatForm] = useState({name:'',farbe:'#6366f1'});
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#10b981','#06b6d4','#3b82f6'];

  const saveProdukt = async () => {
    if (!form.name.trim()||!form.preis) { toast('Name und Preis erforderlich','error'); return; }
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    let produkte = data.produkte||[];
    if (modal==='add') {
      produkte = [...produkte, {id:genId(),name:form.name.trim(),preis:parseFloat(form.preis),kategorie_id:form.kategorie_id,emoji:form.emoji,beschreibung:form.beschreibung,aktiv:true}];
    } else {
      produkte = produkte.map(p=>p.id===modal?{...p,name:form.name.trim(),preis:parseFloat(form.preis),kategorie_id:form.kategorie_id,emoji:form.emoji,beschreibung:form.beschreibung}:p);
    }
    await ref.set({...data,produkte});
    toast(modal==='add'?'Produkt hinzugefügt':'Produkt aktualisiert');
    setModal(null);
  };

  const toggleAktiv = async (p) => {
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    await ref.set({...data,produkte:(data.produkte||[]).map(x=>x.id===p.id?{...x,aktiv:!x.aktiv}:x)});
  };

  const deleteProdukt = async (id) => {
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    await ref.set({...data,produkte:(data.produkte||[]).filter(p=>p.id!==id)});
    toast('Produkt gelöscht','warn');
  };

  const saveKat = async () => {
    if (!katForm.name.trim()) return;
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    let kategorien = data.kategorien||[];
    if (katModal==='add') {
      kategorien = [...kategorien,{id:genId(),name:katForm.name.trim(),farbe:katForm.farbe}];
    } else {
      kategorien = kategorien.map(k=>k.id===katModal?{...k,name:katForm.name.trim(),farbe:katForm.farbe}:k);
    }
    await ref.set({...data,kategorien});
    toast('Kategorie gespeichert');
    setKatModal(null);
  };

  const deleteKat = async (id) => {
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    await ref.set({...data,kategorien:(data.kategorien||[]).filter(k=>k.id!==id)});
    toast('Kategorie gelöscht','warn');
  };

  const openAdd = () => { setForm({name:'',preis:'',kategorie_id:cafe.kategorien[0]?.id||'',emoji:'☕',beschreibung:'',aktiv:true}); setModal('add'); };
  const openEdit = (p) => { setForm({name:p.name,preis:p.preis,kategorie_id:p.kategorie_id,emoji:p.emoji||'',beschreibung:p.beschreibung||'',aktiv:p.aktiv!==false}); setModal(p.id); };

  const groupedByKat = useMemo(() => {
    const map = {};
    (cafe.kategorien||[]).forEach(k=>{ map[k.id]={kat:k,produkte:[]}; });
    map['_none'] = {kat:{id:'_none',name:'Ohne Kategorie',farbe:'#94a3b8'},produkte:[]};
    (cafe.produkte||[]).forEach(p=>{
      if (map[p.kategorie_id]) map[p.kategorie_id].produkte.push(p);
      else map['_none'].produkte.push(p);
    });
    return Object.values(map).filter(g=>g.produkte.length>0||g.kat.id!=='_none');
  }, [cafe.produkte, cafe.kategorien]);

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div className="flex gap-2">
          <button onClick={openAdd} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white"
            style={{background:'#0f172a'}}>
            <SI p={IC.plus} size={14}/>Produkt
          </button>
          <button onClick={()=>{setKatForm({name:'',farbe:'#6366f1'});setKatModal('add');}}
            className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold border border-black/10 text-slate-700 hover:bg-black/5 transition-all">
            <SI p={IC.tag} size={14}/>Kategorie
          </button>
        </div>
      </div>

      {/* Categories */}
      {(cafe.kategorien||[]).length > 0 && (
        <div className="flex flex-wrap gap-2 mb-4">
          {(cafe.kategorien||[]).map(k=>(
            <div key={k.id} className="flex items-center gap-2 pill" style={{background:k.farbe+'22',color:k.farbe}}>
              <span>{k.name}</span>
              <button onClick={()=>{setKatForm({name:k.name,farbe:k.farbe});setKatModal(k.id);}} className="hover:opacity-70"><SI p={IC.edit} size={10}/></button>
              <button onClick={()=>deleteKat(k.id)} className="hover:opacity-70"><SI p={IC.x} size={10}/></button>
            </div>
          ))}
        </div>
      )}

      {/* Product grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'10px'}}>
        {(cafe.produkte||[]).map(p=>{
          const kat = (cafe.kategorien||[]).find(k=>k.id===p.kategorie_id);
          return (
            <div key={p.id} className={`glass rounded-2xl p-4 ${p.aktiv===false?'opacity-50':''}`}>
              <div className="flex items-start justify-between mb-2">
                <span className="text-2xl">{p.emoji||'🍵'}</span>
                <div className="flex items-center gap-1">
                  <button onClick={()=>toggleAktiv(p)}
                    className={`toggle ${p.aktiv!==false?'on':''}`}
                    style={{background:p.aktiv!==false?'#10b981':'#cbd5e1'}}/>
                </div>
              </div>
              <div className="text-sm font-bold text-slate-800 mb-0.5">{p.name}</div>
              {kat && <span className="pill text-xs mb-2" style={{background:kat.farbe+'22',color:kat.farbe}}>{kat.name}</span>}
              <div className="text-base font-bold mt-1" style={{color:kat?.farbe||'#6366f1'}}>{fmtEur(p.preis)}</div>
              <div className="flex gap-2 mt-3">
                <button onClick={()=>openEdit(p)} className="flex-1 py-1.5 rounded-lg text-xs font-semibold border border-black/10 hover:bg-black/5 transition-all">
                  <SI p={IC.edit} size={12}/>
                </button>
                <button onClick={()=>deleteProdukt(p.id)} className="flex-1 py-1.5 rounded-lg text-xs font-semibold border border-red-200 text-red-500 hover:bg-red-50 transition-all">
                  <SI p={IC.trash} size={12}/>
                </button>
              </div>

          );
        })}
      </div>

      {modal && (
        <Modal title={modal==='add'?'Produkt hinzufügen':'Produkt bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-3">
            <div className="flex gap-2">
              <div style={{flex:'0 0 72px'}}>
                <label className="text-xs font-semibold text-slate-600 mb-1 block">Emoji</label>

              </div>
              <div style={{flex:1}}>
                <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
                <input className={INP} value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Cappuccino"/>
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Preis (€)</label>
              <input type="number" className={INP} value={form.preis} onChange={e=>set('preis',e.target.value)} step="0.10" min="0" placeholder="2.50"/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Kategorie</label>
              <select className={INP} value={form.kategorie_id} onChange={e=>set('kategorie_id',e.target.value)}>
                <option value="">Keine Kategorie</option>
                {(cafe.kategorien||[]).map(k=><option key={k.id} value={k.id}>{k.name}</option>)}

            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={katForm.name} onChange={e=>setKatForm(p=>({...p,name:e.target.value}))} placeholder="Heißgetränke"/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Farbe</label>
              <div className="flex flex-wrap gap-2">
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>setKatForm(p=>({...p,farbe:c}))}
                    className="w-7 h-7 rounded-full transition-all hover:scale-110"
                    style={{background:c,outline:katForm.farbe===c?`2px solid ${c}`:'2px solid transparent',outlineOffset:'2px'}}/>
                ))}

            <div className="flex gap-2 mt-2">

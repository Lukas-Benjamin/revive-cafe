// ─── InventarView ─────────────────────────────────────────────────────────────
const InventarView = ({ cafe, toast, profile }) => {
  const ref = () => adb.collection(profile||'k21-cafe').doc('data');
  const write = (patch) => {
    const d = {...DEFAULT_CAFE(),...cafe,...patch};
    serverWrite(profile||'k21-cafe', d);
    withRetry(() => ref().set(d), e=>toast(e.message,'error'));
  };

  const inventar = cafe.inventar||{};
  const produkte = (cafe.produkte||[]).filter(p=>p.aktiv!==false);
  const kategorien = cafe.kategorien||[];

  const getInv = pid => inventar[pid] || {bestand:0, warnschwelle:3, aktiv:false};

  const updInv = (pid, patch) => {
    const cur = getInv(pid);
    write({inventar:{...inventar, [pid]:{...cur,...patch}}});
  };

  // Stats
  const getrackt = produkte.filter(p=>getInv(p.id).aktiv);
  const ausverkauft = getrackt.filter(p=>getInv(p.id).bestand===0);
  const tiefBestand = getrackt.filter(p=>{const inv=getInv(p.id);return inv.bestand>0&&inv.bestand<=inv.warnschwelle;});

  // Group by category
  const grouped = kategorien.map(k=>({
    kat:k,
    items: produkte.filter(p=>p.kategorie_id===k.id),
  })).filter(g=>g.items.length>0);
  const ohneKat = produkte.filter(p=>!p.kategorie_id||!kategorien.find(k=>k.id===p.kategorie_id));

  return (
    <div className="p-4 space-y-5 max-w-2xl mx-auto">
      <div className="flex items-center gap-3">
        <div>
          <h2 className="text-xl font-black">Inventar</h2>
          <p className="text-xs text-slate-400 mt-0.5">Bestand verwalten · wird beim Verkauf automatisch abgezogen</p>
        </div>
      </div>

      {/* Stats */}
      <div className="grid grid-cols-3 gap-3">
        <div className="glass rounded-2xl p-4 text-center">
          <div className="text-2xl font-black">{getrackt.length}</div>
          <div className="text-xs text-slate-500 mt-0.5">Getrackt</div>
        </div>
        <div className="glass rounded-2xl p-4 text-center" style={{borderLeft: tiefBestand.length>0?'3px solid #f59e0b':'undefined'}}>
          <div className="text-2xl font-black" style={{color:tiefBestand.length>0?'#d97706':'inherit'}}>{tiefBestand.length}</div>
          <div className="text-xs text-slate-500 mt-0.5">Tief­bestand</div>
        </div>
        <div className="glass rounded-2xl p-4 text-center" style={{borderLeft: ausverkauft.length>0?'3px solid #ef4444':'undefined'}}>
          <div className="text-2xl font-black" style={{color:ausverkauft.length>0?'#ef4444':'inherit'}}>{ausverkauft.length}</div>
          <div className="text-xs text-slate-500 mt-0.5">Ausverkauft</div>
        </div>
      </div>

      {/* Alerts */}
      {(ausverkauft.length>0||tiefBestand.length>0) && (
        <div className="glass rounded-2xl p-4 space-y-2" style={{borderLeft:'3px solid #f59e0b'}}>
          <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Achtung</div>
          {ausverkauft.map(p=>(
            <div key={p.id} className="flex items-center gap-2 text-sm">
              <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background:'#ef4444'}}/>
              <span className="font-semibold text-red-600">{p.name}</span>
              <span className="text-slate-400 text-xs">— Ausverkauft</span>
            </div>
          ))}
          {tiefBestand.map(p=>{
            const inv=getInv(p.id);
            return (
              <div key={p.id} className="flex items-center gap-2 text-sm">
                <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background:'#f59e0b'}}/>
                <span className="font-semibold text-amber-700">{p.name}</span>
                <span className="text-slate-400 text-xs">— noch {inv.bestand} übrig (Warnschwelle: {inv.warnschwelle})</span>
              </div>
            );
          })}
        </div>
      )}

      {/* Product list */}
      {[...grouped, ohneKat.length>0?{kat:{id:'__none',name:'Ohne Kategorie',farbe:'#94a3b8'},items:ohneKat}:null].filter(Boolean).map(({kat,items})=>(
        <div key={kat.id}>
          <div className="flex items-center gap-2 mb-2">
            <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{background:kat.farbe||'#94a3b8'}}/>
            <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">{kat.name}</span>
          </div>
          <div className="space-y-2">
            {items.map(p=>{
              const inv = getInv(p.id);
              const statusColor = !inv.aktiv ? '#94a3b8' : inv.bestand===0 ? '#ef4444' : inv.bestand<=inv.warnschwelle ? '#f59e0b' : '#10b981';
              const statusLabel = !inv.aktiv ? 'Nicht getrackt' : inv.bestand===0 ? 'Ausverkauft' : inv.bestand<=inv.warnschwelle ? `⚠ ${inv.bestand} übrig` : `${inv.bestand} übrig`;
              return (
                <div key={p.id} className="glass rounded-2xl overflow-hidden">
                  {/* Header row */}
                  <div className="flex items-center gap-3 px-4 py-3">
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-sm text-slate-800">{p.name}</div>
                      <div className="text-xs mt-0.5 font-semibold" style={{color:statusColor}}>{statusLabel}</div>
                    </div>
                    {/* Quick +/- buttons when tracked */}
                    {inv.aktiv && (
                      <div className="flex items-center gap-1">
                        <button onClick={()=>updInv(p.id,{bestand:Math.max(0,(inv.bestand||0)-1)})}
                          className="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-slate-600 hover:bg-black/8 transition-all"
                          style={{background:'rgba(0,0,0,0.05)'}}>−</button>
                        <span className="text-sm font-black w-8 text-center" style={{color:statusColor}}>{inv.bestand}</span>
                        <button onClick={()=>updInv(p.id,{bestand:(inv.bestand||0)+1})}
                          className="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-slate-600 hover:bg-black/8 transition-all"
                          style={{background:'rgba(0,0,0,0.05)'}}>+</button>
                      </div>
                    )}
                    {/* Tracking toggle */}
                    <button onClick={()=>updInv(p.id,{aktiv:!inv.aktiv})}
                      className="w-10 h-6 rounded-full transition-all flex-shrink-0 relative"
                      style={{background:inv.aktiv?'#000':'rgba(0,0,0,0.12)'}}>
                      <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all"
                        style={{left:inv.aktiv?'calc(100% - 22px)':'2px'}}/>
                    </button>
                  </div>

                  {/* Expanded settings when tracked */}
                  {inv.aktiv && (
                    <div className="border-t border-black/5 px-4 py-3 grid grid-cols-2 gap-3" style={{background:'rgba(0,0,0,0.02)'}}>
                      <div>
                        <label className="text-xs font-semibold text-slate-500 block mb-1.5">Aktueller Bestand</label>
                        <div className="flex items-center gap-1">
                          <input type="number" value={inv.bestand||0} min={0}
                            onChange={e=>updInv(p.id,{bestand:Math.max(0,parseInt(e.target.value)||0)})}
                            className="w-full rounded-xl border border-black/10 px-3 py-1.5 text-sm font-bold text-center" style={{background:'#fff'}}/>
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-500 block mb-1.5">Warnschwelle</label>
                        <input type="number" value={inv.warnschwelle??3} min={0}
                          onChange={e=>updInv(p.id,{warnschwelle:Math.max(0,parseInt(e.target.value)||0)})}
                          className="w-full rounded-xl border border-black/10 px-3 py-1.5 text-sm font-bold text-center" style={{background:'#fff'}}/>
                      </div>
                      <div className="col-span-2">
                        <label className="text-xs font-semibold text-slate-500 block mb-1.5">Bestand auffüllen auf</label>
                        <div className="flex gap-2">
                          {[10,20,50,100].map(n=>(
                            <button key={n} onClick={()=>updInv(p.id,{bestand:n})}
                              className="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all"
                              style={{background:'rgba(0,0,0,0.06)',color:'#374151'}}>
                              {n}
                            </button>
                          ))}
                          <button onClick={()=>{const v=prompt(`Bestand für ${p.name} eingeben:`);if(v&&!isNaN(v))updInv(p.id,{bestand:Math.max(0,parseInt(v))});}}
                            className="flex-1 py-1.5 text-xs font-bold rounded-xl transition-all"
                            style={{background:'rgba(0,0,0,0.06)',color:'#374151'}}>
                            ✏
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {produkte.length === 0 && (
        <div className="text-center py-16 text-slate-400 text-sm">Keine Produkte — zuerst Produkte anlegen</div>
      )}
    </div>
  );
};

// ─── Einstellungen-Seite (owner/admin) ────────────────────────────────────────
const EinstellungenView = ({ cafe, profile, profiles, saveProfiles, appSettings, saveAppSettings, user, toast }) => {
  const [appName, setAppName] = useState(appSettings.appName || 'K21 Café');
  const [waehrung, setWaehrung] = useState((cafe.einstellungen||{}).waehrung || 'EUR');
  const [minKarte, setMinKarte] = useState((cafe.einstellungen||{}).min_karten_betrag ?? 10);
  const [edit, setEdit] = useState(null);     // {id|'new', label, color}
  const [confirmDel, setConfirmDel] = useState(null);
  const isOwner = (user.role||'').toLowerCase()==='owner';

  const saveCafeEinst = () => {
    const _d = {...DEFAULT_CAFE(), ...cafe, einstellungen:{...(cafe.einstellungen||{}), waehrung, min_karten_betrag:parseFloat(minKarte)||0}};
    serverWrite(profile||'k21-cafe', _d);
    withRetry(() => adb.collection(profile||'k21-cafe').doc('data').set(_d), e=>toast(e.message,'error'));
    toast('Einstellungen gespeichert ✓');
  };

  const saveBereich = () => {
    if (!edit.label.trim()) return;
    let np;
    if (edit.id==='new') {
      const id = edit.label.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Math.random().toString(36).slice(2,5);
      np = [...profiles, { id, label:edit.label.trim(), color:edit.color, grad:`linear-gradient(135deg,${edit.color},#000000)` }];
    } else {
      np = profiles.map(p => p.id===edit.id ? {...p, label:edit.label.trim(), color:edit.color, grad:`linear-gradient(135deg,${edit.color},#000000)`} : p);
    }
    saveProfiles(np); setEdit(null);
    toast(edit.id==='new' ? 'Bereich erstellt ✓' : 'Bereich gespeichert ✓');
  };

  const delBereich = (id) => {
    if (profiles.length<=1) { toast('Mindestens ein Bereich muss bestehen','error'); return; }
    saveProfiles(profiles.filter(p=>p.id!==id)); setConfirmDel(null);
    toast('Bereich gelöscht ✓');
  };

  return (
    <div className="max-w-lg mx-auto space-y-4">
      <h1 className="text-xl font-bold grad">Einstellungen</h1>

      <div className="glass rounded-2xl p-4 space-y-3">
        <h3 className="font-semibold text-sm text-slate-800">Allgemein</h3>
        <div>
          <label className="text-slate-400 text-xs block mb-1.5">App-Name</label>
          <input value={appName} onChange={e=>setAppName(e.target.value)} className={INP}/>
        </div>
        <div className="flex gap-3">
          <div className="flex-1">
            <label className="text-slate-400 text-xs block mb-1.5">Währung</label>
            <input value={waehrung} onChange={e=>setWaehrung(e.target.value)} className={INP}/>
          </div>
          <div className="flex-1">
            <label className="text-slate-400 text-xs block mb-1.5">Mindestbetrag Karte ({waehrung})</label>
            <input type="number" value={minKarte} onChange={e=>setMinKarte(e.target.value)} className={INP}/>
          </div>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>{ saveAppSettings({...appSettings, appName:appName.trim()||'K21 Café'}); saveCafeEinst(); }}
            className="flex-1 bg-slate-900 hover:bg-slate-700 text-white font-bold py-2.5 text-sm rounded-xl transition-all">Speichern</button>
        </div>
        <p className="text-xs text-slate-400">Währung und Mindestbetrag gelten für den aktuellen Bereich „{(profiles.find(p=>p.id===profile)||{}).label||profile}".</p>
      </div>

      <div className="glass rounded-2xl p-4 space-y-2">
        <div className="flex items-center justify-between">
          <h3 className="font-semibold text-sm text-slate-800">Bereiche / Standorte</h3>
          {isOwner && <button onClick={()=>setEdit({id:'new',label:'',color:COLOR_SWATCHES[0]})} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg transition-all"><SI p={IC.plus} size={13}/>Neuer Bereich</button>}
        </div>
        {!isOwner && <p className="text-xs text-slate-400">Nur der Owner kann Bereiche verwalten.</p>}
        {profiles.map(p=>(
          <div key={p.id} className="flex items-center gap-3 bg-black/5 rounded-lg px-3 py-2">
            <span style={{width:12,height:12,borderRadius:'50%',background:p.color||'#8b5cf6',flexShrink:0}}/>
            <span className="flex-1 text-sm text-slate-700">{p.label}{p.id===profile && <span className="text-slate-400"> · aktiv</span>}</span>
            {isOwner && confirmDel===p.id ? (
              <>
                <button onClick={()=>delBereich(p.id)} className="text-xs text-red-500 font-semibold">Löschen</button>
                <button onClick={()=>setConfirmDel(null)} className="text-xs text-slate-400">Abbrechen</button>
              </>
            ) : isOwner && (
              <>
                <button onClick={()=>setEdit({id:p.id,label:p.label,color:p.color||'#8b5cf6'})} className="p-1.5 text-slate-400 hover:text-slate-700"><SI p={IC.edit} size={14}/></button>
                <button onClick={()=>setConfirmDel(p.id)} className="p-1.5 text-slate-400 hover:text-red-500"><SI p={IC.trash} size={14}/></button>
              </>
            )}
          </div>
        ))}
      </div>

      {edit && (
        <div className="modal-overlay" style={{position:'fixed',inset:0,zIndex:5000,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(0,0,0,0.75)'}} onClick={e=>{if(e.target===e.currentTarget)setEdit(null);}}>
          <div className="glass rounded-2xl w-full" style={{maxWidth:380}}>
            <div className="p-5 space-y-4">
              <h3 className="font-semibold text-slate-800 text-sm">{edit.id==='new'?'Neuer Bereich':'Bereich bearbeiten'}</h3>
              <div><label className="text-slate-400 text-xs block mb-1.5">Name</label><input autoFocus value={edit.label} onChange={e=>setEdit({...edit,label:e.target.value})} className={INP}/></div>
              <div><label className="text-slate-400 text-xs block mb-1.5">Farbe</label><ColorPicker value={edit.color} onChange={c=>setEdit({...edit,color:c})}/></div>
              <div className="flex gap-2">
                <button onClick={saveBereich} className="flex-1 bg-slate-900 hover:bg-slate-700 text-white font-bold py-2.5 text-sm rounded-xl">Speichern</button>
                <button onClick={()=>setEdit(null)} className="px-4 py-2.5 bg-black/5 text-slate-400 text-sm rounded-xl">Abbrechen</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const NAV_ITEMS = [
  { id:'kasse',            label:'Kasse',         icon:IC.cart,    perm:'kasse' },
  { id:'bestellungen',     label:'Bestellungen',  icon:IC.orders,  perm:'bestellungen' },
  { id:'schicht',          label:'Schicht',       icon:IC.shift,   perm:'schicht' },
  { id:'produkte',         label:'Produkte',      icon:IC.tag,     perm:'produkte' },
  { id:'zahlungsmethoden', label:'Zahlungen',     icon:IC.cash,    perm:'zahlungsmethoden' },
  { id:'inventar',         label:'Inventar',      icon:IC.box,     perm:'inventar' },
  { id:'finanzen',         label:'Finanzen',      icon:IC.chart,   perm:'finanzen' },
  { id:'personen',         label:'Personen',      icon:IC.users,   perm:'personen' },
  { id:'einstellungen',    label:'Einstellungen', icon:IC.cog,     perm:'einstellungen' },
];

// ─── App ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [user, setUser]           = useState(null);
  const [cafe, setCafe]           = useState(DEFAULT_CAFE());
  const [syncState, setSyncState] = useState('connecting');
  const [page, setPage]           = useState('kasse');
  const [activeSchicht, setActiveSchicht] = useState(null);
  const [toasts, toast]           = useToast();
  const [profiles, setProfiles]   = useState(DEFAULT_CAFE_PROFILES);
  const [profile, setProfile]     = useState(DEFAULT_CAFE_PROFILES[0].id);
  const [appSettings, setAppSettings] = useState({ appName: 'K21 Café' });
  const [headerEdit, setHeaderEdit]           = useState(null);
  const [headerEditName, setHeaderEditName]   = useState('');
  const [headerEditColor, setHeaderEditColor] = useState('#8b5cf6');
  const [ownerPin, setOwnerPin]   = useState('');

  // Load owner PIN from server (for cross-device admin PIN change)
  useEffect(() => {
    aFetch('/api/admin-pin').then(r=>r.json()).then(d=>{ if(d.pin) setOwnerPin(d.pin); }).catch(()=>{});
  }, []);

  // Load profiles — realtime so all devices stay in sync
  useEffect(() => {
    const unsub = adb.collection('config').doc('cafe-profiles').onSnapshot(snap => {
      const d = snap.data()?.data;
      if (d && d.length) {
        setProfiles(d); CAFE_PROFILES = d;
        setProfile(prev => d.find(p=>p.id===prev) ? prev : d[0].id);
      }
    }, ()=>{});
    return () => unsub();
  }, []);

  // Load app settings (app name) — realtime
  useEffect(() => {
    const unsub = adb.collection('config').doc('app-settings').onSnapshot(snap => {
      const d = snap.data()?.data;
      if (d) setAppSettings({ appName: 'K21 Café', ...d });
    }, ()=>{});
    return () => unsub();
  }, []);

  const saveProfiles = (np) => {
    setProfiles(np); CAFE_PROFILES = np;
    adb.collection('config').doc('cafe-profiles').set({ data: np }).catch(()=>{});
  };
  const saveAppSettings = (s) => {
    setAppSettings(s);
    adb.collection('config').doc('app-settings').set({ data: s }).catch(()=>{});
  };

  // Firestore listener + server fallback
  useEffect(() => {
    if (!user) return;
    setSyncState('connecting');
    // Try server first for initial load (works even when Firestore rules expired)
    aFetch(`/api/data?c=${encodeURIComponent(profile)}`).then(r=>r.ok?r.json():null).then(data=>{
      if (data) {
        const merged = {...DEFAULT_CAFE(),...data};
        setCafe(merged);
        const aktiv = (data.schichten||[]).find(s=>!s.ende && (['owner','admin'].includes((user.role||'').toLowerCase())||s.kassiererId===user.id));
        setActiveSchicht(aktiv||null);
        setSyncState('synced');
      }
    }).catch(()=>{});
    const ref = adb.collection(profile).doc('data');
    const unsub = ref.onSnapshot(
      snap => {
        const data = snap.exists ? snap.data() : DEFAULT_CAFE();
        setCafe({...DEFAULT_CAFE(), ...data});
        // Find active schicht for this user
        const aktiv = (data.schichten||[]).find(s=>!s.ende && (['owner','admin'].includes((user.role||'').toLowerCase())||s.kassiererId===user.id));
        setActiveSchicht(aktiv||null);
        setSyncState('synced');
      },
      () => setSyncState('error')
    );
    return () => unsub();
  }, [user, profile]);

  // On login, jump to appropriate default page
  useEffect(() => {
    if (!user) return;
    const isAdmin = ['owner','admin'].includes((user.role||'').toLowerCase());
    const firstAllowed = NAV_ITEMS.find(n=>{
      if (isAdmin && (n.id==='kasse'||n.id==='bestellungen')) return false;
      return can(user.role,n.perm);
    });
    if (firstAllowed) setPage(firstAllowed.id);
  }, [user]);

  const saveHeaderEdit = () => {
    if (!headerEditName.trim()) return;
    let np;
    if (headerEdit === 'new') {
      const id = headerEditName.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Math.random().toString(36).slice(2,5);
      np = [...profiles, {id, label:headerEditName.trim(), color:headerEditColor, grad:`linear-gradient(135deg,${headerEditColor},#000000)`}];
    } else {
      np = profiles.map(p => p.id===headerEdit ? {...p, label:headerEditName.trim(), color:headerEditColor, grad:`linear-gradient(135deg,${headerEditColor},#000000)`} : p);
    }
    setProfiles(np); CAFE_PROFILES = np;
    adb.collection('config').doc('cafe-profiles').set({data: np}).catch(()=>{});
    setHeaderEdit(null);
    toast(headerEdit==='new' ? 'Bereich erstellt ✓' : 'Bereich umbenannt ✓');
  };

  if (!user) return <LoginView onLogin={(u, pid) => {
    setUser(u);
    const accessible = profiles.filter(p => getAreaAccess(u, p.id) !== 'none');
    const startProfile = accessible.find(p=>p.id===pid) || accessible[0];
    if (startProfile) setProfile(startProfile.id);
  }} profiles={profiles}/>;

  const isAdminRole = ['owner','admin'].includes((user.role||'').toLowerCase());
  const visibleNav = NAV_ITEMS.filter(n=>{
    if (isAdminRole && (n.id==='kasse'||n.id==='bestellungen')) return false;
    return can(user.role,n.perm);
  });

  // Make sure current page is accessible (also respect admin exclusions)
  const activePage = (() => {
    if (isAdminRole && (page==='kasse'||page==='bestellungen')) return visibleNav[0]?.id||'schicht';
    return can(user.role, NAV_ITEMS.find(n=>n.id===page)?.perm) ? page : (visibleNav[0]?.id||'schicht');
  })();

  const renderPage = () => {
    const role = (user.role||'').toLowerCase();
    if (role==='kassierer' && !activeSchicht)
      return <KassiererSchichtStart user={user} toast={toast} profile={profile} cafe={cafe} onStarted={setActiveSchicht}/>;
    if (activePage==='kasse')            return <KasseView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} profile={profile}/>;
    if (activePage==='bestellungen')     return <BestellungenView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} profile={profile}/>;
    if (activePage==='schicht')          return <SchichtView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} setActiveSchicht={setActiveSchicht} profile={profile}/>;
    if (activePage==='produkte')         return <ProdukteView cafe={cafe} user={user} toast={toast} profile={profile}/>;
    if (activePage==='zahlungsmethoden') return <ZahlungsMethodenView cafe={cafe} toast={toast} profile={profile}/>;
    if (activePage==='inventar')         return <InventarView cafe={cafe} toast={toast} profile={profile}/>;
    if (activePage==='finanzen')         return <FinanzenView cafe={cafe} toast={toast} profile={profile} profiles={profiles} user={user}/>;
    if (activePage==='personen')         return <PersonenView toast={toast} profile={profile} user={user}/>;
    if (activePage==='einstellungen')    return <EinstellungenView cafe={cafe} profile={profile} profiles={profiles} saveProfiles={saveProfiles} appSettings={appSettings} saveAppSettings={saveAppSettings} user={user} toast={toast}/>;
    return null;
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <header style={{background:'#000000',position:'sticky',top:0,zIndex:100}}>
        {/* Row 1: Logo + Area pills + User info */}
        <div style={{maxWidth:'1400px',margin:'0 auto',padding:'0 20px',height:'56px',display:'flex',alignItems:'center',gap:'16px'}}>
          {/* Logo */}
          <div className="flex items-center gap-2 flex-shrink-0">
            <img src="/logo.png" style={{width:30,height:30,filter:'invert(1)',mixBlendMode:'screen'}} alt="K21"/>
            <span className="text-white font-bold text-sm hidden sm:block">{appSettings.appName||'K21 Café'}</span>
          </div>

          {/* Area pills – centered, filtered by areaAccess */}
          <div className="flex gap-1 mx-auto items-center flex-wrap justify-center">
            {profiles.filter(pp => getAreaAccess(user, pp.id) !== 'none').map(pp => (
              <div key={pp.id} className="relative flex items-center gap-0.5">
                <button onClick={()=>setProfile(pp.id)}
                  className="px-3 py-1.5 text-xs font-bold transition-all"
                  style={{
                    borderRadius:30,
                    background: profile===pp.id ? '#ffffff' : 'transparent',
                    color: profile===pp.id ? '#000000' : 'rgba(255,255,255,0.4)',
                    border: profile===pp.id ? '1px solid transparent' : '1px solid rgba(255,255,255,0.12)',
                  }}>
                  {pp.label}
                </button>
                {user?.role==='owner' && (
                  <button onClick={()=>{setHeaderEdit(pp.id);setHeaderEditName(pp.label);setHeaderEditColor(pp.color||'#8b5cf6');}}
                    title="Bereich bearbeiten"
                    className="w-5 h-5 flex items-center justify-center rounded-full opacity-40 hover:opacity-100 transition-all"
                    style={{color:'rgba(255,255,255,0.7)'}}>
                    <SI p={IC.edit} size={12}/>
                  </button>
                )}
              </div>
            ))}
            {user?.role==='owner' && (
              <button onClick={()=>{setHeaderEdit('new');setHeaderEditName('');setHeaderEditColor('#8b5cf6');}}
                title="Neuer Bereich"
                className="w-7 h-7 flex items-center justify-center rounded-full opacity-50 hover:opacity-100 transition-all"
                style={{color:'rgba(255,255,255,0.7)',border:'1px dashed rgba(255,255,255,0.3)'}}>
                <SI p={IC.plus} size={13}/>
              </button>
            )}
          </div>

          {/* Right side: sync + schicht badge + avatar + logout */}
          <div className="flex items-center gap-3 flex-shrink-0">
            <SyncDot state={syncState}/>
            {activeSchicht && (
              <span className="pill text-xs hidden sm:inline-flex" style={{background:'rgba(16,185,129,0.2)',color:'#34d399'}}>
                Schicht aktiv
              </span>
            )}
            <div className="flex items-center gap-2">
              <Avatar name={user.name} color={user.farbe||'#8b5cf6'} size={28}/>
              <span className="text-white text-xs font-semibold hidden md:block">{user.name}</span>
            </div>
            <button onClick={()=>{ setSessToken(''); aFetch('/api/logout',{method:'POST'}); setUser(null); }} className="text-white/40 hover:text-white transition-all" title="Abmelden">
              <SI p={IC.logout} size={15}/>
            </button>
          </div>
        </div>

        {/* Row 2: Nav tabs */}
        <div style={{borderTop:'1px solid rgba(255,255,255,0.06)'}}>
          <div style={{maxWidth:'1400px',margin:'0 auto',padding:'0 16px',height:'44px',display:'flex',alignItems:'center',justifyContent:'center',gap:'2px',overflowX:'auto',scrollbarWidth:'none'}}>
            {visibleNav.map(n=>(
              <button key={n.id} onClick={()=>setPage(n.id)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold flex-shrink-0 transition-all"
                style={{
                  background:activePage===n.id?'rgba(255,255,255,0.15)':'transparent',
                  color:activePage===n.id?'#fff':'rgba(255,255,255,0.45)'
                }}>
                <SI p={n.icon} size={13}/>{n.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      {/* Main content */}
      <main style={{flex:1,maxWidth:'1400px',margin:'0 auto',padding:'20px',width:'100%'}}>
        <div className="up">
          {renderPage()}
        </div>
      </main>

      {headerEdit && (
        <Modal title={headerEdit==='new'?'Neuer Bereich':'Bereich bearbeiten'} onClose={()=>setHeaderEdit(null)}>
          <div className="space-y-4">
            <div>
              <label className="text-slate-400 text-xs block mb-1.5">Name</label>
              <input autoFocus value={headerEditName} onChange={e=>setHeaderEditName(e.target.value)}
                placeholder="Bereich-Name…" className={INP}
                onKeyDown={e=>e.key==='Enter'&&saveHeaderEdit()}/>
            </div>
            <div>
              <label className="text-slate-400 text-xs block mb-1.5">Farbe</label>
              <ColorPicker value={headerEditColor} onChange={setHeaderEditColor}/>
            </div>
            <div className="flex gap-2 pt-1">
              <button onClick={saveHeaderEdit} className="flex-1 bg-slate-900 hover:bg-slate-700 text-white font-bold py-2.5 text-sm rounded-xl transition-all">Speichern</button>
              <button onClick={()=>setHeaderEdit(null)} className="px-4 py-2.5 bg-black/5 text-slate-400 text-sm rounded-xl transition-all">Abbrechen</button>
            </div>
            {headerEdit!=='new' && profiles.length > 1 && (
              <button onClick={()=>{
                if (!window.confirm('Bereich wirklich löschen?')) return;
                const np = profiles.filter(p=>p.id!==headerEdit);
                setProfiles(np); CAFE_PROFILES=np;
                adb.collection('config').doc('cafe-profiles').set({data:np}).catch(()=>{});
                if (profile===headerEdit) setProfile(np[0].id);
                setHeaderEdit(null);
                toast('Bereich gelöscht ✓');
              }} className="w-full py-2 text-red-400 hover:text-red-600 text-xs font-medium transition-all text-center">
                Bereich löschen
              </button>
            )}
          </div>
        </Modal>
      )}

      <ToastContainer toasts={toasts}/>
    </div>
  );
};

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>

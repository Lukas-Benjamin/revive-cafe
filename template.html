                  onChange={e=>sf('mindestbetrag',e.target.value)} step="0.50" min="0"
                  placeholder="0 = kein Limit"/>
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-600 mb-1 block">Maximalbetrag (€)</label>
                <input type="number" className={INP} value={form.maximalbetrag}
                  onChange={e=>sf('maximalbetrag',e.target.value)} step="0.50" min="0"
                  placeholder="0 = kein Limit"/>
              </div>
            </div>
            <p className="text-xs text-slate-400 -mt-2">0 = kein Limit für Min./Max.</p>

            {/* Gutschein */}
            <div className="rounded-xl p-4" style={{background:'#f8fafc',border:'1px solid rgba(0,0,0,0.06)'}}>
              <label className="flex items-center gap-3 cursor-pointer mb-3">
                <button onClick={()=>sf('gutschein',!form.gutschein)}
                  className={`toggle ${form.gutschein?'on':''}`}
                  style={{background:form.gutschein?'#6d28d9':'#cbd5e1'}}/>
                <div>
                  <span className="text-sm font-semibold text-slate-700">Gutschein</span>
                  <p className="text-xs text-slate-400">Diese Methode ist ein Gutschein mit festem Wert</p>
                </div>
              </label>

              {form.gutschein && (
                <div className="flex flex-col gap-3 pt-3" style={{borderTop:'1px solid rgba(0,0,0,0.06)'}}>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-2 block">Gutschein-Typ</label>
                    <div className="flex gap-2">
                      {[['betrag','Fixer Betrag (€)'],['produkte','Anzahl Produkte']].map(([v,l])=>(
                        <button key={v} onClick={()=>sf('gutschein_typ',v)}
                          className={`flex-1 py-2.5 rounded-xl text-xs font-semibold border transition-all ${form.gutschein_typ===v?'text-white border-transparent':'text-slate-600 border-black/10 hover:bg-black/5'}`}
                          style={form.gutschein_typ===v?{background:'#6d28d9'}:{}}>
                          {l}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-1 block">
                      {form.gutschein_typ==='produkte' ? 'Anzahl Produkte' : 'Betrag (€)'}
                    </label>
                    <input type="number" className={INP} value={form.gutschein_wert}
                      onChange={e=>sf('gutschein_wert',e.target.value)} min="0"
                      step={form.gutschein_typ==='produkte'?'1':'0.50'}
                      placeholder={form.gutschein_typ==='produkte'?'z.B. 2':'z.B. 5.00'}/>
                    <p className="text-xs text-slate-400 mt-1">
                      {form.gutschein_typ==='produkte'
                        ? 'Anzahl der Produkte die mit diesem Gutschein gratis sind (teuerste werden abgezogen).'
                        : 'Fixer Betrag den dieser Gutschein abdeckt.'}
                    </p>
                  </div>
                </div>
              )}
            </div>

            <div className="flex gap-2 mt-1">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={save} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#000000'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── FinanzenView ─────────────────────────────────────────────────────────────
const FinanzenView = ({ cafe, toast, profile, profiles, user }) => {
  const [periode, setPeriode] = useState('woche');
  const [gesamt, setGesamt]   = useState(false);
  const [allData, setAllData]  = useState([]);
  const [loadingAll, setLoadingAll] = useState(false);
  const [customFrom, setCustomFrom] = useState('');
  const [customTo, setCustomTo]     = useState('');
  const [tab, setTab]          = useState('uebersicht');
  const [minKarte, setMinKarte] = useState((cafe.einstellungen||{}).min_karten_betrag||10);
  // Vergleich state
  const [cmpMode,    setCmpMode]    = useState('zeitraum'); // 'zeitraum' | 'produkt'
  const [cmpA,       setCmpA]       = useState('woche');
  const [cmpB,       setCmpB]       = useState('monat');
  const [cmpFromA,   setCmpFromA]   = useState('');
  const [cmpToA,     setCmpToA]     = useState('');
  const [cmpFromB,   setCmpFromB]   = useState('');
  const [cmpToB,     setCmpToB]     = useState('');
  const [selProdukte,setSelProdukte]= useState([]);
  const [selSchicht, setSelSchicht] = useState(null);

  // Load all areas for Gesamt view
  useEffect(() => {
    if (!gesamt || !profiles) return;
    setLoadingAll(true);
    Promise.all(
      profiles.map(pp => adb.collection(pp.id).doc('data').get().then(snap => ({
        id: pp.id, label: pp.label, color: pp.color||'#8b5cf6',
        data: snap.exists ? {...DEFAULT_CAFE(), ...snap.data()} : DEFAULT_CAFE()
      })).catch(()=>({ id:pp.id, label:pp.label, color:pp.color||'#8b5cf6', data:DEFAULT_CAFE() })))
    ).then(r => { setAllData(r); setLoadingAll(false); });
  }, [gesamt, profiles]);

  const sourceList = useMemo(() => {
    if (gesamt && allData.length) return allData;
    return [{ id: profile, label: 'Aktuell', color: '#6366f1', data: cafe }];
  }, [gesamt, allData, profile, cafe]);

  const allBestellungen = useMemo(() =>
    sourceList.flatMap(src =>
      (src.data.bestellungen||[]).filter(b=>b.status!=='storniert')
        .map(b=>({...b,_area:src.label,_areaId:src.id,_areaColor:src.color}))
    ), [sourceList]);

  const allStorniert = useMemo(() =>
    sourceList.flatMap(src => (src.data.bestellungen||[]).filter(b=>b.status==='storniert')),
    [sourceList]);

  const getRange = useCallback(p => {
    const now = new Date();
    const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if (p==='heute')        return [today, new Date(today.getTime()+86400000)];
    if (p==='gestern')      { const g=new Date(today.getTime()-86400000); return [g,today]; }
    if (p==='woche')        { const m=new Date(today); m.setDate(today.getDate()-(today.getDay()||7)+1); return [m,new Date(m.getTime()+7*86400000)]; }
    if (p==='letzteWoche')  { const m=new Date(today); m.setDate(today.getDate()-(today.getDay()||7)+1); const pm=new Date(m.getTime()-7*86400000); return [pm,m]; }
    if (p==='monat')        return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)];
    if (p==='letzterMonat') { const s=new Date(now.getFullYear(),now.getMonth()-1,1); return [s,new Date(now.getFullYear(),now.getMonth(),1)]; }
    if (p==='quartal')      { const q=Math.floor(now.getMonth()/3); return [new Date(now.getFullYear(),q*3,1),new Date(now.getFullYear(),q*3+3,1)]; }
    if (p==='jahr')         return [new Date(now.getFullYear(),0,1),new Date(now.getFullYear()+1,0,1)];
    if (p==='custom')       {
      const s = customFrom ? new Date(customFrom) : new Date(0);
      const e = customTo   ? new Date(new Date(customTo).getTime()+86400000) : new Date(now.getTime()+86400000);
      return [s,e];
    }
    return [new Date(0), new Date(now.getTime()+86400000)];
  }, [customFrom, customTo]);

  const [rs,re] = useMemo(()=>getRange(periode),[periode,getRange]);
  const [ps,pe] = useMemo(()=>{ const [s,e]=getRange(periode); const d=Math.max(e-s,86400000); return [new Date(s-d),new Date(s)]; },[periode,getRange]);

  const filterBy = useCallback((list,[s,e])=>list.filter(b=>{ const d=new Date(b.erstellt_am); return d>=s&&d<e; }),[]);
  const periodeB = useMemo(()=>filterBy(allBestellungen,[rs,re]),[allBestellungen,rs,re,filterBy]);
  const prevB    = useMemo(()=>filterBy(allBestellungen,[ps,pe]),[allBestellungen,ps,pe,filterBy]);

  const periodeUmsatz = periodeB.reduce((s,b)=>s+b.gesamt,0);
  const prevUmsatz    = prevB.reduce((s,b)=>s+b.gesamt,0);
  const umsatzDelta   = prevUmsatz>0 ? (periodeUmsatz-prevUmsatz)/prevUmsatz*100 : null;
  const countDelta    = prevB.length>0 ? periodeB.length-prevB.length : null;
  const avgBasket     = periodeB.length ? periodeUmsatz/periodeB.length : 0;
  const avgItems      = periodeB.length ? periodeB.reduce((s,b)=>s+(b.artikel||[]).reduce((a,x)=>a+x.menge,0),0)/periodeB.length : 0;
  const stornoCount   = filterBy(allStorniert,[rs,re]).length;

  const schichten = useMemo(()=>
    sourceList.flatMap(src=>(src.data.schichten||[]).map(s=>({...s,_area:src.label,_areaId:src.id})))
      .sort((a,b)=>new Date(b.start)-new Date(a.start)),
    [sourceList]);
  const periodeSchichten = useMemo(()=>schichten.filter(s=>{
    const d=new Date(s.start); return d>=rs&&d<re;
  }),[schichten,rs,re]);

  const zahlungsBreakdown = useMemo(()=>{
    const map={};
    periodeB.forEach(b=>(b.zahlung||[]).forEach(z=>{map[z.name||z.art]=(map[z.name||z.art]||0)+z.betrag;}));
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[periodeB]);

  const katBreakdown = useMemo(()=>{
    const map={};
    periodeB.forEach(b=>(b.artikel||[]).forEach(a=>{
      const kat=(cafe.kategorien||[]).find(k=>k.id===a.kategorie_id);
      const key=kat?.name||'Sonstige'; const col=kat?.farbe||'#8b5cf6';
      if(!map[key]) map[key]={betrag:0,count:0,color:col};
      map[key].betrag+=a.preis*a.menge; map[key].count+=a.menge;
    }));
    return Object.entries(map).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.betrag-a.betrag);
  },[periodeB,cafe.kategorien]);

  const topProdukte = useMemo(()=>{
    const map={};
    periodeB.forEach(b=>(b.artikel||[]).forEach(a=>{
      if(!map[a.name]) map[a.name]={name:a.name,betrag:0,count:0};
      map[a.name].betrag+=a.preis*a.menge; map[a.name].count+=a.menge;
    }));
    return Object.values(map).sort((a,b)=>b.betrag-a.betrag).slice(0,10);
  },[periodeB]);

  // 7/30-day chart
  const chartDays = periode==='monat'||periode==='letzterMonat'||periode==='quartal'||periode==='jahr' ? 30 : 7;
  const chartData = useMemo(()=>{
    const days=[];
    const endDay = periode==='gestern'||periode==='letzteWoche'||periode==='letzterMonat' ? re : new Date();
    for(let i=chartDays-1;i>=0;i--){
      const d=new Date(endDay); d.setDate(d.getDate()-i);
      const s=new Date(d.getFullYear(),d.getMonth(),d.getDate());
      const e=new Date(s.getTime()+86400000);
      days.push({
        label: chartDays<=7 ? d.toLocaleDateString('de-DE',{weekday:'short'}) : d.toLocaleDateString('de-DE',{day:'numeric',month:'short'}),
        umsatz: filterBy(allBestellungen,[s,e]).reduce((s,b)=>s+b.gesamt,0),
        count:  filterBy(allBestellungen,[s,e]).length,
      });
    }
    return days;
  },[allBestellungen,chartDays,periode,re,filterBy]);
  const maxChartUmsatz = Math.max(...chartData.map(d=>d.umsatz),1);

  // Hourly distribution
  const stunden = useMemo(()=>{
    const arr=Array(24).fill(0);
    periodeB.forEach(b=>{ const h=new Date(b.erstellt_am).getHours(); arr[h]+=b.gesamt; });
    return arr;
  },[periodeB]);
  const maxStunde = Math.max(...stunden,1);

  // Weekday distribution
  const wochentage = useMemo(()=>{
    const LABELS=['Mo','Di','Mi','Do','Fr','Sa','So'];
    const arr=Array(7).fill(0);
    allBestellungen.forEach(b=>{ const d=((new Date(b.erstellt_am).getDay()||7)-1); arr[d]+=b.gesamt; });
    return LABELS.map((l,i)=>({label:l,umsatz:arr[i]}));
  },[allBestellungen]);
  const maxWT = Math.max(...wochentage.map(d=>d.umsatz),1);

  // Per-area breakdown (Gesamt mode)
  const areaBreakdown = useMemo(()=>{
    if (!gesamt || !allData.length) return [];
    return allData.map(src=>({
      label:src.label, color:src.color,
      umsatz: filterBy((src.data.bestellungen||[]).filter(b=>b.status!=='storniert'),[rs,re]).reduce((s,b)=>s+b.gesamt,0),
      count:  filterBy((src.data.bestellungen||[]).filter(b=>b.status!=='storniert'),[rs,re]).length,
    })).sort((a,b)=>b.umsatz-a.umsatz);
  },[gesamt,allData,rs,re,filterBy]);
  const maxAreaUmsatz = Math.max(...areaBreakdown.map(d=>d.umsatz),1);

  const periodeLabels = {woche:'Diese Woche',monat:'Dieser Monat',jahr:'Dieses Jahr',custom:'Benutzerdefiniert'};

  const saveMinKarte = () => {
    const _d3 = {...DEFAULT_CAFE(),...cafe, einstellungen:{...(cafe.einstellungen||{}), min_karten_betrag:parseFloat(minKarte)||10}};

    toast('Gespeichert ✓');
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(cafe,null,2)],{type:'application/json'});

    toast('Export erfolgreich');

  const Delta = ({val,suffix=''}) => val===null?null:(
    <div className={`text-xs font-semibold mt-0.5 flex items-center gap-0.5 ${val>=0?'text-emerald-600':'text-red-500'}`}>
      {val>=0?'↑':'↓'} {Math.abs(val).toFixed(1)}{suffix}
    </div>
  );

  const TABS = [{id:'uebersicht',label:'Übersicht'},{id:'vergleich',label:'Vergleich'},{id:'produkte',label:'Produkte'},{id:'schichten',label:'Schichten'}];

  const periodLabel = periodeLabels[periode] || 'Export';

  const exportExcel = () => {

    const fmtD = d => d ? new Date(d).toLocaleString('de-DE') : '';
    const fmtE = v => parseFloat(v.toFixed(2));

    // Sheet 1: Übersicht

      ['K21 Café — Finanzen Export'],
      ['Zeitraum:', periodLabel],
      ['Exportiert:', new Date().toLocaleString('de-DE')],
      [],
      ['Kennzahl','Wert'],
      ['Umsatz (€)', fmtE(periodeUmsatz)],
      ['Bestellungen', periodeB.length],
      ['Ø Bestellung (€)', fmtE(avgBasket)],
      ['Ø Artikel/Bestellung', fmtE(avgItems)],
      ['Stornierungen', stornoCount],
      [],
      ['Zahlungsart','Betrag (€)'],
      ...zahlungsBreakdown.map(([k,v])=>[k, fmtE(v)]),
      [],
      ['Kategorie','Umsatz (€)','Stück'],
      ...katBreakdown.map(k=>[k.name, fmtE(k.betrag), k.count]),
    ];
    const ws1 = XLSX.utils.aoa_to_sheet(ov);
    ws1['!cols'] = [{wch:28},{wch:16}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Übersicht');

    // Sheet 2: Top Produkte

      ['Produkt','Umsatz (€)','Anzahl'],
      ...topProdukte.map(p=>[p.name, fmtE(p.betrag), p.count]),
    ];
    const ws2 = XLSX.utils.aoa_to_sheet(pr);
    ws2['!cols'] = [{wch:30},{wch:14},{wch:10}];

        fmtE(b.gesamt), (b.zahlung||[]).map(z=>z.name).join(', '),
        b.kassiererName||'', b._area||'',
      ]),
    ];
    const ws3 = XLSX.utils.aoa_to_sheet(br);
    ws3['!cols'] = [{wch:6},{wch:18},{wch:16},{wch:20},{wch:12},{wch:16},{wch:14},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws3, 'Bestellungen');

    // Sheet 4: Schichten
    const sr = [
      ['Kassierer','Start','Ende','Startgeld (€)','Endgeld (€)','Umsatz (€)','Bestellungen','Bereich'],
      ...periodeSchichten.map(s=>[
        s.kassiererName||'', fmtD(s.start), fmtD(s.ende),
        fmtE(s.kassenstart||0), fmtE(s.kassenende||0),
        fmtE(s.umsatz||0), s.bestellungen_count||0, s._area||'',
      ]),
    ];
    const ws4 = XLSX.utils.aoa_to_sheet(sr);
    ws4['!cols'] = [{wch:14},{wch:18},{wch:18},{wch:14},{wch:14},{wch:12},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws4, 'Schichten');

    const fname = `k21-cafe-${profile}-${periodLabel.replace(/\s/g,'-')}-${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast('Excel exportiert ✓');
  };

      <tr>
        <td>${b.nummer||''}</td>
        <td>${fmtD(b.erstellt_am)}</td>
        <td>${b.kundenname||''}</td>
        <td>${b.notiz||''}</td>
        <td style="text-align:right">${fmtE(b.gesamt)}</td>
        <td>${(b.zahlung||[]).map(z=>z.name).join(', ')}</td>
        <td>${b.kassiererName||''}</td>
      </tr>`).join('');
    const topRows = topProdukte.map(p=>`<tr><td>${p.name}</td><td style="text-align:right">${fmtE(p.betrag)}</td><td style="text-align:right">${p.count}</td></tr>`).join('');

      <title>K21 Café – ${periodLabel}</title>

        .kpi-val { font-size:20px; font-weight:900; letter-spacing:-0.03em; }
        .kpi-lbl { font-size:10px; color:#666; margin-top:2px; text-transform:uppercase; letter-spacing:.05em; }

        td { padding:6px 10px; border-bottom:1px solid #eee; }
        tr:last-child td { border-bottom:none; }
        @media print { button { display:none; } body { padding:20px; } }
      </style></head><body>

      <div class="sub">Finanzen — ${periodLabel} · Exportiert am ${new Date().toLocaleString('de-DE')}</div>
      <div class="kpis">
        <div class="kpi"><div class="kpi-val">${fmtE(periodeUmsatz)}</div><div class="kpi-lbl">Umsatz</div></div>
        <div class="kpi"><div class="kpi-val">${periodeB.length}</div><div class="kpi-lbl">Bestellungen</div></div>

      <h2>Top Produkte</h2>
      <table><thead><tr><th>Produkt</th><th>Umsatz</th><th>Stück</th></tr></thead><tbody>${topRows}</tbody></table>
      <h2>Alle Bestellungen (${periodeB.length})</h2>
      <table><thead><tr><th>#</th><th>Datum</th><th>Name</th><th>Notiz</th><th>Gesamt</th><th>Zahlung</th><th>Kassierer</th></tr></thead><tbody>${rows}</tbody></table>
      <button onclick="window.print()" style="padding:10px 24px;background:#000;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px">Drucken / Als PDF speichern</button>
    </body></html>`);
    w.document.close();
  };

  // ── Vergleich helpers ──────────────────────────────────────────────────────
  const getRangeFor = useCallback((p, fromC, toC) => {
    const now = new Date();
    const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if (p==='woche')  { const m=new Date(today); m.setDate(today.getDate()-(today.getDay()||7)+1); return [m,new Date(m.getTime()+7*86400000)]; }
    if (p==='monat')  return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)];
    if (p==='jahr')   return [new Date(now.getFullYear(),0,1),new Date(now.getFullYear()+1,0,1)];
    if (p==='custom') {
      const s = fromC ? new Date(fromC) : new Date(0);
      const e = toC   ? new Date(new Date(toC).getTime()+86400000) : new Date(now.getTime()+86400000);
      return [s,e];
    }
    return [new Date(0), new Date(now.getTime()+86400000)];
  }, []);

  const cmpPeriodLabels = {woche:'Diese Woche',monat:'Dieser Monat',jahr:'Dieses Jahr',custom:'Benutzerdefiniert'};

  const [rasA,reA] = useMemo(()=>getRangeFor(cmpA,cmpFromA,cmpToA),[cmpA,cmpFromA,cmpToA,getRangeFor]);
  const [rasB,reB] = useMemo(()=>getRangeFor(cmpB,cmpFromB,cmpToB),[cmpB,cmpFromB,cmpToB,getRangeFor]);

  const cmpBestellungenA = useMemo(()=>filterBy(allBestellungen,[rasA,reA]),[allBestellungen,rasA,reA,filterBy]);
  const cmpBestellungenB = useMemo(()=>filterBy(allBestellungen,[rasB,reB]),[allBestellungen,rasB,reB,filterBy]);

  const cmpStats = useCallback((bestellungen) => {
    const umsatz = bestellungen.reduce((s,b)=>s+b.gesamt,0);
    const count  = bestellungen.length;
    const avg    = count ? umsatz/count : 0;
    const produktMap = {};
    bestellungen.forEach(b=>(b.artikel||[]).forEach(a=>{
      if (!produktMap[a.name]) produktMap[a.name]={name:a.name,betrag:0,count:0};
      produktMap[a.name].betrag+=a.preis*a.menge; produktMap[a.name].count+=a.menge;
    }));
    const topP = Object.values(produktMap).sort((a,b)=>b.betrag-a.betrag).slice(0,5);
    const katMap = {};
    bestellungen.forEach(b=>(b.artikel||[]).forEach(a=>{
      const kat=(cafe.kategorien||[]).find(k=>k.id===a.kategorie_id);
      const key=kat?.name||'Sonstige'; const col=kat?.farbe||'#8b5cf6';
      if(!katMap[key]) katMap[key]={betrag:0,color:col};
      katMap[key].betrag+=a.preis*a.menge;
    }));
    const topK = Object.entries(katMap).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.betrag-a.betrag);
    return {umsatz,count,avg,topP,topK};
  }, [cafe.kategorien]);

  const statsA = useMemo(()=>cmpStats(cmpBestellungenA),[cmpBestellungenA,cmpStats]);
  const statsB = useMemo(()=>cmpStats(cmpBestellungenB),[cmpBestellungenB,cmpStats]);

  // Produkt-Vergleich: for each selected product, get revenue+count per period
  const allProdukteNamen = useMemo(()=>{
    const map={};
    allBestellungen.forEach(b=>(b.artikel||[]).forEach(a=>{ map[a.name]=true; }));
    return Object.keys(map).sort();
  },[allBestellungen]);

  const prodVglData = useMemo(()=>{
    if (!selProdukte.length) return [];
    return selProdukte.map(name => {
      const [s,e] = getRangeFor(periode, customFrom, customTo);
      const filtered = filterBy(allBestellungen,[s,e]);
      let betrag=0, count=0;
      filtered.forEach(b=>(b.artikel||[]).forEach(a=>{ if(a.name===name){betrag+=a.preis*a.menge; count+=a.menge;} }));
      return {name, betrag, count};
    }).sort((a,b)=>b.betrag-a.betrag);
  },[selProdukte,allBestellungen,periode,customFrom,customTo,getRangeFor,filterBy]);
  const maxProdVgl = Math.max(...prodVglData.map(d=>d.betrag),1);

  return (
    <div className="flex flex-col gap-5">

      {/* Controls row */}
      <div className="flex flex-wrap items-center gap-2">
        {profiles && profiles.length > 1 && (
          <button onClick={()=>setGesamt(g=>!g)}
            className={`pill transition-all font-semibold ${gesamt?'text-white':'text-slate-600 bg-white border border-black/10'}`}
            style={gesamt?{background:'#6366f1'}:{}}>
            Alle Bereiche {gesamt && allData.length ? `(${allData.length})` : ''}
          </button>
        )}
        <div style={{flex:'1 1 0',minWidth:0}}/>
        {tab !== 'vergleich' && (
          <div className="flex gap-1.5">
            {Object.entries(periodeLabels).map(([v,l])=>(
              <button key={v} onClick={()=>setPeriode(v)}
                className={`pill transition-all ${periode===v?'text-white':'text-slate-600 bg-white border border-black/10'}`}
                style={periode===v?{background:'#000000'}:{}}>
                {l}
              </button>
            ))}
          </div>
        )}
        {/* Export buttons */}
        {tab !== 'vergleich' && (
          <div className="flex gap-1.5">
            <button onClick={exportExcel}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all border border-black/10 hover:bg-black hover:text-white hover:border-black"
              title="Als Excel exportieren">
              <SI p={IC.download} size={12}/>Excel
            </button>
            <button onClick={exportPDF}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all border border-black/10 hover:bg-black hover:text-white hover:border-black"
              title="Als PDF exportieren">
              <SI p={IC.download} size={12}/>PDF
            </button>
          </div>
        )}
      </div>

      {tab !== 'vergleich' && periode==='custom' && (
        <div className="glass rounded-xl p-3 flex flex-wrap gap-3 items-center">
          <div className="flex items-center gap-2">
            <label className="text-xs text-slate-500 font-semibold">Von</label>
            <input type="date" className={INP_SM} value={customFrom} onChange={e=>setCustomFrom(e.target.value)} style={{width:'140px'}}/>
          </div>
          <div className="flex items-center gap-2">
            <label className="text-xs text-slate-500 font-semibold">Bis</label>
            <input type="date" className={INP_SM} value={customTo} onChange={e=>setCustomTo(e.target.value)} style={{width:'140px'}}/>
          </div>
        </div>
      )}

      {/* Sub-tabs */}
      <div className="flex gap-1" style={{borderBottom:'2px solid #f1f5f9'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            className="px-4 py-2 text-xs font-semibold transition-all"
            style={{color:tab===t.id?'#000000':'#94a3b8',borderBottom:tab===t.id?'2px solid #000000':'2px solid transparent',marginBottom:'-2px'}}>
            {t.label}
          </button>
        ))}
      </div>

      {loadingAll && gesamt && (
        <div className="text-center py-8 text-slate-400 text-sm">Lade alle Bereiche…</div>
      )}

      {/* ── ÜBERSICHT ── */}
      {tab==='uebersicht' && (
        <div className="flex flex-col gap-5">

          {/* KPI cards */}
          <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))'}}>
            {[
              {label:'Umsatz',     val:fmtEur(periodeUmsatz), delta:<Delta val={umsatzDelta} suffix="%"/>, col:'#000000'},
              {label:'Bestellungen', val:periodeB.length, delta:<Delta val={countDelta} suffix=" vs. vorher"/>, col:'#6366f1'},
              {label:'Ø Bestellung', val:periodeB.length?fmtEur(avgBasket):'—', col:'#f59e0b'},
              {label:'Ø Artikel',  val:periodeB.length?avgItems.toFixed(1):'—', col:'#06b6d4'},
              {label:'Schichten',  val:periodeSchichten.length, col:'#10b981'},
              {label:'Stornierungen', val:stornoCount, col:'#ef4444'},
            ].map(({label,val,delta,col})=>(
              <div key={label} className="glass rounded-2xl p-4 glow" style={{borderTop:`3px solid ${col}`}}>
                <div className="text-xs text-slate-400 mb-1">{label}</div>
                <div className="text-xl font-bold" style={{color:col}}>{val}</div>
                {delta||null}
              </div>
            ))}
          </div>

          {/* Per-area breakdown (Gesamt only) */}
          {gesamt && areaBreakdown.length > 1 && (
            <div className="glass rounded-2xl p-5 glow">
              <h3 className="text-sm font-bold text-slate-700 mb-4">Bereiche im Vergleich</h3>
              <div className="flex flex-col gap-3">
                {areaBreakdown.map(a=>(
                  <div key={a.label} className="flex items-center gap-3">
                    <div className="w-24 flex-shrink-0">
                      <div className="text-xs font-semibold text-slate-700 truncate">{a.label}</div>
                      <div className="text-xs text-slate-400">{a.count} Best.</div>
                    </div>
                    <div className="flex-1 rounded-full overflow-hidden" style={{height:'10px',background:'#f1f5f9'}}>
                      <div style={{height:'100%',width:`${(a.umsatz/maxAreaUmsatz*100).toFixed(1)}%`,background:a.color||'#6366f1',borderRadius:'9px',transition:'width .4s'}}/>
                    </div>
                    <span className="text-sm font-bold text-slate-800 w-20 text-right">{fmtEur(a.umsatz)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Umsatz chart */}
          <div className="glass rounded-2xl p-5 glow">
            <h3 className="text-sm font-bold text-slate-700 mb-4">Umsatz letzte {chartDays} Tage</h3>
            <div className="flex items-end gap-1" style={{height:'120px'}}>
              {chartData.map((d,i)=>(
                <div key={i} className="flex-1 flex flex-col items-center gap-1 min-w-0" title={`${d.label}: ${fmtEur(d.umsatz)}`}>
                  {d.umsatz>0 && <span className="text-slate-400 truncate w-full text-center" style={{fontSize:'7px'}}>{fmtEur(d.umsatz)}</span>}
                  <div style={{width:'100%',height:`${Math.max(4,d.umsatz/maxChartUmsatz*90)}px`,background:'#6366f1',borderRadius:'4px 4px 0 0',opacity:d.umsatz===0?0.12:1,transition:'height .3s'}}/>
                  <span className="text-slate-400 truncate w-full text-center" style={{fontSize:'7px'}}>{d.label}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Two-column: Wochentage + Uhrzeiten */}
          <div className="grid gap-4" style={{gridTemplateColumns:'1fr 1fr'}}>
            <div className="glass rounded-2xl p-5 glow">
              <h3 className="text-sm font-bold text-slate-700 mb-3">Wochentage</h3>
              <div className="flex items-end gap-2" style={{height:'80px'}}>
                {wochentage.map((d,i)=>(
                  <div key={i} className="flex-1 flex flex-col items-center gap-1">
                    <div style={{width:'100%',height:`${Math.max(3,d.umsatz/maxWT*65)}px`,background:'#10b981',borderRadius:'3px 3px 0 0',opacity:d.umsatz===0?0.12:1,transition:'height .3s'}}/>
                    <span className="text-slate-500" style={{fontSize:'9px'}}>{d.label}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="glass rounded-2xl p-5 glow">
              <h3 className="text-sm font-bold text-slate-700 mb-3">Uhrzeiten</h3>
              <div className="flex items-end gap-0.5" style={{height:'80px'}}>
                {stunden.map((v,i)=>(
                  <div key={i} className="flex-1 flex flex-col items-center" title={`${i}:00 — ${fmtEur(v)}`}>
                    <div style={{width:'100%',height:`${Math.max(2,v/maxStunde*65)}px`,background:'#f59e0b',borderRadius:'2px 2px 0 0',opacity:v===0?0.1:1,transition:'height .3s'}}/>
                  </div>
                ))}
              </div>
              <div className="flex justify-between mt-1">
                <span className="text-slate-400" style={{fontSize:'8px'}}>0h</span>
                <span className="text-slate-400" style={{fontSize:'8px'}}>12h</span>
                <span className="text-slate-400" style={{fontSize:'8px'}}>23h</span>
              </div>
            </div>
          </div>

          {/* Zahlungsarten + Kategorien */}
          <div className="grid gap-4" style={{gridTemplateColumns:'1fr 1fr'}}>
            {zahlungsBreakdown.length > 0 && (
              <div className="glass rounded-2xl p-5 glow">
                <h3 className="text-sm font-bold text-slate-700 mb-3">Zahlungsarten</h3>
                <div className="flex flex-col gap-2.5">
                  {zahlungsBreakdown.map(([art,betrag])=>(
                    <div key={art} className="flex items-center gap-2">
                      <span className="text-xs text-slate-500 truncate" style={{width:'60px'}}>{art}</span>
                      <div className="flex-1 rounded-full overflow-hidden" style={{height:'7px',background:'#f1f5f9'}}>
                        <div style={{height:'100%',width:`${periodeUmsatz>0?(betrag/periodeUmsatz*100).toFixed(1):0}%`,background:'#6366f1',borderRadius:'9px',transition:'width .4s'}}/>
                      </div>
                      <span className="text-xs font-semibold text-slate-700 text-right" style={{width:'60px'}}>{fmtEur(betrag)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {katBreakdown.length > 0 && (
              <div className="glass rounded-2xl p-5 glow">
                <h3 className="text-sm font-bold text-slate-700 mb-3">Kategorien</h3>
                <div className="flex flex-col gap-2.5">
                  {katBreakdown.map(k=>(
                    <div key={k.name} className="flex items-center gap-2">
                      <span className="text-xs text-slate-500 truncate" style={{width:'60px'}}>{k.name}</span>
                      <div className="flex-1 rounded-full overflow-hidden" style={{height:'7px',background:'#f1f5f9'}}>
                        <div style={{height:'100%',width:`${periodeUmsatz>0?(k.betrag/periodeUmsatz*100).toFixed(1):0}%`,background:k.color,borderRadius:'9px',transition:'width .4s'}}/>
                      </div>
                      <span className="text-xs font-semibold text-slate-700 text-right" style={{width:'60px'}}>{fmtEur(k.betrag)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Top Produkte */}
          {topProdukte.length > 0 && (
            <div className="glass rounded-2xl p-5 glow">
              <h3 className="text-sm font-bold text-slate-700 mb-4">Top Produkte</h3>
              <div className="flex flex-col gap-2.5">
                {topProdukte.slice(0,8).map((p,i)=>(
                  <div key={p.name} className="flex items-center gap-3">
                    <span className="text-xs font-bold text-slate-400 w-4 text-right flex-shrink-0">{i+1}</span>
                    <span className="text-xs text-slate-600 truncate flex-shrink-0" style={{width:'110px'}}>{p.name}</span>
                    <div className="flex-1 rounded-full overflow-hidden" style={{height:'7px',background:'#f1f5f9'}}>
                      <div style={{height:'100%',width:`${(p.betrag/topProdukte[0].betrag*100).toFixed(1)}%`,background:'#000000',borderRadius:'9px',transition:'width .4s'}}/>
                    </div>
                    <span className="text-xs text-slate-400 flex-shrink-0" style={{width:'32px',textAlign:'right'}}>{p.count}x</span>
                    <span className="text-xs font-semibold text-slate-700 flex-shrink-0" style={{width:'56px',textAlign:'right'}}>{fmtEur(p.betrag)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Weitere Kennzahlen */}
          {periodeB.length > 0 && (()=>{
            const peakHour = stunden.indexOf(Math.max(...stunden));
            const peakUmsatz = stunden[peakHour];
            const maxDay = wochentage.reduce((a,b)=>b.umsatz>a.umsatz?b:a,wochentage[0]);
            const cashTotal = zahlungsBreakdown.filter(([a])=>a==='Bar'||a==='Bargeld').reduce((s,[,v])=>s+v,0);
            const cardTotal = zahlungsBreakdown.filter(([a])=>a==='Karte'||a==='EC'||a==='Giro').reduce((s,[,v])=>s+v,0);
            const umsatzProSchicht = periodeSchichten.length ? periodeUmsatz/periodeSchichten.length : 0;
            return (
              <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))'}}>
                {[
                  {label:'Stornierungen', val:stornoCount, sub: stornoCount>0?'im Zeitraum':'', col:'#ef4444'},
                  {label:'Peak-Stunde',   val:`${peakHour}:00`, sub:fmtEur(peakUmsatz), col:'#f59e0b'},
                  {label:'Stärkster Tag', val:maxDay.label, sub:fmtEur(maxDay.umsatz), col:'#10b981'},
                  periodeSchichten.length ? {label:'Ø Umsatz/Schicht', val:fmtEur(umsatzProSchicht), sub:`${periodeSchichten.length} Schichten`, col:'#6366f1'} : null,
                  cashTotal>0  ? {label:'Bar-Anteil',  val:`${periodeUmsatz>0?(cashTotal/periodeUmsatz*100).toFixed(0):0}%`, sub:fmtEur(cashTotal), col:'#475569'} : null,
                  cardTotal>0  ? {label:'Karten-Anteil',val:`${periodeUmsatz>0?(cardTotal/periodeUmsatz*100).toFixed(0):0}%`, sub:fmtEur(cardTotal), col:'#6366f1'} : null,
                ].filter(Boolean).map(({label,val,sub,col})=>(
                  <div key={label} className="glass rounded-2xl p-4 glow" style={{borderLeft:`3px solid ${col}`}}>
                    <div className="text-xs text-slate-400 mb-1">{label}</div>
                    <div className="text-lg font-bold" style={{color:col}}>{val}</div>
                    {sub && <div className="text-xs text-slate-400 mt-0.5">{sub}</div>}
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
      )}

      {/* ── VERGLEICH ── */}
      {tab==='vergleich' && (
        <div className="space-y-4">
          {/* Mode toggle */}
          <div className="glass rounded-2xl p-4">
            <div className="flex gap-2">
              {[{id:'zeitraum',label:'Zeiträume vergleichen'},{id:'produkt',label:'Produkte vergleichen'}].map(m=>(
                <button key={m.id} onClick={()=>setCmpMode(m.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${cmpMode===m.id?'bg-black text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                  {m.label}
                </button>
              ))}
            </div>
          </div>

          {cmpMode==='zeitraum' && (() => {
            const cmpPeriodLabels = {woche:'Diese Woche',monat:'Dieser Monat',jahr:'Dieses Jahr',custom:'Benutzerdefiniert'};
            const PeriodPicker = ({val, setVal, from, setFrom, to, setTo, label}) => (
              <div className="flex-1 min-w-0">
                <div className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">{label}</div>
                <div className="flex flex-wrap gap-1 mb-2">
                  {Object.entries(cmpPeriodLabels).map(([v,l])=>(
                    <button key={v} onClick={()=>setVal(v)}
                      className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${val===v?'bg-black text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                      {l}
                    </button>
                  ))}
                </div>
                {val==='custom' && (
                  <div className="flex gap-2 mt-1">
                    <input type="date" value={from} onChange={e=>setFrom(e.target.value)}
                      className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-black"/>
                    <input type="date" value={to} onChange={e=>setTo(e.target.value)}
                      className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-black"/>
                  </div>
                )}
              </div>
            );
            const diff = (a,b,fmt) => {
              if (a===0&&b===0) return null;
              const d = b-a; const pct = a===0?null:Math.round(d/a*100);
              const col = d>=0?'text-emerald-600':'text-red-500';
              return <span className={`text-xs font-semibold ${col}`}>{d>=0?'+':''}{fmt(d)}{pct!==null?` (${pct>0?'+':''}${pct}%)`:''}</span>;
            };
            const fmtE = v => `${v>=0?'':'−'}${Math.abs(v).toFixed(2)} €`;
            const fmtN = v => `${v>=0?'+':'-'}${Math.abs(v)}`;
            return (
              <div className="space-y-4">
                {/* Period pickers */}
                <div className="glass rounded-2xl p-5">
                  <div className="flex gap-6 flex-wrap">
                    <PeriodPicker val={cmpA} setVal={setCmpA} from={cmpFromA} setFrom={setCmpFromA} to={cmpToA} setTo={setCmpToA} label="Zeitraum A"/>
                    <div className="flex items-center self-start mt-7 text-slate-400 font-bold text-lg">vs</div>
                    <PeriodPicker val={cmpB} setVal={setCmpB} from={cmpFromB} setFrom={setCmpFromB} to={cmpToB} setTo={setCmpToB} label="Zeitraum B"/>
                  </div>
                </div>

                {/* KPI comparison */}
                <div className="grid grid-cols-3 gap-3">
                  {[
                    {label:'Umsatz', va:statsA.umsatz, vb:statsB.umsatz, fmt:v=>`${v.toFixed(2)} €`},
                    {label:'Bestellungen', va:statsA.count, vb:statsB.count, fmt:v=>`${v}`},
                    {label:'Ø Bestellung', va:statsA.avg, vb:statsB.avg, fmt:v=>`${v.toFixed(2)} €`},
                  ].map(({label,va,vb,fmt})=>(
                    <div key={label} className="glass rounded-2xl p-4">
                      <div className="text-xs text-slate-500 mb-2 font-semibold uppercase tracking-wide">{label}</div>
                      <div className="flex justify-between items-end gap-2">
                        <div>
                          <div className="text-xs text-slate-400 mb-0.5">A</div>
                          <div className="text-sm font-bold text-slate-800">{fmt(va)}</div>
                        </div>
                        <div className="text-right">
                          <div className="text-xs text-slate-400 mb-0.5">B</div>
                          <div className="text-sm font-bold text-slate-800">{fmt(vb)}</div>
                        </div>
                      </div>
                      <div className="mt-2 pt-2 border-t border-slate-100">
                        {diff(va,vb,label==='Bestellungen'?fmtN:fmtE) || <span className="text-xs text-slate-400">Keine Daten</span>}
                      </div>
                    </div>
                  ))}

                        diff!=null ? {label:'Kassendifferenz', val:(diff>=0?'+':'')+fmtEur(diff), col:diff<0?'#ef4444':'#10b981'} : null,
                        selSchicht.kassenstart!=null ? {label:'Kassenstart',val:fmtEur(selSchicht.kassenstart||0), col:'#475569'} : null,

                                <div style={{height:'100%',width:`${sUmsatz>0?(betrag/sUmsatz*100).toFixed(1):0}%`,background:'#6366f1',borderRadius:'9px'}}/>
                              </div>
                              <span className="text-xs font-semibold text-slate-700" style={{width:'60px',textAlign:'right'}}>{fmtEur(betrag)}</span>
                              <span className="text-xs text-slate-400" style={{width:'36px',textAlign:'right'}}>{sUmsatz>0?(betrag/sUmsatz*100).toFixed(0):'0'}%</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {/* Top Produkte dieser Schicht */}
                    {sTopProd.length > 0 && (
                      <div>
                        <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Verkaufte Produkte</h4>
                        <div className="flex flex-col gap-2">

                        </div>
                      </div>
                    )}
                    {/* Bestellungen */}
                    <div>
                      <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Bestellungen ({sB.length})</h4>
                      {sB.length===0 && <div className="text-xs text-slate-400 py-4 text-center">Keine Bestellungen in dieser Schicht</div>}

                          <div key={b.id} className="flex items-start justify-between py-2.5" style={{borderBottom:'1px solid rgba(0,0,0,0.05)'}}>

                                <span className="text-xs font-semibold text-slate-700">#{b.nummer||'—'}</span>

                                <span className="text-xs text-slate-400">{fmtTime(b.erstellt_am)}</span>
                              </div>
                              <div className="text-xs text-slate-400 mt-0.5 truncate">
                                {(b.artikel||[]).map(a=>`${a.menge}× ${a.name}`).join(', ')}

                              {b.notiz && <div className="text-xs text-slate-400 italic mt-0.5">"{b.notiz}"</div>}
                            </div>
                            <div className="flex-shrink-0 ml-3 text-right">
                              <div className="text-sm font-bold text-slate-800">{fmtEur(b.gesamt)}</div>
                              <div className="text-xs text-slate-400">{(b.zahlung||[]).map(z=>z.name||z.art).join(', ')}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* ── Admin: Daten bereinigen ───────────────────────────────────────── */}
      {['owner','admin'].includes((user?.role||'').toLowerCase()) && (
        <div className="glass rounded-2xl p-5 glow" style={{borderTop:'3px solid #ef4444'}}>
          <h3 className="text-sm font-bold text-slate-700 mb-1">🗑 Daten bereinigen</h3>
          <p className="text-xs text-slate-400 mb-4">Verwaiste oder Test-Daten dauerhaft aus Firestore löschen.</p>
          <div className="flex flex-wrap gap-2">
            <button onClick={()=>{
              if (!window.confirm('Alle Bestellungen UND Schichten löschen? Das kann nicht rückgängig gemacht werden.')) return;
              const neu = {...DEFAULT_CAFE(),...cafe, bestellungen:[], schichten:[]};
              serverWrite(profile||'k21-cafe', neu);

              toast('Bestellungen & Schichten gelöscht ✓');

              Alle Bestellungen &amp; Schichten löschen
            </button>
            <button onClick={()=>{
              if (!window.confirm('Nur Bestellungen löschen (Schichten bleiben)?')) return;
              const neu = {...DEFAULT_CAFE(),...cafe, bestellungen:[]};
              serverWrite(profile||'k21-cafe', neu);
              adb.collection(profile||'k21-cafe').doc('data').set(neu).catch(()=>{});
              toast('Bestellungen gelöscht ✓');
            }} className="flex items-center gap-1.5 px-4 py-2 text-xs font-semibold transition-all" style={{borderRadius:12,background:'rgba(239,68,68,0.1)',color:'#ef4444',border:'1px solid rgba(239,68,68,0.3)'}}>
              Nur Bestellungen löschen
            </button>
          </div>
        </div>
      )}

    </div>
  );
};

// ─── PersonenView ─────────────────────────────────────────────────────────────
const PersonenView = ({ toast, profile, user }) => {
  const [users, setUsers] = useState([]);
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({name:'',pin:'',role:'kassierer',farbe:'#8b5cf6',areaAccess:'__all__'});
  const [showPin, setShowPin] = useState(false);
  const [myPin, setMyPin]     = useState('');
  const [showMP, setShowMP]   = useState(false);
  const [pinOK, setPinOK]     = useState(false);
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const changeMyPin = async () => {
    if (!myPin.trim()) return;
    if (user?.id === '__owner__') {
      // Owner PIN → save to server/Firestore config
      await aFetch('/api/admin-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:myPin.trim()})}).catch(()=>{});
    } else if (user?.id) {
      // Regular user → update via server proxy AND Firestore
      await aFetch(`/api/users/${user.id}?c=cafe-users`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:myPin.trim()})}).catch(()=>{});
      adb.collection('cafe-users').doc(user.id).update({pin:myPin.trim()}).catch(()=>{});
    }
    setMyPin(''); setPinOK(true); setTimeout(()=>setPinOK(false),2500);
    toast('PIN gespeichert ✓');
  };

  const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#10b981','#06b6d4'];

  useEffect(() => {
    let cancelled = false;
    const load = async () => {
      try {
        const r = await aFetch('/api/users?c=cafe-users');
        if (r.ok) { const d = await r.json(); if (!cancelled) setUsers(d); return; }
      } catch {}
      const unsub = adb.collection('cafe-users').onSnapshot(
        snap => { if (!cancelled) setUsers(snap.docs.map(d=>({id:d.id,...d.data()}))); },
        () => {}
      );
      return () => unsub();
    };
    load();
    return () => { cancelled = true; };
  }, []);

  const save = async () => {
    if (!form.name.trim()||!form.pin.trim()) { toast('Name und PIN erforderlich','error'); return; }
    const data = {name:form.name.trim(),pin:form.pin.trim(),role:form.role,farbe:form.farbe,areaAccess:form.areaAccess||'__all__'};
    setModal(null);
    try {
      if (modal==='add') {
        const r = await aFetch('/api/users?c=cafe-users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        if (r.ok) { toast('Person hinzugefügt'); return; }
      } else {
        const r = await aFetch(`/api/users/${modal}?c=cafe-users`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        if (r.ok) { toast('Person aktualisiert'); return; }
      }
    } catch {}
    // Firestore fallback
    if (modal==='add') adb.collection('cafe-users').add(data).then(()=>toast('Person hinzugefügt')).catch(e=>toast(e.message,'error'));
    else adb.collection('cafe-users').doc(modal).update(data).then(()=>toast('Person aktualisiert')).catch(e=>toast(e.message,'error'));
  };

  const del = async (id) => {
    try {
      await aFetch(`/api/users/${id}?c=cafe-users`,{method:'DELETE'});
    } catch {}
    adb.collection('cafe-users').doc(id).delete().catch(()=>{});
    toast('Person gelöscht','warn');
  };

  const openAdd = () => { setForm({name:'',pin:'',role:'kassierer',farbe:'#8b5cf6',areaAccess:'__all__'}); setShowPin(false); setModal('add'); };
  const openEdit = u => { setForm({name:u.name,pin:u.pin||'',role:u.role||'kassierer',farbe:u.farbe||'#8b5cf6',areaAccess:u.areaAccess||'__all__'}); setShowPin(false); setModal(u.id); };

  return (
    <div>
      {/* Mein PIN ändern */}
      <div className="glass rounded-2xl p-4 mb-5 glow">
        <p className="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-3">Mein PIN ändern</p>
        <div className="flex gap-2">
          <div className="relative flex-1">
            <input type="text" autoComplete="off" style={{WebkitTextSecurity:showMP?'none':'disc'}}
              value={myPin} onChange={e=>setMyPin(e.target.value)}
              placeholder="Neuer PIN" className={INP+' pr-10'}
              onKeyDown={e=>e.key==='Enter'&&changeMyPin()}/>
            <button type="button" onClick={()=>setShowMP(p=>!p)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-all">
              <SI p={IC.eye} size={14}/>
            </button>
          </div>
          <button onClick={changeMyPin} disabled={!myPin.trim()}
            className="px-4 py-2.5 text-sm font-bold text-white disabled:opacity-40 transition-all rounded-xl"
            style={{background:'#000000'}}>
            {pinOK?'✓':'Speichern'}
          </button>
        </div>
        {user?.id==='__owner__' && <p className="text-xs text-slate-400 mt-2">Admin-PIN ist fest eingestellt.</p>}
      </div>

      <div className="flex items-center justify-between mb-4">
        <div className="text-xs text-slate-500">{users.length} Personen</div>
        <button onClick={openAdd} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white" style={{background:'#000000'}}>
          <SI p={IC.plus} size={14}/>Person
        </button>
      </div>
      <div className="flex flex-col gap-2">
        {users.map(u=>(
          <div key={u.id} className="glass rounded-2xl px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <Avatar name={u.name} color={u.farbe||'#8b5cf6'} size={36}/>
              <div>
                <div className="text-sm font-bold text-slate-800">{u.name}</div>
                <span className="pill text-xs" style={{background:'#f1f5f9',color:'#475569'}}>{ROLE_LABELS[u.role]||u.role}</span>
                {u.areaAccess && u.areaAccess !== '__all__' && Array.isArray(u.areaAccess) && (
                  <div className="flex flex-wrap gap-1 mt-1">
                    {u.areaAccess.map(aid => {
                      const pp = CAFE_PROFILES.find(p=>p.id===aid);
                      return pp ? (
                        <span key={aid} className="pill text-xs" style={{background:(pp.color||'#8b5cf6')+'22',color:pp.color||'#8b5cf6'}}>{pp.label}</span>
                      ) : null;
                    })}
                  </div>
                )}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={()=>openEdit(u)} className="text-slate-400 hover:text-slate-700 transition-all"><SI p={IC.edit} size={15}/></button>
              <button onClick={()=>del(u.id)} className="text-slate-400 hover:text-red-500 transition-all"><SI p={IC.trash} size={15}/></button>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title={modal==='add'?'Person hinzufügen':'Person bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Max Mustermann" autoFocus/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">PIN</label>
              <div className="relative">
                <input type={showPin?'text':'password'} className={INP} value={form.pin} onChange={e=>set('pin',e.target.value)} placeholder="PIN setzen"/>
                <button type="button" onClick={()=>setShowPin(v=>!v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                  <SI p={showPin?IC.eyeOff:IC.eye} size={14}/>
                </button>
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Rolle</label>
              <select className={INP} value={form.role} onChange={e=>set('role',e.target.value)}>
                {ROLE_OPTIONS.map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Farbe</label>
              <div className="flex flex-wrap gap-2">
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>set('farbe',c)}
                    className="w-7 h-7 rounded-full transition-all hover:scale-110"
                    style={{background:c,outline:form.farbe===c?`2px solid ${c}`:'2px solid transparent',outlineOffset:'2px'}}/>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Bereichs-Zugriff</label>
              <div className="flex flex-col gap-1.5">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={form.areaAccess==='__all__' || !form.areaAccess}
                    onChange={e=>setForm(f=>({...f, areaAccess: e.target.checked ? '__all__' : []}))}
                    className="rounded"/>
                  <span className="text-sm text-slate-700">Alle Bereiche</span>
                </label>
                {form.areaAccess !== '__all__' && form.areaAccess && CAFE_PROFILES.map(pp => (
                  <label key={pp.id} className="flex items-center gap-2 cursor-pointer ml-4">
                    <input type="checkbox"
                      checked={Array.isArray(form.areaAccess) && form.areaAccess.includes(pp.id)}
                      onChange={e=>setForm(f=>({...f, areaAccess: e.target.checked
                        ? [...(Array.isArray(f.areaAccess)?f.areaAccess:[]), pp.id]
                        : (Array.isArray(f.areaAccess)?f.areaAccess:[]).filter(x=>x!==pp.id)
                      }))}/>
                    <span className="text-sm text-slate-700">{pp.label}</span>
                  </label>
                ))}
              </div>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={save} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#000000'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};


// ─── KassiererSchichtStart ────────────────────────────────────────────────────
const KassiererSchichtStart = ({ user, toast, profile, cafe, onStarted }) => {
  const [kassenstart, setKassenstart] = useState('');

  const start = () => {
    const neu = {
      id:genId(), kassiererId:user.id, kassiererName:user.name,
      start:new Date().toISOString(), ende:null,
      kassenstart:parseFloat(kassenstart)||0, kassenende:null,
      bestellungen_count:0, umsatz:0,
    };
    toast('Schicht gestartet ✓');
    onStarted(neu);
    const _d2 = {...DEFAULT_CAFE(),...cafe, schichten:[...(cafe.schichten||[]),neu]};
    serverWrite(profile||'k21-cafe', _d2);
    withRetry(() => adb.collection(profile||'k21-cafe').doc('data').set(_d2), e=>toast(e.message,'error'));
  };

  return (
    <div style={{minHeight:'calc(100vh - 100px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}>
      <div className="glass rounded-2xl glow p-8 w-full max-w-sm text-center">
        
        <h2 className="text-xl font-bold text-slate-800 mb-1">Schicht starten</h2>
        <p className="text-sm text-slate-500 mb-6">Gib das Startgeld in der Kasse ein</p>
        <input type="number" className={INP+' mb-4 text-center text-xl font-bold'} placeholder="Startgeld (€)"
          value={kassenstart} onChange={e=>setKassenstart(e.target.value)} step="0.01" min="0" autoFocus
          onKeyDown={e=>e.key==='Enter'&&start()}/>
        <button onClick={start}
          className="w-full py-3 rounded-xl text-sm font-bold text-white"
          style={{background:'#000000',borderRadius:30}}>
          Schicht starten →
        </button>
      </div>
    </div>
  );
};

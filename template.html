// ─── GutscheineView ───────────────────────────────────────────────────────────
const GutscheineView = ({ cafe, toast, profile }) => {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({code:'',betrag:'',custom:false});

  const genCode = () => 'G' + Math.random().toString(36).slice(2,8).toUpperCase();

  const save = async () => {
    const code = form.custom ? form.code.trim().toUpperCase() : genCode();
    if (!code || !form.betrag) { toast('Code und Betrag erforderlich','error'); return; }
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    const exists = (data.gutscheine||[]).find(g=>g.code.toUpperCase()===code);
    if (exists) { toast('Code bereits vorhanden','error'); return; }
    const g = {id:genId(),code,betrag_original:parseFloat(form.betrag),betrag_rest:parseFloat(form.betrag),aktiv:true,erstellt_am:new Date().toISOString()};
    await ref.set({...data,gutscheine:[...(data.gutscheine||[]),g]});
    toast('Gutschein erstellt');
    setModal(false);
    setForm({code:'',betrag:'',custom:false});
  };

  const revoke = async (g) => {
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    await ref.set({...data,gutscheine:(data.gutscheine||[]).map(x=>x.id===g.id?{...x,aktiv:false}:x)});
    toast('Gutschein deaktiviert','warn');
  };

  const sorted = [...(cafe.gutscheine||[])].sort((a,b)=>new Date(b.erstellt_am)-new Date(a.erstellt_am));

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs text-slate-500">{sorted.length} Gutscheine</div>
        <button onClick={()=>setModal(true)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>
          <SI p={IC.plus} size={14}/>Gutschein
        </button>
      </div>
      {sorted.length===0 && <div className="text-center py-12 text-slate-400 text-sm">Keine Gutscheine</div>}
      <div className="flex flex-col gap-2">
        {sorted.map(g=>(
          <div key={g.id} className="glass rounded-2xl px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-lg">🎟</span>
              <div>
                <div className="text-sm font-bold text-slate-800 font-mono">{g.code}</div>
                <div className="text-xs text-slate-400">{fmtDate(g.erstellt_am)}</div>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <div className="text-right">
                <div className="text-sm font-bold text-slate-800">{fmtEur(g.betrag_rest||0)}</div>
                <div className="text-xs text-slate-400">von {fmtEur(g.betrag_original)}</div>
              </div>
              <span className="pill text-xs" style={g.aktiv?{background:'#d1fae5',color:'#065f46'}:{background:'#fee2e2',color:'#991b1b'}}>
                {g.aktiv?'Aktiv':'Inaktiv'}
              </span>
              {g.aktiv && (
                <button onClick={()=>revoke(g)} className="text-slate-400 hover:text-red-500 transition-all">
                  <SI p={IC.x} size={14}/>
                </button>
              )}
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title="Gutschein erstellen" onClose={()=>setModal(false)}>
          <div className="flex flex-col gap-3">
            <div className="flex items-center gap-2">
              <button onClick={()=>setForm(p=>({...p,custom:!p.custom}))}
                className={`toggle ${form.custom?'on':''}`}
                style={{background:form.custom?'#6366f1':'#cbd5e1',flexShrink:0}}/>
              <span className="text-sm text-slate-600">Eigener Code</span>
            </div>
            {form.custom && (
              <input className={INP} value={form.code} onChange={e=>setForm(p=>({...p,code:e.target.value.toUpperCase()}))} placeholder="z.B. SUMMER2024"/>
            )}
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Betrag (€)</label>
              <input type="number" className={INP} value={form.betrag} onChange={e=>setForm(p=>({...p,betrag:e.target.value}))} step="0.50" min="0" placeholder="10.00"/>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setModal(false)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={save} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>Erstellen</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── WertkartenView ───────────────────────────────────────────────────────────
const WertkartenView = ({ cafe, toast, profile }) => {
  const [modal, setModal] = useState(null);
  const [topupId, setTopupId] = useState(null);
  const [form, setForm] = useState({code:'',guthaben:''});
  const [topupBetrag, setTopupBetrag] = useState('');

  const genCode = () => 'W' + Math.random().toString(36).slice(2,8).toUpperCase();

  const save = async () => {
    const code = form.code.trim().toUpperCase() || genCode();
    if (!form.guthaben) { toast('Guthaben erforderlich','error'); return; }
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    const exists = (data.wertkarten||[]).find(w=>w.code.toUpperCase()===code);
    if (exists) { toast('Code bereits vorhanden','error'); return; }
    const w = {id:genId(),code,guthaben:parseFloat(form.guthaben),erstellt_am:new Date().toISOString()};
    await ref.set({...data,wertkarten:[...(data.wertkarten||[]),w]});
    toast('Wertkarte erstellt');
    setModal(null);
    setForm({code:'',guthaben:''});
  };

  const topup = async () => {
    const b = parseFloat(topupBetrag);
    if (!b||b<=0) { toast('Betrag eingeben','error'); return; }
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    await ref.set({...data,wertkarten:(data.wertkarten||[]).map(w=>w.id===topupId?{...w,guthaben:(w.guthaben||0)+b}:w)});
    toast(`+${fmtEur(b)} aufgeladen`);
    setTopupId(null);
    setTopupBetrag('');
  };

  const sorted = [...(cafe.wertkarten||[])].sort((a,b)=>new Date(b.erstellt_am)-new Date(a.erstellt_am));

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs text-slate-500">{sorted.length} Wertkarten</div>
        <button onClick={()=>setModal(true)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>
          <SI p={IC.plus} size={14}/>Wertkarte
        </button>
      </div>
      {sorted.length===0 && <div className="text-center py-12 text-slate-400 text-sm">Keine Wertkarten</div>}
      <div className="flex flex-col gap-2">
        {sorted.map(w=>(
          <div key={w.id} className="glass rounded-2xl px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-lg">💳</span>
              <div>
                <div className="text-sm font-bold text-slate-800 font-mono">{w.code}</div>
                <div className="text-xs text-slate-400">{fmtDate(w.erstellt_am)}</div>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-sm font-bold text-slate-800">{fmtEur(w.guthaben||0)}</span>
              <button onClick={()=>{setTopupId(w.id);setTopupBetrag('');}} className="px-3 py-1 rounded-lg text-xs font-semibold border border-black/10 hover:bg-black/5 transition-all">
                Aufladen
              </button>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title="Wertkarte erstellen" onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Code (leer = auto-generiert)</label>
              <input className={INP} value={form.code} onChange={e=>setForm(p=>({...p,code:e.target.value.toUpperCase()}))} placeholder="z.B. KARTE001"/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Startguthaben (€)</label>
              <input type="number" className={INP} value={form.guthaben} onChange={e=>setForm(p=>({...p,guthaben:e.target.value}))} step="5" min="0" placeholder="20.00"/>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={save} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>Erstellen</button>
            </div>
          </div>
        </Modal>
      )}

      {topupId && (
        <Modal title="Guthaben aufladen" onClose={()=>setTopupId(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Betrag (€)</label>
              <input type="number" className={INP} value={topupBetrag} onChange={e=>setTopupBetrag(e.target.value)} step="5" min="0" placeholder="10.00" autoFocus/>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setTopupId(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={topup} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#10b981'}}>Aufladen</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── FinanzenView ─────────────────────────────────────────────────────────────
const FinanzenView = ({ cafe }) => {
  const today = new Date().toLocaleDateString('de-DE');

  const allBestellungen = useMemo(() =>
    (cafe.bestellungen||[]).filter(b=>b.status!=='storniert'),
    [cafe.bestellungen]);

  const heuteBestellungen = useMemo(() =>
    allBestellungen.filter(b=>fmtDate(b.erstellt_am)===today),
    [allBestellungen, today]);

  const heuteUmsatz = heuteBestellungen.reduce((s,b)=>s+b.gesamt,0);

  const zahlungsBreakdownHeute = useMemo(() => {
    const map = {};
    heuteBestellungen.forEach(b=>{
      (b.zahlung||[]).forEach(z=>{ map[z.art]=(map[z.art]||0)+z.betrag; });
    });
    return map;
  }, [heuteBestellungen]);

  const schichten = useMemo(() =>
    [...(cafe.schichten||[])].sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,20),
    [cafe.schichten]);

  // Per day chart data (last 7 days)
  const chartData = useMemo(() => {
    const days = [];
    for (let i=6;i>=0;i--) {
      const d = new Date(); d.setDate(d.getDate()-i);
      const label = d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric'});
      const dateStr = d.toLocaleDateString('de-DE');
      const umsatz = allBestellungen.filter(b=>fmtDate(b.erstellt_am)===dateStr).reduce((s,b)=>s+b.gesamt,0);
      days.push({label,umsatz});
    }
    return days;
  }, [allBestellungen]);
  const maxUmsatz = Math.max(...chartData.map(d=>d.umsatz),1);

  return (
    <div className="flex flex-col gap-6">
      {/* Today summary */}
      <div className="grid gap-4" style={{gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))'}}>
        {[
          ['Heute Umsatz', fmtEur(heuteUmsatz), '#10b981'],
          ['Heute Bestellungen', heuteBestellungen.length, '#6366f1'],
          ['Gesamt Umsatz', fmtEur(allBestellungen.reduce((s,b)=>s+b.gesamt,0)), '#0f172a'],
          ['Gesamt Bestellungen', allBestellungen.length, '#f59e0b'],
        ].map(([l,v,c])=>(
          <div key={l} className="glass rounded-2xl p-5 glow">
            <div className="text-xs text-slate-500 mb-1">{l}</div>
            <div className="text-2xl font-bold" style={{color:c}}>{v}</div>
          </div>
        ))}
      </div>

      {/* Heute Zahlungsarten */}
      {Object.keys(zahlungsBreakdownHeute).length > 0 && (
        <div className="glass rounded-2xl p-5 glow">
          <h3 className="text-sm font-bold text-slate-700 mb-3">Heute — Zahlungsarten</h3>
          <div className="flex flex-col gap-2">
            {Object.entries(zahlungsBreakdownHeute).map(([art,betrag])=>(
              <div key={art} className="flex items-center gap-3">
                <span className="text-xs text-slate-500 w-20">{art}</span>
                <div className="flex-1 rounded-full overflow-hidden" style={{height:'8px',background:'#f1f5f9'}}>
                  <div style={{height:'100%',width:`${(betrag/heuteUmsatz*100).toFixed(1)}%`,background:'#6366f1',borderRadius:'9px',transition:'width .3s'}}/>
                </div>
                <span className="text-xs font-semibold text-slate-700 w-16 text-right">{fmtEur(betrag)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 7-day chart */}
      <div className="glass rounded-2xl p-5 glow">
        <h3 className="text-sm font-bold text-slate-700 mb-4">Umsatz letzte 7 Tage</h3>
        <div className="flex items-end gap-2" style={{height:'120px'}}>
          {chartData.map((d,i)=>(
            <div key={i} className="flex-1 flex flex-col items-center gap-1">
              <span className="text-xs text-slate-500">{d.umsatz>0?fmtEur(d.umsatz):''}</span>
              <div style={{width:'100%',height:`${Math.max(4,(d.umsatz/maxUmsatz*80))}px`,background:'#6366f1',borderRadius:'6px 6px 0 0',opacity:d.umsatz===0?0.15:1,transition:'height .3s'}}/>
              <span className="text-xs text-slate-400" style={{fontSize:'9px'}}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Schichten */}
      <div className="glass rounded-2xl p-5 glow">
        <h3 className="text-sm font-bold text-slate-700 mb-3">Schichten</h3>
        {schichten.length===0 && <div className="text-xs text-slate-400">Keine Schichten</div>}
        <div className="flex flex-col gap-2">
          {schichten.map(s=>(
            <div key={s.id} className="flex items-center justify-between py-2" style={{borderBottom:'1px solid rgba(0,0,0,0.05)'}}>
              <div>
                <div className="text-sm font-semibold text-slate-700">{s.kassiererName}</div>
                <div className="text-xs text-slate-400">{fmtDateTime(s.start)}{s.ende?` – ${fmtTime(s.ende)}`:' (aktiv)'}</div>
              </div>
              <div className="text-right">
                <div className="text-sm font-bold text-slate-800">{fmtEur(s.umsatz||0)}</div>
                <div className="text-xs text-slate-400">{s.bestellungen_count||0} Bestellungen</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ─── PersonenView ─────────────────────────────────────────────────────────────
const PersonenView = ({ toast, profile }) => {
  const [users, setUsers] = useState([]);
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({name:'',pin:'',role:'kassierer',farbe:'#8b5cf6',areaAccess:'__all__'});
  const [showPin, setShowPin] = useState(false);
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#10b981','#06b6d4'];

  useEffect(() => {
    const unsub = db.collection('cafe-users').onSnapshot(
      snap => setUsers(snap.docs.map(d=>({id:d.id,...d.data()}))),
      () => {}
    );
    return () => unsub();
  }, []);

  const save = async () => {
    if (!form.name.trim()||!form.pin.trim()) { toast('Name und PIN erforderlich','error'); return; }
    const data = {name:form.name.trim(),pin:form.pin.trim(),role:form.role,farbe:form.farbe,areaAccess:form.areaAccess||'__all__'};
    if (modal==='add') {
      await db.collection('cafe-users').add(data);
      toast('Person hinzugefügt');
    } else {
      await db.collection('cafe-users').doc(modal).update(data);
      toast('Person aktualisiert');
    }
    setModal(null);
  };

  const del = async (id) => {
    await db.collection('cafe-users').doc(id).delete();
    toast('Person gelöscht','warn');
  };

  const openAdd = () => { setForm({name:'',pin:'',role:'kassierer',farbe:'#8b5cf6',areaAccess:'__all__'}); setShowPin(false); setModal('add'); };
  const openEdit = u => { setForm({name:u.name,pin:u.pin||'',role:u.role||'kassierer',farbe:u.farbe||'#8b5cf6',areaAccess:u.areaAccess||'__all__'}); setShowPin(false); setModal(u.id); };

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs text-slate-500">{users.length} Personen</div>
        <button onClick={openAdd} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>
          <SI p={IC.plus} size={14}/>Person
        </button>
      </div>
      <div className="flex flex-col gap-2">
        {users.map(u=>(
          <div key={u.id} className="glass rounded-2xl px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <Avatar name={u.name} color={u.farbe||'#8b5cf6'} size={36}/>
              <div>
                <div className="text-sm font-bold text-slate-800">{u.name}</div>
                <span className="pill text-xs" style={{background:'#f1f5f9',color:'#475569'}}>{ROLE_LABELS[u.role]||u.role}</span>
                {u.areaAccess && u.areaAccess !== '__all__' && Array.isArray(u.areaAccess) && (
                  <div className="flex flex-wrap gap-1 mt-1">
                    {u.areaAccess.map(aid => {
                      const pp = CAFE_PROFILES.find(p=>p.id===aid);
                      return pp ? (
                        <span key={aid} className="pill text-xs" style={{background:(pp.color||'#8b5cf6')+'22',color:pp.color||'#8b5cf6'}}>{pp.label}</span>
                      ) : null;
                    })}
                  </div>
                )}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={()=>openEdit(u)} className="text-slate-400 hover:text-slate-700 transition-all"><SI p={IC.edit} size={15}/></button>
              <button onClick={()=>del(u.id)} className="text-slate-400 hover:text-red-500 transition-all"><SI p={IC.trash} size={15}/></button>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title={modal==='add'?'Person hinzufügen':'Person bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Max Mustermann" autoFocus/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">PIN</label>
              <div className="relative">
                <input type={showPin?'text':'password'} className={INP} value={form.pin} onChange={e=>set('pin',e.target.value)} placeholder="PIN setzen"/>
                <button type="button" onClick={()=>setShowPin(v=>!v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                  <SI p={showPin?IC.eyeOff:IC.eye} size={14}/>
                </button>
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Rolle</label>
              <select className={INP} value={form.role} onChange={e=>set('role',e.target.value)}>
                {ROLE_OPTIONS.map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Farbe</label>
              <div className="flex flex-wrap gap-2">
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>set('farbe',c)}
                    className="w-7 h-7 rounded-full transition-all hover:scale-110"
                    style={{background:c,outline:form.farbe===c?`2px solid ${c}`:'2px solid transparent',outlineOffset:'2px'}}/>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Bereichs-Zugriff</label>
              <div className="flex flex-col gap-1.5">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={form.areaAccess==='__all__' || !form.areaAccess}
                    onChange={e=>setForm(f=>({...f, areaAccess: e.target.checked ? '__all__' : []}))}
                    className="rounded"/>
                  <span className="text-sm text-slate-700">Alle Bereiche</span>
                </label>
                {form.areaAccess !== '__all__' && form.areaAccess && CAFE_PROFILES.map(pp => (
                  <label key={pp.id} className="flex items-center gap-2 cursor-pointer ml-4">
                    <input type="checkbox"
                      checked={Array.isArray(form.areaAccess) && form.areaAccess.includes(pp.id)}
                      onChange={e=>setForm(f=>({...f, areaAccess: e.target.checked
                        ? [...(Array.isArray(f.areaAccess)?f.areaAccess:[]), pp.id]
                        : (Array.isArray(f.areaAccess)?f.areaAccess:[]).filter(x=>x!==pp.id)
                      }))}/>
                    <span className="text-sm text-slate-700">{pp.label}</span>
                  </label>
                ))}
              </div>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={save} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── EinstellungenView ────────────────────────────────────────────────────────
const EinstellungenView = ({ cafe, toast, user, profile }) => {
  const einst = cafe.einstellungen || {};
  const [minKarte, setMinKarte] = useState(einst.min_karten_betrag||10);
  const [newPin, setNewPin]     = useState('');
  const [showPin, setShowPin]   = useState(false);
  const [saving, setSaving]     = useState(false);

  const saveEinst = async () => {
    setSaving(true);
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : DEFAULT_CAFE();
    await ref.set({...data,einstellungen:{...data.einstellungen,min_karten_betrag:parseFloat(minKarte)||10}});
    toast('Einstellungen gespeichert');
    setSaving(false);
  };

  const exportData = async () => {
    const ref = db.collection(profile||'k21-cafe').doc('data');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : {};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a'); a.href=url; a.download=`k21-cafe-export-${Date.now()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast('Export erfolgreich');
  };

  return (
    <div className="max-w-md flex flex-col gap-4">
      <div className="glass rounded-2xl p-5 glow">
        <h3 className="text-sm font-bold text-slate-700 mb-4">Zahlungseinstellungen</h3>
        <label className="text-xs font-semibold text-slate-600 mb-1 block">Mindestbetrag Kartenzahlung (€)</label>
        <input type="number" className={INP + ' mb-3'} value={minKarte} onChange={e=>setMinKarte(e.target.value)} step="1" min="0"/>
        <button onClick={saveEinst} disabled={saving} className="w-full py-2.5 rounded-xl text-sm font-semibold text-white disabled:opacity-40" style={{background:'#0f172a'}}>
          Speichern
        </button>
      </div>

      <div className="glass rounded-2xl p-5 glow">
        <h3 className="text-sm font-bold text-slate-700 mb-4">Daten exportieren</h3>
        <button onClick={exportData} className="w-full py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 border border-black/10 hover:bg-black/5 transition-all">
          <SI p={IC.download} size={14}/>JSON Export
        </button>
      </div>
    </div>
  );
};

  { id:'kasse',        label:'Kasse',       icon:IC.cart,    perm:'kasse' },
  { id:'bestellungen', label:'Bestellungen',icon:IC.orders,  perm:'bestellungen' },
  { id:'schicht',      label:'Schicht',     icon:IC.shift,   perm:'schicht' },

  { id:'gutscheine',   label:'Gutscheine',  icon:IC.voucher, perm:'gutscheine' },
  { id:'wertkarten',   label:'Wertkarten',  icon:IC.card,    perm:'wertkarten' },
  { id:'finanzen',     label:'Finanzen',    icon:IC.chart,   perm:'finanzen' },
  { id:'einstellungen',label:'Einstellungen',icon:IC.cog,   perm:'einstellungen' },
  { id:'personen',     label:'Personen',    icon:IC.users,   perm:'personen' },
];

// ─── App ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [user, setUser]           = useState(null);
  const [cafe, setCafe]           = useState(null);
  const [syncState, setSyncState] = useState('connecting');
  const [page, setPage]           = useState('kasse');
  const [activeSchicht, setActiveSchicht] = useState(null);
  const [toasts, toast]           = useToast();
  const [profiles, setProfiles]   = useState(DEFAULT_CAFE_PROFILES);
  const [profile, setProfile]     = useState(DEFAULT_CAFE_PROFILES[0].id);
  const [headerEdit, setHeaderEdit]           = useState(null);
  const [headerEditName, setHeaderEditName]   = useState('');
  const [headerEditColor, setHeaderEditColor] = useState('#8b5cf6');

  // Load profiles on mount
  useEffect(() => {
    db.collection('config').doc('cafe-profiles').get().then(snap => {
      const d = snap.data()?.data;
      if (d && d.length) { setProfiles(d); CAFE_PROFILES = d; setProfile(d[0].id); }
    }).catch(()=>{});
  }, []);

  // Firestore listener
  useEffect(() => {
    if (!user) return;
    setSyncState('connecting');
    const ref = db.collection(profile).doc('data');
    const unsub = ref.onSnapshot(
      snap => {
        const data = snap.exists ? snap.data() : DEFAULT_CAFE();
        setCafe({...DEFAULT_CAFE(), ...data});
        // Find active schicht for this user
        const aktiv = (data.schichten||[]).find(s=>!s.ende && (user.role==='owner'||s.kassiererId===user.id));
        setActiveSchicht(aktiv||null);
        setSyncState('synced');
      },
      () => setSyncState('error')
    );
    return () => unsub();
  }, [user, profile]);

  // On login, jump to appropriate default page
  useEffect(() => {
    if (!user) return;
    const firstAllowed = NAV_ITEMS.find(n=>can(user.role,n.perm));
    if (firstAllowed) setPage(firstAllowed.id);
  }, [user]);

  const saveHeaderEdit = () => {
    if (!headerEditName.trim()) return;
    let np;
    if (headerEdit === 'new') {
      const id = headerEditName.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Math.random().toString(36).slice(2,5);
      np = [...profiles, {id, label:headerEditName.trim(), color:headerEditColor, grad:`linear-gradient(135deg,${headerEditColor},#334155)`}];
    } else {
      np = profiles.map(p => p.id===headerEdit ? {...p, label:headerEditName.trim(), color:headerEditColor, grad:`linear-gradient(135deg,${headerEditColor},#334155)`} : p);
    }
    setProfiles(np); CAFE_PROFILES = np;
    db.collection('config').doc('cafe-profiles').set({data: np}).catch(()=>{});
    setHeaderEdit(null);
    toast(headerEdit==='new' ? 'Bereich erstellt ✓' : 'Bereich umbenannt ✓');
  };

  if (!user) return <LoginView onLogin={(u, pid) => { setUser(u); if (pid) setProfile(pid); }} profiles={profiles}/>;

  const visibleNav = NAV_ITEMS.filter(n=>can(user.role,n.perm));

  // Make sure current page is accessible
  const activePage = can(user.role, NAV_ITEMS.find(n=>n.id===page)?.perm) ? page : (visibleNav[0]?.id||'bestellungen');

  const renderPage = () => {
    if (!cafe) return <div className="flex items-center justify-center h-64 text-slate-400 text-sm">Verbinde mit Datenbank…</div>;
    if (activePage==='kasse')         return <KasseView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} profile={profile}/>;
    if (activePage==='bestellungen')  return <BestellungenView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} profile={profile}/>;
    if (activePage==='schicht')       return <SchichtView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} setActiveSchicht={setActiveSchicht} profile={profile}/>;
    if (activePage==='produkte')      return <ProdukteView cafe={cafe} user={user} toast={toast} profile={profile}/>;
    if (activePage==='gutscheine')    return <GutscheineView cafe={cafe} toast={toast} profile={profile}/>;
    if (activePage==='wertkarten')    return <WertkartenView cafe={cafe} toast={toast} profile={profile}/>;
    if (activePage==='finanzen')      return <FinanzenView cafe={cafe}/>;
    if (activePage==='einstellungen') return <EinstellungenView cafe={cafe} toast={toast} user={user} profile={profile}/>;
    if (activePage==='personen')      return <PersonenView toast={toast} profile={profile}/>;
    return null;
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <header style={{background:'#000000',position:'sticky',top:0,zIndex:100}}>
        {/* Row 1: Logo + Area pills + User info */}
        <div style={{maxWidth:'1400px',margin:'0 auto',padding:'0 20px',height:'56px',display:'flex',alignItems:'center',gap:'16px'}}>
          {/* Logo */}
          <div className="flex items-center gap-2 flex-shrink-0">
            <div className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:'rgba(255,255,255,0.1)'}}>
              <span>☕</span>
            </div>
            <span className="text-white font-bold text-sm hidden sm:block">K21 Café</span>
          </div>

          {/* Area pills – centered */}
          <div className="flex gap-1 mx-auto items-center flex-wrap justify-center">
            {profiles.map(pp => (
              <div key={pp.id} className="relative flex items-center gap-0.5">
                <button onClick={()=>setProfile(pp.id)}
                  className="px-3 py-1.5 text-xs font-bold transition-all"
                  style={{
                    borderRadius:30,
                    background: profile===pp.id ? '#ffffff' : 'transparent',
                    color: profile===pp.id ? '#000000' : 'rgba(255,255,255,0.4)',
                    border: profile===pp.id ? '1px solid transparent' : '1px solid rgba(255,255,255,0.12)',
                  }}>
                  {pp.label}
                </button>
                {user?.role==='owner' && (
                  <button onClick={()=>{setHeaderEdit(pp.id);setHeaderEditName(pp.label);setHeaderEditColor(pp.color||'#8b5cf6');}}
                    title="Bereich bearbeiten"
                    className="w-5 h-5 flex items-center justify-center rounded-full opacity-40 hover:opacity-100 transition-all"
                    style={{color:'rgba(255,255,255,0.7)'}}>
                    <SI p={IC.edit} size={12}/>
                  </button>
                )}
              </div>
            ))}
            {user?.role==='owner' && (
              <button onClick={()=>{setHeaderEdit('new');setHeaderEditName('');setHeaderEditColor('#8b5cf6');}}
                title="Neuer Bereich"
                className="w-7 h-7 flex items-center justify-center rounded-full opacity-50 hover:opacity-100 transition-all"
                style={{color:'rgba(255,255,255,0.7)',border:'1px dashed rgba(255,255,255,0.3)'}}>
                <SI p={IC.plus} size={13}/>
              </button>
            )}
          </div>

          {/* Right side: sync + schicht badge + avatar + logout */}
          <div className="flex items-center gap-3 flex-shrink-0">
            <SyncDot state={syncState}/>
            {activeSchicht && (
              <span className="pill text-xs hidden sm:inline-flex" style={{background:'rgba(16,185,129,0.2)',color:'#34d399'}}>
                ● Schicht aktiv
              </span>
            )}
            <div className="flex items-center gap-2">
              <Avatar name={user.name} color={user.farbe||'#8b5cf6'} size={28}/>
              <span className="text-white text-xs font-semibold hidden md:block">{user.name}</span>
            </div>
            <button onClick={()=>setUser(null)} className="text-white/40 hover:text-white transition-all" title="Abmelden">
              <SI p={IC.logout} size={15}/>
            </button>
          </div>
        </div>

        {/* Row 2: Nav tabs */}
        <div style={{borderTop:'1px solid rgba(255,255,255,0.06)'}}>
          <div style={{maxWidth:'1400px',margin:'0 auto',padding:'0 16px',height:'44px',display:'flex',alignItems:'center',justifyContent:'center',gap:'2px',overflowX:'auto',scrollbarWidth:'none'}}>
            {visibleNav.map(n=>(
              <button key={n.id} onClick={()=>setPage(n.id)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold flex-shrink-0 transition-all"
                style={{
                  background:activePage===n.id?'rgba(255,255,255,0.15)':'transparent',
                  color:activePage===n.id?'#fff':'rgba(255,255,255,0.45)'
                }}>
                <SI p={n.icon} size={13}/>{n.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      {/* Main content */}
      <main style={{flex:1,maxWidth:'1400px',margin:'0 auto',padding:'20px',width:'100%'}}>
        <div className="up">
          {renderPage()}
        </div>
      </main>

      {headerEdit && (
        <Modal title={headerEdit==='new'?'Neuer Bereich':'Bereich bearbeiten'} onClose={()=>setHeaderEdit(null)}>
          <div className="space-y-4">
            <div>
              <label className="text-slate-400 text-xs block mb-1.5">Name</label>
              <input autoFocus value={headerEditName} onChange={e=>setHeaderEditName(e.target.value)}
                placeholder="Bereich-Name…" className={INP}
                onKeyDown={e=>e.key==='Enter'&&saveHeaderEdit()}/>
            </div>
            <div>
              <label className="text-slate-400 text-xs block mb-1.5">Farbe</label>
              <ColorPicker value={headerEditColor} onChange={setHeaderEditColor}/>
            </div>
            <div className="flex gap-2 pt-1">
              <button onClick={saveHeaderEdit} className="flex-1 bg-slate-900 hover:bg-slate-700 text-white font-bold py-2.5 text-sm rounded-xl transition-all">Speichern</button>
              <button onClick={()=>setHeaderEdit(null)} className="px-4 py-2.5 bg-black/5 text-slate-400 text-sm rounded-xl transition-all">Abbrechen</button>
            </div>
            {headerEdit!=='new' && profiles.length > 1 && (
              <button onClick={()=>{
                if (!window.confirm('Bereich wirklich löschen?')) return;
                const np = profiles.filter(p=>p.id!==headerEdit);
                setProfiles(np); CAFE_PROFILES=np;
                db.collection('config').doc('cafe-profiles').set({data:np}).catch(()=>{});
                if (profile===headerEdit) setProfile(np[0].id);
                setHeaderEdit(null);
                toast('Bereich gelöscht ✓');
              }} className="w-full py-2 text-red-400 hover:text-red-600 text-xs font-medium transition-all text-center">
                Bereich löschen
              </button>
            )}
          </div>
        </Modal>
      )}

      <ToastContainer toasts={toasts}/>
    </div>
  );
};

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>

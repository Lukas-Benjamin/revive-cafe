                      <div className="flex-1 rounded-full overflow-hidden" style={{height:'7px',background:'#f1f5f9'}}>
                        <div style={{height:'100%',width:`${periodeUmsatz>0?(betrag/periodeUmsatz*100).toFixed(1):0}%`,background:'#6366f1',borderRadius:'9px',transition:'width .4s'}}/>
                      </div>
                      <span className="text-xs font-semibold text-slate-700 text-right" style={{width:'60px'}}>{fmtEur(betrag)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {katBreakdown.length > 0 && (
              <div className="glass rounded-2xl p-5 glow">
                <h3 className="text-sm font-bold text-slate-700 mb-3">Kategorien</h3>
                <div className="flex flex-col gap-2.5">
                  {katBreakdown.map(k=>(
                    <div key={k.name} className="flex items-center gap-2">
                      <span className="text-xs text-slate-500 truncate" style={{width:'60px'}}>{k.name}</span>
                      <div className="flex-1 rounded-full overflow-hidden" style={{height:'7px',background:'#f1f5f9'}}>
                        <div style={{height:'100%',width:`${periodeUmsatz>0?(k.betrag/periodeUmsatz*100).toFixed(1):0}%`,background:k.color,borderRadius:'9px',transition:'width .4s'}}/>
                      </div>
                      <span className="text-xs font-semibold text-slate-700 text-right" style={{width:'60px'}}>{fmtEur(k.betrag)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── VERGLEICH ── */}
      {tab==='vergleich' && (
        <div className="space-y-4">
          {/* Mode toggle */}
          <div className="glass rounded-2xl p-4">
            <div className="flex gap-2">
              {[{id:'zeitraum',label:'Zeiträume vergleichen'},{id:'produkt',label:'Produkte vergleichen'}].map(m=>(
                <button key={m.id} onClick={()=>setCmpMode(m.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${cmpMode===m.id?'bg-black text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                  {m.label}
                </button>
              ))}
            </div>
          </div>

          {cmpMode==='zeitraum' && (() => {
            const cmpPeriodLabels = {woche:'Diese Woche',monat:'Dieser Monat',jahr:'Dieses Jahr',custom:'Benutzerdefiniert'};
            const PeriodPicker = ({val, setVal, from, setFrom, to, setTo, label}) => (
              <div className="flex-1 min-w-0">
                <div className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">{label}</div>
                <div className="flex flex-wrap gap-1 mb-2">
                  {Object.entries(cmpPeriodLabels).map(([v,l])=>(
                    <button key={v} onClick={()=>setVal(v)}
                      className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${val===v?'bg-black text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                      {l}
                    </button>
                  ))}
                </div>
                {val==='custom' && (
                  <div className="flex gap-2 mt-1">
                    <input type="date" value={from} onChange={e=>setFrom(e.target.value)}
                      className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-black"/>
                    <input type="date" value={to} onChange={e=>setTo(e.target.value)}
                      className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-black"/>
                  </div>
                )}
              </div>
            );
            const diff = (a,b,fmt) => {
              if (a===0&&b===0) return null;
              const d = b-a; const pct = a===0?null:Math.round(d/a*100);
              const col = d>=0?'text-emerald-600':'text-red-500';
              return <span className={`text-xs font-semibold ${col}`}>{d>=0?'+':''}{fmt(d)}{pct!==null?` (${pct>0?'+':''}${pct}%)`:''}</span>;
            };
            const fmtE = v => `${v>=0?'':'−'}${Math.abs(v).toFixed(2)} €`;
            const fmtN = v => `${v>=0?'+':'-'}${Math.abs(v)}`;
            return (
              <div className="space-y-4">
                {/* Period pickers */}
                <div className="glass rounded-2xl p-5">
                  <div className="flex gap-6 flex-wrap">
                    <PeriodPicker val={cmpA} setVal={setCmpA} from={cmpFromA} setFrom={setCmpFromA} to={cmpToA} setTo={setCmpToA} label="Zeitraum A"/>
                    <div className="flex items-center self-start mt-7 text-slate-400 font-bold text-lg">vs</div>
                    <PeriodPicker val={cmpB} setVal={setCmpB} from={cmpFromB} setFrom={setCmpFromB} to={cmpToB} setTo={setCmpToB} label="Zeitraum B"/>
                  </div>
                </div>

                {/* KPI comparison */}
                <div className="grid grid-cols-3 gap-3">
                  {[
                    {label:'Umsatz', va:statsA.umsatz, vb:statsB.umsatz, fmt:v=>`${v.toFixed(2)} €`},
                    {label:'Bestellungen', va:statsA.count, vb:statsB.count, fmt:v=>`${v}`},
                    {label:'Ø Bestellung', va:statsA.avg, vb:statsB.avg, fmt:v=>`${v.toFixed(2)} €`},
                  ].map(({label,va,vb,fmt})=>(
                    <div key={label} className="glass rounded-2xl p-4">
                      <div className="text-xs text-slate-500 mb-2 font-semibold uppercase tracking-wide">{label}</div>
                      <div className="flex justify-between items-end gap-2">
                        <div>
                          <div className="text-xs text-slate-400 mb-0.5">A</div>
                          <div className="text-sm font-bold text-slate-800">{fmt(va)}</div>
                        </div>
                        <div className="text-right">
                          <div className="text-xs text-slate-400 mb-0.5">B</div>
                          <div className="text-sm font-bold text-slate-800">{fmt(vb)}</div>
                        </div>
                      </div>
                      <div className="mt-2 pt-2 border-t border-slate-100">
                        {diff(va,vb,label==='Bestellungen'?fmtN:fmtE) || <span className="text-xs text-slate-400">Keine Daten</span>}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Top products comparison */}
                <div className="glass rounded-2xl p-5">
                  <h3 className="text-sm font-bold text-slate-700 mb-4">Top Produkte</h3>
                  {statsA.topP.length===0&&statsB.topP.length===0
                    ? <div className="text-xs text-slate-400 text-center py-4">Keine Daten</div>
                    : (() => {
                        const allN = [...new Set([...statsA.topP.map(p=>p.name),...statsB.topP.map(p=>p.name)])].slice(0,8);
                        const mapA = Object.fromEntries(statsA.topP.map(p=>[p.name,p]));
                        const mapB = Object.fromEntries(statsB.topP.map(p=>[p.name,p]));
                        const maxV = Math.max(...allN.flatMap(n=>[mapA[n]?.betrag||0,mapB[n]?.betrag||0]),1);
                        return (
                          <div className="space-y-3">
                            {allN.map(name=>{
                              const a = mapA[name]; const b = mapB[name];
                              const pctA = ((a?.betrag||0)/maxV*100).toFixed(1);
                              const pctB = ((b?.betrag||0)/maxV*100).toFixed(1);
                              return (
                                <div key={name}>
                                  <div className="flex justify-between text-xs text-slate-600 mb-1">
                                    <span className="font-medium truncate max-w-[140px]">{name}</span>
                                    <div className="flex gap-3 text-slate-400">
                                      <span>A: {a?`${a.betrag.toFixed(2)} €`:'-'}</span>
                                      <span>B: {b?`${b.betrag.toFixed(2)} €`:'-'}</span>
                                    </div>
                                  </div>
                                  <div className="flex flex-col gap-0.5">
                                    <div className="h-2 rounded-full bg-black" style={{width:`${pctA}%`,minWidth:'2px'}}/>
                                    <div className="h-2 rounded-full bg-slate-400" style={{width:`${pctB}%`,minWidth:'2px'}}/>
                                  </div>
                                </div>
                              );
                            })}
                            <div className="flex gap-4 mt-2 text-xs text-slate-400">
                              <span className="flex items-center gap-1"><span className="inline-block w-3 h-2 rounded-sm bg-black"/>{cmpPeriodLabels[cmpA]}</span>
                              <span className="flex items-center gap-1"><span className="inline-block w-3 h-2 rounded-sm bg-slate-400"/>{cmpPeriodLabels[cmpB]}</span>
                            </div>
                          </div>
                        );
                      })()
                  }
                </div>

                {/* Category comparison */}
                {(statsA.topK.length>0||statsB.topK.length>0) && (
                  <div className="glass rounded-2xl p-5">
                    <h3 className="text-sm font-bold text-slate-700 mb-4">Kategorien</h3>
                    {(() => {
                      const allK = [...new Set([...statsA.topK.map(k=>k.name),...statsB.topK.map(k=>k.name)])];
                      const mapA = Object.fromEntries(statsA.topK.map(k=>[k.name,k]));
                      const mapB = Object.fromEntries(statsB.topK.map(k=>[k.name,k]));
                      const maxV = Math.max(...allK.flatMap(n=>[mapA[n]?.betrag||0,mapB[n]?.betrag||0]),1);
                      return (
                        <div className="space-y-3">
                          {allK.map(name=>{
                            const a = mapA[name]; const b = mapB[name];
                            const pctA = ((a?.betrag||0)/maxV*100).toFixed(1);
                            const pctB = ((b?.betrag||0)/maxV*100).toFixed(1);
                            return (
                              <div key={name}>
                                <div className="flex justify-between text-xs text-slate-600 mb-1">
                                  <span className="font-medium">{name}</span>
                                  <div className="flex gap-3 text-slate-400">
                                    <span>A: {a?`${a.betrag.toFixed(2)} €`:'-'}</span>
                                    <span>B: {b?`${b.betrag.toFixed(2)} €`:'-'}</span>
                                  </div>
                                </div>
                                <div className="flex flex-col gap-0.5">
                                  <div className="h-2 rounded-full bg-black" style={{width:`${pctA}%`,minWidth:'2px'}}/>
                                  <div className="h-2 rounded-full bg-slate-400" style={{width:`${pctB}%`,minWidth:'2px'}}/>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })()}
                  </div>
                )}
              </div>
            );
          })()}

          {cmpMode==='produkt' && (
            <div className="space-y-4">
              {/* Product selector */}
              <div className="glass rounded-2xl p-5">
                <h3 className="text-sm font-bold text-slate-700 mb-3">Produkte auswählen</h3>
                <div className="flex flex-wrap gap-2">
                  {allProdukteNamen.map(name=>{
                    const sel = selProdukte.includes(name);
                    return (
                      <button key={name} onClick={()=>setSelProdukte(sel?selProdukte.filter(p=>p!==name):[...selProdukte,name])}
                        className={`px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${sel?'bg-black text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                        {name}
                      </button>
                    );
                  })}
                  {allProdukteNamen.length===0 && <div className="text-xs text-slate-400">Keine Produkte im Zeitraum</div>}
                </div>
                {selProdukte.length>0 && (
                  <button onClick={()=>setSelProdukte([])} className="mt-3 text-xs text-slate-400 hover:text-slate-600">Auswahl leeren</button>
                )}
              </div>

              {/* Bar chart */}
              {prodVglData.length>0 && (
                <div className="glass rounded-2xl p-5">
                  <h3 className="text-sm font-bold text-slate-700 mb-4">Umsatz im Zeitraum — {periodeLabels[periode]}</h3>
                  <div className="space-y-4">
                    {prodVglData.map(d=>(
                      <div key={d.name}>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="font-medium text-slate-700 truncate max-w-[180px]">{d.name}</span>
                          <span className="text-slate-500">{d.betrag.toFixed(2)} € · {d.count}×</span>
                        </div>
                        <div className="h-4 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full bg-black rounded-full transition-all" style={{width:`${(d.betrag/maxProdVgl*100).toFixed(1)}%`,minWidth:d.betrag>0?'4px':'0'}}/>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {selProdukte.length>0 && prodVglData.length===0 && (
                <div className="glass rounded-2xl p-8 text-center text-xs text-slate-400">Keine Daten für den gewählten Zeitraum</div>
              )}
              {selProdukte.length===0 && (
                <div className="glass rounded-2xl p-8 text-center text-xs text-slate-400">Produkte oben auswählen um Vergleich zu starten</div>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── PRODUKTE ── */}
      {tab==='produkte' && (
        <div className="glass rounded-2xl p-5 glow">
          <h3 className="text-sm font-bold text-slate-700 mb-4">Top Produkte — {periodeLabels[periode]}</h3>
          {topProdukte.length===0 && <div className="text-xs text-slate-400 text-center py-8">Keine Daten im Zeitraum</div>}
          <div className="flex flex-col">
            {topProdukte.map((p,i)=>{
              const maxB=topProdukte[0]?.betrag||1;
              return (
                <div key={p.name} className="flex items-center gap-3 py-2.5" style={{borderBottom:'1px solid rgba(0,0,0,0.05)'}}>
                  <span className="text-xs font-bold text-slate-400 w-5 text-center">{i+1}</span>
                  <span className="text-base">{p.emoji}</span>
                  <div style={{flex:1}}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-sm font-semibold text-slate-800">{p.name}</span>
                      <span className="text-sm font-bold text-slate-900">{fmtEur(p.betrag)}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="flex-1 rounded-full overflow-hidden" style={{height:'5px',background:'#f1f5f9'}}>
                        <div style={{height:'100%',width:`${(p.betrag/maxB*100).toFixed(1)}%`,background:'#6366f1',borderRadius:'9px'}}/>
                      </div>
                      <span className="text-xs text-slate-400">{p.count}×</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── SCHICHTEN ── */}
      {tab==='schichten' && (
        <div className="flex flex-col gap-4">
          {/* Schicht-KPIs */}
          <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))'}}>
            {[
              {label:'Schichten gesamt', val:periodeSchichten.length, col:'#10b981'},
              {label:'Ø Umsatz/Schicht', val:periodeSchichten.length?fmtEur(periodeSchichten.reduce((s,x)=>s+(x.umsatz||0),0)/periodeSchichten.length):'—', col:'#6366f1'},
              {label:'Beste Schicht',    val:periodeSchichten.length?fmtEur(Math.max(...periodeSchichten.map(x=>x.umsatz||0))):'—', col:'#f59e0b'},
              {label:'Ø Dauer',          val: (()=>{ const done=periodeSchichten.filter(s=>s.ende); if(!done.length) return '—'; const avg=done.reduce((s,x)=>s+(new Date(x.ende)-new Date(x.start)),0)/done.length; const h=Math.floor(avg/3600000); const m=Math.floor((avg%3600000)/60000); return `${h}h ${m}m`; })(), col:'#06b6d4'},
            ].map(({label,val,col})=>(
              <div key={label} className="glass rounded-2xl p-4 glow" style={{borderTop:`3px solid ${col}`}}>
                <div className="text-xs text-slate-400 mb-1">{label}</div>
                <div className="text-xl font-bold" style={{color:col}}>{val}</div>
              </div>
            ))}
          </div>
          <div className="glass rounded-2xl p-5 glow">
            <h3 className="text-sm font-bold text-slate-700 mb-3">Schichten — {periodeLabels[periode]}</h3>
            {periodeSchichten.length===0 && <div className="text-xs text-slate-400 text-center py-8">Keine Schichten im Zeitraum</div>}
            <div className="flex flex-col">
              {periodeSchichten.slice(0,30).map(s=>(
                <div key={s.id} className="flex items-center justify-between py-3" style={{borderBottom:'1px solid rgba(0,0,0,0.05)'}}>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-semibold text-slate-700">{s.kassiererName}</span>
                      {!s.ende && <span className="pill text-xs" style={{background:'#d1fae5',color:'#065f46'}}>Aktiv</span>}
                      {gesamt && s._area && <span className="pill text-xs" style={{background:'#f1f5f9',color:'#475569'}}>{s._area}</span>}
                    </div>
                    <div className="text-xs text-slate-400 mt-0.5">
                      {fmtDateTime(s.start)}{s.ende ? ` – ${fmtTime(s.ende)}` : ''}
                      {s.kassenstart!=null && ` · Start: ${fmtEur(s.kassenstart||0)}`}
                      {s.kassenende!=null && s.ende && ` · Ende: ${fmtEur(s.kassenende||0)}`}
                    </div>
                  </div>
                  <div className="text-right">
                    <div className="text-sm font-bold text-slate-800">{fmtEur(s.umsatz||0)}</div>
                    <div className="text-xs text-slate-400">{s.bestellungen_count||0} Best.</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── EINSTELLUNGEN ── */}
      {tab==='einstellungen' && (
        <div className="flex flex-col gap-4 max-w-md">
          <div className="glass rounded-2xl p-5 glow">
            <h3 className="text-sm font-bold text-slate-700 mb-4">Kassen-Einstellungen</h3>
            <label className="text-xs font-semibold text-slate-600 mb-1 block">Mindestbetrag Kartenzahlung (€)</label>
            <div className="flex gap-2 mb-2">
              <input type="number" className={INP} value={minKarte} onChange={e=>setMinKarte(e.target.value)} step="1" min="0"/>
              <button onClick={saveMinKarte}
                className="px-4 py-2.5 rounded-xl text-sm font-semibold text-white flex-shrink-0" style={{background:'#0f172a'}}>
                Speichern
              </button>
            </div>
            <p className="text-xs text-slate-400">Bestellungen unter diesem Betrag können nicht per Karte bezahlt werden.</p>
          </div>
          <div className="glass rounded-2xl p-5 glow">
            <h3 className="text-sm font-bold text-slate-700 mb-3">Daten-Export</h3>
            <p className="text-xs text-slate-400 mb-3">Exportiert alle Daten dieses Bereichs als JSON-Datei.</p>
            <button onClick={exportData} className="w-full py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 border border-black/10 hover:bg-black/5 transition-all">
              <SI p={IC.download} size={14}/>JSON Export — {profile}
            </button>
          </div>
        </div>
      )}

    </div>
  );
};

// ─── PersonenView ─────────────────────────────────────────────────────────────
const PersonenView = ({ toast, profile }) => {
  const [users, setUsers] = useState([]);
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({name:'',pin:'',role:'kassierer',farbe:'#8b5cf6',areaAccess:'__all__'});
  const [showPin, setShowPin] = useState(false);
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#10b981','#06b6d4'];

  useEffect(() => {
    const unsub = db.collection('cafe-users').onSnapshot(
      snap => setUsers(snap.docs.map(d=>({id:d.id,...d.data()}))),
      () => {}
    );
    return () => unsub();
  }, []);

  const save = async () => {
    if (!form.name.trim()||!form.pin.trim()) { toast('Name und PIN erforderlich','error'); return; }
    const data = {name:form.name.trim(),pin:form.pin.trim(),role:form.role,farbe:form.farbe,areaAccess:form.areaAccess||'__all__'};
    if (modal==='add') {
      await db.collection('cafe-users').add(data);
      toast('Person hinzugefügt');
    } else {
      await db.collection('cafe-users').doc(modal).update(data);
      toast('Person aktualisiert');
    }
    setModal(null);
  };

  const del = async (id) => {
    await db.collection('cafe-users').doc(id).delete();
    toast('Person gelöscht','warn');
  };

  const openAdd = () => { setForm({name:'',pin:'',role:'kassierer',farbe:'#8b5cf6',areaAccess:'__all__'}); setShowPin(false); setModal('add'); };
  const openEdit = u => { setForm({name:u.name,pin:u.pin||'',role:u.role||'kassierer',farbe:u.farbe||'#8b5cf6',areaAccess:u.areaAccess||'__all__'}); setShowPin(false); setModal(u.id); };

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs text-slate-500">{users.length} Personen</div>
        <button onClick={openAdd} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>
          <SI p={IC.plus} size={14}/>Person
        </button>
      </div>
      <div className="flex flex-col gap-2">
        {users.map(u=>(
          <div key={u.id} className="glass rounded-2xl px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <Avatar name={u.name} color={u.farbe||'#8b5cf6'} size={36}/>
              <div>
                <div className="text-sm font-bold text-slate-800">{u.name}</div>
                <span className="pill text-xs" style={{background:'#f1f5f9',color:'#475569'}}>{ROLE_LABELS[u.role]||u.role}</span>
                {u.areaAccess && u.areaAccess !== '__all__' && Array.isArray(u.areaAccess) && (
                  <div className="flex flex-wrap gap-1 mt-1">
                    {u.areaAccess.map(aid => {
                      const pp = CAFE_PROFILES.find(p=>p.id===aid);
                      return pp ? (
                        <span key={aid} className="pill text-xs" style={{background:(pp.color||'#8b5cf6')+'22',color:pp.color||'#8b5cf6'}}>{pp.label}</span>
                      ) : null;
                    })}
                  </div>
                )}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={()=>openEdit(u)} className="text-slate-400 hover:text-slate-700 transition-all"><SI p={IC.edit} size={15}/></button>
              <button onClick={()=>del(u.id)} className="text-slate-400 hover:text-red-500 transition-all"><SI p={IC.trash} size={15}/></button>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title={modal==='add'?'Person hinzufügen':'Person bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Max Mustermann" autoFocus/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">PIN</label>
              <div className="relative">
                <input type={showPin?'text':'password'} className={INP} value={form.pin} onChange={e=>set('pin',e.target.value)} placeholder="PIN setzen"/>
                <button type="button" onClick={()=>setShowPin(v=>!v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                  <SI p={showPin?IC.eyeOff:IC.eye} size={14}/>
                </button>
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Rolle</label>
              <select className={INP} value={form.role} onChange={e=>set('role',e.target.value)}>
                {ROLE_OPTIONS.map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Farbe</label>
              <div className="flex flex-wrap gap-2">
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>set('farbe',c)}
                    className="w-7 h-7 rounded-full transition-all hover:scale-110"
                    style={{background:c,outline:form.farbe===c?`2px solid ${c}`:'2px solid transparent',outlineOffset:'2px'}}/>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Bereichs-Zugriff</label>
              <div className="flex flex-col gap-1.5">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={form.areaAccess==='__all__' || !form.areaAccess}
                    onChange={e=>setForm(f=>({...f, areaAccess: e.target.checked ? '__all__' : []}))}
                    className="rounded"/>
                  <span className="text-sm text-slate-700">Alle Bereiche</span>
                </label>
                {form.areaAccess !== '__all__' && form.areaAccess && CAFE_PROFILES.map(pp => (
                  <label key={pp.id} className="flex items-center gap-2 cursor-pointer ml-4">
                    <input type="checkbox"
                      checked={Array.isArray(form.areaAccess) && form.areaAccess.includes(pp.id)}
                      onChange={e=>setForm(f=>({...f, areaAccess: e.target.checked
                        ? [...(Array.isArray(f.areaAccess)?f.areaAccess:[]), pp.id]
                        : (Array.isArray(f.areaAccess)?f.areaAccess:[]).filter(x=>x!==pp.id)
                      }))}/>
                    <span className="text-sm text-slate-700">{pp.label}</span>
                  </label>
                ))}
              </div>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={save} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};


// ─── KassiererSchichtStart ────────────────────────────────────────────────────
const KassiererSchichtStart = ({ user, toast, profile, cafe, onStarted }) => {
  const [kassenstart, setKassenstart] = useState('');

  const start = () => {
    const neu = {
      id:genId(), kassiererId:user.id, kassiererName:user.name,
      start:new Date().toISOString(), ende:null,
      kassenstart:parseFloat(kassenstart)||0, kassenende:null,
      bestellungen_count:0, umsatz:0,
    };
    toast('Schicht gestartet ✓');
    onStarted(neu);
    db.collection(profile||'k21-cafe').doc('data')
      .set({...DEFAULT_CAFE(),...cafe, schichten:[...(cafe.schichten||[]),neu]})
      .catch(e=>toast(e.message,'error'));
  };

  return (
    <div style={{minHeight:'calc(100vh - 100px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}>
      <div className="glass rounded-2xl glow p-8 w-full max-w-sm text-center">
        <div className="text-5xl mb-4">⏰</div>
        <h2 className="text-xl font-bold text-slate-800 mb-1">Schicht starten</h2>
        <p className="text-sm text-slate-500 mb-6">Gib das Startgeld in der Kasse ein</p>
        <input type="number" className={INP+' mb-4 text-center text-xl font-bold'} placeholder="Startgeld (€)"
          value={kassenstart} onChange={e=>setKassenstart(e.target.value)} step="0.01" min="0" autoFocus
          onKeyDown={e=>e.key==='Enter'&&start()}/>
        <button onClick={start}
          className="w-full py-3 rounded-xl text-sm font-bold text-white"
          style={{background:'#000000',borderRadius:30}}>
          Schicht starten →
        </button>
      </div>
    </div>
  );
};

// ─── Nav config ───────────────────────────────────────────────────────────────
const NAV_ITEMS = [
  { id:'kasse',            label:'Kasse',         icon:IC.cart,    perm:'kasse' },
  { id:'bestellungen',     label:'Bestellungen',  icon:IC.orders,  perm:'bestellungen' },
  { id:'schicht',          label:'Schicht',       icon:IC.shift,   perm:'schicht' },
  { id:'produkte',         label:'Produkte',      icon:IC.tag,     perm:'produkte' },
  { id:'zahlungsmethoden', label:'Zahlungen',     icon:IC.cash,    perm:'zahlungsmethoden' },
  { id:'finanzen',         label:'Finanzen',      icon:IC.chart,   perm:'finanzen' },
  { id:'personen',         label:'Personen',      icon:IC.users,   perm:'personen' },
];

// ─── App ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [user, setUser]           = useState(null);
  const [cafe, setCafe]           = useState(DEFAULT_CAFE());
  const [syncState, setSyncState] = useState('connecting');
  const [page, setPage]           = useState('kasse');
  const [activeSchicht, setActiveSchicht] = useState(null);
  const [toasts, toast]           = useToast();
  const [profiles, setProfiles]   = useState(DEFAULT_CAFE_PROFILES);
  const [profile, setProfile]     = useState(DEFAULT_CAFE_PROFILES[0].id);
  const [headerEdit, setHeaderEdit]           = useState(null);
  const [headerEditName, setHeaderEditName]   = useState('');
  const [headerEditColor, setHeaderEditColor] = useState('#8b5cf6');

  // Load profiles on mount
  useEffect(() => {
    db.collection('config').doc('cafe-profiles').get().then(snap => {
      const d = snap.data()?.data;
      if (d && d.length) { setProfiles(d); CAFE_PROFILES = d; setProfile(d[0].id); }
    }).catch(()=>{});
  }, []);

  // Firestore listener
  useEffect(() => {
    if (!user) return;
    setSyncState('connecting');
    const ref = db.collection(profile).doc('data');
    const unsub = ref.onSnapshot(
      snap => {
        const data = snap.exists ? snap.data() : DEFAULT_CAFE();
        setCafe({...DEFAULT_CAFE(), ...data});
        // Find active schicht for this user
        const aktiv = (data.schichten||[]).find(s=>!s.ende && (user.role==='owner'||s.kassiererId===user.id));
        setActiveSchicht(aktiv||null);
        setSyncState('synced');
      },
      () => setSyncState('error')
    );
    return () => unsub();
  }, [user, profile]);

  // On login, jump to appropriate default page
  useEffect(() => {
    if (!user) return;
    const firstAllowed = NAV_ITEMS.find(n=>can(user.role,n.perm));
    if (firstAllowed) setPage(firstAllowed.id);
  }, [user]);

  const saveHeaderEdit = () => {
    if (!headerEditName.trim()) return;
    let np;
    if (headerEdit === 'new') {
      const id = headerEditName.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Math.random().toString(36).slice(2,5);
      np = [...profiles, {id, label:headerEditName.trim(), color:headerEditColor, grad:`linear-gradient(135deg,${headerEditColor},#334155)`}];
    } else {
      np = profiles.map(p => p.id===headerEdit ? {...p, label:headerEditName.trim(), color:headerEditColor, grad:`linear-gradient(135deg,${headerEditColor},#334155)`} : p);
    }
    setProfiles(np); CAFE_PROFILES = np;
    db.collection('config').doc('cafe-profiles').set({data: np}).catch(()=>{});
    setHeaderEdit(null);
    toast(headerEdit==='new' ? 'Bereich erstellt ✓' : 'Bereich umbenannt ✓');
  };

  if (!user) return <LoginView onLogin={(u, pid) => { setUser(u); if (pid) setProfile(pid); }} profiles={profiles}/>;

  const visibleNav = NAV_ITEMS.filter(n=>can(user.role,n.perm));

  // Make sure current page is accessible
  const activePage = can(user.role, NAV_ITEMS.find(n=>n.id===page)?.perm) ? page : (visibleNav[0]?.id||'bestellungen');

  const renderPage = () => {
    if (user.role==='kassierer' && !activeSchicht)
      return <KassiererSchichtStart user={user} toast={toast} profile={profile} cafe={cafe} onStarted={setActiveSchicht}/>;
    if (activePage==='kasse')            return <KasseView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} profile={profile}/>;
    if (activePage==='bestellungen')     return <BestellungenView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} profile={profile}/>;
    if (activePage==='schicht')          return <SchichtView cafe={cafe} user={user} toast={toast} activeSchicht={activeSchicht} setActiveSchicht={setActiveSchicht} profile={profile}/>;
    if (activePage==='produkte')         return <ProdukteView cafe={cafe} user={user} toast={toast} profile={profile}/>;
    if (activePage==='zahlungsmethoden') return <ZahlungsMethodenView cafe={cafe} toast={toast} profile={profile}/>;
    if (activePage==='finanzen')         return <FinanzenView cafe={cafe} toast={toast} profile={profile} profiles={profiles} user={user}/>;
    if (activePage==='personen')         return <PersonenView toast={toast} profile={profile}/>;
    return null;
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <header style={{background:'#000000',position:'sticky',top:0,zIndex:100}}>
        {/* Row 1: Logo + Area pills + User info */}
        <div style={{maxWidth:'1400px',margin:'0 auto',padding:'0 20px',height:'56px',display:'flex',alignItems:'center',gap:'16px'}}>
          {/* Logo */}
          <div className="flex items-center gap-2 flex-shrink-0">
            <img src="/logo.png" style={{width:30,height:30,filter:'invert(1)',mixBlendMode:'screen'}} alt="K21"/>
            <span className="text-white font-bold text-sm hidden sm:block">K21 Café</span>
          </div>

          {/* Area pills – centered */}
          <div className="flex gap-1 mx-auto items-center flex-wrap justify-center">
            {profiles.map(pp => (
              <div key={pp.id} className="relative flex items-center gap-0.5">
                <button onClick={()=>setProfile(pp.id)}
                  className="px-3 py-1.5 text-xs font-bold transition-all"
                  style={{
                    borderRadius:30,
                    background: profile===pp.id ? '#ffffff' : 'transparent',
                    color: profile===pp.id ? '#000000' : 'rgba(255,255,255,0.4)',
                    border: profile===pp.id ? '1px solid transparent' : '1px solid rgba(255,255,255,0.12)',
                  }}>
                  {pp.label}
                </button>
                {user?.role==='owner' && (
                  <button onClick={()=>{setHeaderEdit(pp.id);setHeaderEditName(pp.label);setHeaderEditColor(pp.color||'#8b5cf6');}}
                    title="Bereich bearbeiten"
                    className="w-5 h-5 flex items-center justify-center rounded-full opacity-40 hover:opacity-100 transition-all"
                    style={{color:'rgba(255,255,255,0.7)'}}>
                    <SI p={IC.edit} size={12}/>
                  </button>
                )}
              </div>
            ))}
            {user?.role==='owner' && (
              <button onClick={()=>{setHeaderEdit('new');setHeaderEditName('');setHeaderEditColor('#8b5cf6');}}
                title="Neuer Bereich"
                className="w-7 h-7 flex items-center justify-center rounded-full opacity-50 hover:opacity-100 transition-all"
                style={{color:'rgba(255,255,255,0.7)',border:'1px dashed rgba(255,255,255,0.3)'}}>
                <SI p={IC.plus} size={13}/>
              </button>
            )}
          </div>

          {/* Right side: sync + schicht badge + avatar + logout */}
          <div className="flex items-center gap-3 flex-shrink-0">
            <SyncDot state={syncState}/>
            {activeSchicht && (
              <span className="pill text-xs hidden sm:inline-flex" style={{background:'rgba(16,185,129,0.2)',color:'#34d399'}}>
                ● Schicht aktiv
              </span>
            )}
            <div className="flex items-center gap-2">
              <Avatar name={user.name} color={user.farbe||'#8b5cf6'} size={28}/>
              <span className="text-white text-xs font-semibold hidden md:block">{user.name}</span>
            </div>
            <button onClick={()=>setUser(null)} className="text-white/40 hover:text-white transition-all" title="Abmelden">
              <SI p={IC.logout} size={15}/>
            </button>
          </div>
        </div>

        {/* Row 2: Nav tabs */}
        <div style={{borderTop:'1px solid rgba(255,255,255,0.06)'}}>
          <div style={{maxWidth:'1400px',margin:'0 auto',padding:'0 16px',height:'44px',display:'flex',alignItems:'center',justifyContent:'center',gap:'2px',overflowX:'auto',scrollbarWidth:'none'}}>
            {visibleNav.map(n=>(
              <button key={n.id} onClick={()=>setPage(n.id)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold flex-shrink-0 transition-all"
                style={{
                  background:activePage===n.id?'rgba(255,255,255,0.15)':'transparent',
                  color:activePage===n.id?'#fff':'rgba(255,255,255,0.45)'
                }}>
                <SI p={n.icon} size={13}/>{n.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      {/* Main content */}
      <main style={{flex:1,maxWidth:'1400px',margin:'0 auto',padding:'20px',width:'100%'}}>
        <div className="up">
          {renderPage()}
        </div>
      </main>

      {headerEdit && (
        <Modal title={headerEdit==='new'?'Neuer Bereich':'Bereich bearbeiten'} onClose={()=>setHeaderEdit(null)}>
          <div className="space-y-4">
            <div>
              <label className="text-slate-400 text-xs block mb-1.5">Name</label>
              <input autoFocus value={headerEditName} onChange={e=>setHeaderEditName(e.target.value)}
                placeholder="Bereich-Name…" className={INP}
                onKeyDown={e=>e.key==='Enter'&&saveHeaderEdit()}/>
            </div>
            <div>
              <label className="text-slate-400 text-xs block mb-1.5">Farbe</label>
              <ColorPicker value={headerEditColor} onChange={setHeaderEditColor}/>
            </div>
            <div className="flex gap-2 pt-1">
              <button onClick={saveHeaderEdit} className="flex-1 bg-slate-900 hover:bg-slate-700 text-white font-bold py-2.5 text-sm rounded-xl transition-all">Speichern</button>
              <button onClick={()=>setHeaderEdit(null)} className="px-4 py-2.5 bg-black/5 text-slate-400 text-sm rounded-xl transition-all">Abbrechen</button>
            </div>
            {headerEdit!=='new' && profiles.length > 1 && (
              <button onClick={()=>{
                if (!window.confirm('Bereich wirklich löschen?')) return;
                const np = profiles.filter(p=>p.id!==headerEdit);
                setProfiles(np); CAFE_PROFILES=np;
                db.collection('config').doc('cafe-profiles').set({data:np}).catch(()=>{});
                if (profile===headerEdit) setProfile(np[0].id);
                setHeaderEdit(null);
                toast('Bereich gelöscht ✓');
              }} className="w-full py-2 text-red-400 hover:text-red-600 text-xs font-medium transition-all text-center">
                Bereich löschen
              </button>
            )}
          </div>
        </Modal>
      )}

      <ToastContainer toasts={toasts}/>
    </div>
  );
};

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>

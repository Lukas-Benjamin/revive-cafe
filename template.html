                style={{minHeight:'90px'}}>
                {inCart && (
                  <span className="absolute top-2 right-2 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold text-white"
                    style={{background:'#0f172a',fontSize:'10px'}}>{inCart.menge}</span>
                )}
                <div className="text-2xl mb-1">{p.emoji||'🍵'}</div>
                <div className="text-xs font-semibold text-slate-800 leading-tight">{p.name}</div>
                <div className="text-xs font-bold mt-1" style={{color:kat?.farbe||'#6366f1'}}>{fmtEur(p.preis)}</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Right: cart */}
      <div className="glass rounded-2xl glow flex flex-col" style={{width:'300px',flexShrink:0}}>
        <div className="px-4 py-3 flex items-center justify-between" style={{borderBottom:'1px solid rgba(0,0,0,0.08)'}}>
          <span className="font-semibold text-sm text-slate-800 flex items-center gap-2">
            <SI p={IC.bag} size={15}/>Warenkorb
          </span>
          {warenkorb.length > 0 && (
            <button onClick={clearCart} className="text-xs text-slate-400 hover:text-red-500 transition-all">Leeren</button>
          )}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'8px'}}>
          {warenkorb.length===0 && (
            <div className="text-center py-8 text-slate-400 text-xs">Noch leer</div>
          )}
          {warenkorb.map(item => (
            <div key={item.produkt_id} className="flex items-center gap-2 px-2 py-2 rounded-xl glass-hover">
              <span className="text-base">{item.emoji||'🍵'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div className="text-xs font-semibold text-slate-800 truncate">{item.name}</div>
                <div className="text-xs text-slate-500">{fmtEur(item.preis * item.menge)}</div>
              </div>
              <div className="flex items-center gap-1">
                <button onClick={()=>changeQty(item.produkt_id,-1)}
                  className="w-6 h-6 rounded-lg flex items-center justify-center text-slate-600 hover:bg-black/10 transition-all">
                  <SI p={IC.minus} size={12}/>
                </button>
                <span className="text-xs font-bold w-4 text-center">{item.menge}</span>
                <button onClick={()=>changeQty(item.produkt_id,1)}
                  className="w-6 h-6 rounded-lg flex items-center justify-center text-slate-600 hover:bg-black/10 transition-all">
                  <SI p={IC.plus} size={12}/>
                </button>
              </div>
              <button onClick={()=>removeItem(item.produkt_id)}
                className="text-slate-300 hover:text-red-400 transition-all ml-1">
                <SI p={IC.x} size={13}/>
              </button>
            </div>
          ))}
        </div>
        <div className="p-4" style={{borderTop:'1px solid rgba(0,0,0,0.08)'}}>
          <div className="flex justify-between items-center mb-3">
            <span className="text-sm font-semibold text-slate-600">Gesamt</span>
            <span className="text-lg font-bold text-slate-900">{fmtEur(gesamt)}</span>
          </div>
          <button
            disabled={warenkorb.length===0 || !activeSchicht}
            onClick={()=>setCheckoutOpen(true)}
            className="w-full py-3 rounded-xl text-sm font-bold text-white transition-all disabled:opacity-40"
            style={{background:'#0f172a'}}>
            {!activeSchicht ? 'Keine Schicht aktiv' : 'Zur Kasse →'}
          </button>
          {!activeSchicht && (
            <p className="text-xs text-slate-400 text-center mt-2">Schicht starten um Bestellungen anzunehmen</p>
          )}
        </div>
      </div>

      {checkoutOpen && (
        <CheckoutModal
          warenkorb={warenkorb}
          gesamt={gesamt}
          cafe={cafe}
          schicht={activeSchicht}
          user={user}
          toast={toast}
          onClose={()=>setCheckoutOpen(false)}
          onSuccess={()=>{ clearCart(); setCheckoutOpen(false); }}
          profile={profile}
        />
      )}
    </div>
  );
};

// ─── Checkout Modal ───────────────────────────────────────────────────────────
const CheckoutModal = ({ warenkorb, gesamt, cafe, schicht, user, toast, onClose, onSuccess, profile }) => {
  const methoden = useMemo(() => (cafe.zahlungsmethoden||[]).filter(m=>m.aktiv!==false), [cafe.zahlungsmethoden]);
  const [zahlungen, setZahlungen] = useState([]);
  const [aktuelleId, setAktuelleId] = useState(methoden[0]?.id||'bar');
  const [betrag, setBetrag] = useState('');

  const bezahlt    = zahlungen.reduce((s,z)=>s+z.betrag,0);
  const restBetrag = Math.max(0, gesamt - bezahlt);
  const methode    = methoden.find(m=>m.id===aktuelleId);
  const wechsel    = methode?.id==='bar' && parseFloat(betrag)>restBetrag ? parseFloat(betrag)-restBetrag : 0;

  // Gutschein: compute effective Betrag based on type
  const gutscheinBetrag = useMemo(() => {
    if (!methode?.gutschein) return 0;
    if (methode.gutschein_typ==='betrag') return Math.min(methode.gutschein_wert||0, restBetrag);
    if (methode.gutschein_typ==='produkte') {
      // sum of cheapest N products in warenkorb
      const n = methode.gutschein_wert||0;
      const einzeln = warenkorb.flatMap(i=>Array(i.menge).fill(i.preis)).sort((a,b)=>b-a).slice(0,n);
      return Math.min(einzeln.reduce((s,v)=>s+v,0), restBetrag);
    }
    return 0;
  }, [methode, restBetrag, warenkorb]);

  const addZahlung = () => {
    if (!methode) return;
    // Mindestbetrag check
    if ((methode.mindestbetrag||0) > 0 && restBetrag < methode.mindestbetrag) {
      toast(`Mindestbetrag für ${methode.name}: ${fmtEur(methode.mindestbetrag)}`,'warn'); return;
    }
    if (methode.gutschein) {
      if (gutscheinBetrag <= 0) { toast('Gutscheinwert deckt nichts ab','warn'); return; }
      const label = methode.gutschein_typ==='produkte'
        ? `${methode.name} (${methode.gutschein_wert} Prod.)`
        : methode.name;
      setZahlungen(p=>[...p,{art:methode.id, name:label, betrag:gutscheinBetrag, gutschein:true}]);
      setBetrag('');
    } else {
      const eingabe = parseFloat(betrag)||0;
      // Karten-artige Methoden (kein Wechselgeld) — buchen exakt Restbetrag
      const b = methode.id==='bar' ? eingabe : restBetrag;
      const actual = Math.min(b, restBetrag);
      if (actual <= 0) { toast('Betrag eingeben','error'); return; }
      setZahlungen(p=>[...p,{art:methode.id, name:methode.name, betrag:actual}]);
      setBetrag('');
    }
  };

  const saveOrder = () => {
    if (restBetrag > 0.005) { toast('Noch nicht vollständig bezahlt','error'); return; }
    const schichtBestellungen = (cafe.bestellungen||[]).filter(b=>b.schicht_id===schicht.id);
    const nummer = padNum(schichtBestellungen.length + 1);
    const neueBestellung = {
      id: genId(), schicht_id: schicht.id, nummer,
      artikel: warenkorb.map(i=>({...i,fertig:false})),
      gesamt, zahlung: zahlungen, status:'offen',
      erstellt_am: new Date().toISOString(),
      kassiererId: user.id, kassiererName: user.name,
    };
    const updSchichten = (cafe.schichten||[]).map(s=>
      s.id!==schicht.id ? s : {...s, bestellungen_count:(s.bestellungen_count||0)+1, umsatz:(s.umsatz||0)+gesamt}
    );
    toast(`Bestellung #${nummer} gespeichert ✓`);
    onSuccess();
    db.collection(profile||'k21-cafe').doc('data')
      .set({...DEFAULT_CAFE(),...cafe, schichten:updSchichten, bestellungen:[...(cafe.bestellungen||[]),neueBestellung]})
      .catch(e=>toast('Fehler: '+e.message,'error'));
  };

  return (
    <Modal title="Kasse" onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        {/* Artikel */}
        <div className="rounded-xl p-3" style={{background:'#f8fafc'}}>
          {warenkorb.map(i=>(
            <div key={i.produkt_id} className="flex justify-between text-sm py-0.5">
              <span className="text-slate-600">{i.name} ×{i.menge}</span>
              <span className="font-semibold">{fmtEur(i.preis*i.menge)}</span>
            </div>
          ))}
          <div className="flex justify-between text-sm font-bold pt-2 mt-2" style={{borderTop:'1px solid rgba(0,0,0,0.08)'}}>
            <span>Gesamt</span><span>{fmtEur(gesamt)}</span>
          </div>
        </div>

        {/* Bereits bezahlt */}
        {zahlungen.length > 0 && (
          <div className="rounded-xl p-3" style={{background:'#f0fdf4',border:'1px solid #bbf7d0'}}>
            <p className="text-xs font-semibold text-green-700 mb-1.5">Zahlungen</p>
            {zahlungen.map((z,i)=>(
              <div key={i} className="flex items-center justify-between text-xs py-0.5">
                <span className="text-green-800 flex items-center gap-1">
                  {z.gutschein && <span className="pill" style={{background:'#ede9fe',color:'#6d28d9',fontSize:'9px'}}>Gutschein</span>}
                  {z.name}
                </span>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-green-700">{fmtEur(z.betrag)}</span>
                  <button onClick={()=>setZahlungen(p=>p.filter((_,j)=>j!==i))} className="text-green-300 hover:text-red-400"><SI p={IC.x} size={11}/></button>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Rest / Bezahlt */}
        <div className="flex justify-between items-center">
          <span className="text-sm font-semibold text-slate-600">Noch offen</span>
          <span className={`text-xl font-bold ${restBetrag<=0.005?'text-emerald-600':'text-slate-900'}`}>
            {restBetrag<=0.005 ? '✓ Bezahlt' : fmtEur(restBetrag)}
          </span>
        </div>

        {/* Zahlung hinzufügen */}
        {restBetrag > 0.005 && (
          <div className="flex flex-col gap-3">
            <p className="text-xs font-semibold text-slate-500">Zahlungsart wählen</p>
            <div className="flex flex-wrap gap-2">
              {methoden.map(m=>{
                const disabled = (m.mindestbetrag||0)>0 && restBetrag<m.mindestbetrag;
                return (
                  <button key={m.id} onClick={()=>{setAktuelleId(m.id);setBetrag('');}}
                    disabled={disabled}
                    title={disabled?`Mindestbetrag: ${fmtEur(m.mindestbetrag)}`:''}
                    className={`pill transition-all disabled:opacity-40 ${aktuelleId===m.id?'text-white':'text-slate-600 bg-white border border-black/10'}`}
                    style={aktuelleId===m.id?{background: m.gutschein?'#6d28d9':'#0f172a'}:{}}>
                    {m.gutschein ? '🎁 ' : ''}{m.name}
                    {(m.mindestbetrag||0)>0 && <span className="ml-1 opacity-60">Min. {fmtEur(m.mindestbetrag)}</span>}
                  </button>
                );
              })}
            </div>

            {methode?.gutschein ? (
              // Gutschein: zeige Wert und Einlösen-Button
              <div className="rounded-xl p-3 flex items-center justify-between" style={{background:'#ede9fe',border:'1px solid #ddd6fe'}}>
                <div>
                  <div className="text-xs font-semibold text-purple-700">{methode.name}</div>
                  <div className="text-xs text-purple-500 mt-0.5">
                    {methode.gutschein_typ==='produkte'
                      ? `${methode.gutschein_wert} teuerste Produkt(e) gratis`
                      : `Wert: ${fmtEur(methode.gutschein_wert||0)}`}
                    {' → '}<strong>{fmtEur(gutscheinBetrag)}</strong> abzugsfähig
                  </div>
                </div>
                <button onClick={addZahlung}
                  className="px-4 py-2 rounded-xl text-sm font-semibold text-white flex-shrink-0 ml-3"
                  style={{background:'#6d28d9'}}>
                  Einlösen
                </button>
              </div>
            ) : methode?.id==='bar' ? (
              // Bar: freier Betrag mit Wechselgeld
              <div className="flex flex-col gap-1">
                <div className="flex gap-2">
                  <input type="number" className={INP} placeholder={`Betrag (${fmtEur(restBetrag)})`}
                    value={betrag} onChange={e=>setBetrag(e.target.value)} step="0.01" min="0"
                    onKeyDown={e=>e.key==='Enter'&&addZahlung()} autoFocus/>
                  <button onClick={addZahlung} className="px-4 py-2.5 rounded-xl text-sm font-semibold text-white flex-shrink-0" style={{background:'#0f172a'}}>+</button>
                </div>
                {parseFloat(betrag)>restBetrag && (
                  <p className="text-xs text-emerald-600 font-semibold">Wechselgeld: {fmtEur(wechsel)}</p>
                )}
              </div>
            ) : (
              // Karte o.ä.: bucht exakt Restbetrag
              <button onClick={addZahlung}
                className="w-full py-2.5 rounded-xl text-sm font-semibold text-white"
                style={{background:'#0f172a'}}>
                {methode?.name}: {fmtEur(restBetrag)}
              </button>
            )}
          </div>
        )}

        <button onClick={saveOrder} disabled={restBetrag>0.005}
          className="w-full py-3 rounded-xl text-sm font-bold text-white transition-all disabled:opacity-40"
          style={{background:'#10b981'}}>
          Bestellung abschließen ✓
        </button>
      </div>
    </Modal>
  );
};

// ─── BestellungenView ─────────────────────────────────────────────────────────
const BestellungenView = ({ cafe, user, toast, activeSchicht, profile }) => {
  const [filter, setFilter] = useState('aktiv');

  const bestellungen = useMemo(() => {
    let list = [...(cafe.bestellungen||[])];
    if (filter==='aktiv') list = list.filter(b=>b.status!=='storniert' && b.status!=='fertig');
    else if (filter==='fertig') list = list.filter(b=>b.status==='fertig');
    else if (filter==='schicht' && activeSchicht) list = list.filter(b=>b.schicht_id===activeSchicht.id);
    return list.sort((a,b)=>new Date(b.erstellt_am)-new Date(a.erstellt_am));
  }, [cafe.bestellungen, filter, activeSchicht]);

  const ref = () => db.collection(profile||'k21-cafe').doc('data');
  const write = (patch) => ref().set({...DEFAULT_CAFE(),...cafe,...patch}).catch(e=>toast(e.message,'error'));

  const markItemFertig = (bestellung, artikelIdx) => {
    const updBestellungen = (cafe.bestellungen||[]).map(b => {
      if (b.id!==bestellung.id) return b;
      const artikel = b.artikel.map((a,i)=>i===artikelIdx?{...a,fertig:true}:a);
      const allFertig = artikel.every(a=>a.fertig);
      return { ...b, artikel, status: allFertig?'fertig':b.status };
    });
    write({bestellungen:updBestellungen});
  };

  const stornieren = (b) => {
    if (!can(user.role,'stornieren')) return;
    const updBestellungen = (cafe.bestellungen||[]).map(x=>x.id===b.id?{...x,status:'storniert'}:x);
    const updSchichten = (cafe.schichten||[]).map(s=>{
      if(s.id!==b.schicht_id) return s;
      return {...s, umsatz:Math.max(0,(s.umsatz||0)-b.gesamt), bestellungen_count:Math.max(0,(s.bestellungen_count||1)-1)};
    });
    toast('Bestellung storniert','warn');
    write({bestellungen:updBestellungen,schichten:updSchichten});
  };

  const artLabel = { bar:'Bar', karte:'Karte', gutschein:'Gutschein', wertkarte:'Wertkarte' };
  const statusStyle = { offen:{bg:'#fef3c7',col:'#92400e'}, fertig:{bg:'#d1fae5',col:'#065f46'}, storniert:{bg:'#fee2e2',col:'#991b1b'} };

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        {[['aktiv','Offen'],['fertig','Fertig'],['schicht','Diese Schicht'],['alle','Alle']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)}
            className={`pill transition-all ${filter===v?'text-white':'text-slate-600 bg-white border border-black/10'}`}
            style={filter===v?{background:'#0f172a'}:{}}>
            {l}
          </button>
        ))}
      </div>
      {bestellungen.length===0 && (
        <div className="text-center py-16 text-slate-400 text-sm">Keine Bestellungen</div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'12px'}}>
        {bestellungen.map(b => {
          const ss = statusStyle[b.status]||statusStyle.offen;
          return (
            <div key={b.id} className="glass rounded-2xl p-4 glow">
              <div className="flex items-start justify-between mb-3">
                <div>
                  <span className="text-lg font-bold text-slate-800">#{b.nummer}</span>
                  <span className="text-xs text-slate-400 ml-2">{fmtDateTime(b.erstellt_am)}</span>
                </div>
                <span className="pill text-xs" style={{background:ss.bg,color:ss.col}}>
                  {b.status==='offen'?'Offen':b.status==='fertig'?'Fertig':'Storniert'}
                </span>
              </div>
              <div className="mb-3">
                {(b.artikel||[]).map((a,i)=>(
                  <div key={i} className="flex items-center gap-2 py-1">
                    {(user.role==='barista'||can(user.role,'kasse')) && b.status==='offen' && (
                      <button onClick={()=>markItemFertig(b,i)}
                        className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all ${a.fertig?'bg-green-500 border-green-500':'border-slate-300 hover:border-green-400'}`}>
                        {a.fertig && <SI p={IC.check} size={10} stroke={3}/>}
                      </button>
                    )}
                    <span className="text-sm text-slate-700">{a.emoji||''} {a.name} x{a.menge}</span>
                    <span className="text-xs text-slate-400 ml-auto">{fmtEur(a.preis*a.menge)}</span>
                  </div>
                ))}
              </div>
              <div style={{borderTop:'1px solid rgba(0,0,0,0.06)',paddingTop:'8px'}} className="flex justify-between items-center">
                <div className="text-xs text-slate-500">
                  {(b.zahlung||[]).map((z,i)=>(
                    <span key={i}>{i>0?', ':''}{artLabel[z.art]} {fmtEur(z.betrag)}</span>
                  ))}
                </div>
                <span className="text-sm font-bold text-slate-800">{fmtEur(b.gesamt)}</span>
              </div>
              {can(user.role,'stornieren') && b.status==='offen' && (
                <button onClick={()=>stornieren(b)}
                  className="w-full mt-2 py-1.5 rounded-lg text-xs font-semibold text-red-500 hover:bg-red-50 transition-all border border-red-200">
                  Stornieren
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ─── SchichtView ──────────────────────────────────────────────────────────────
const SchichtView = ({ cafe, user, toast, activeSchicht, setActiveSchicht, profile }) => {
  const [kassenstart, setKassenstart] = useState('');
  const [kassenende, setKassenende]   = useState('');
  const [showBericht, setShowBericht] = useState(false);
  const ref = () => db.collection(profile||'k21-cafe').doc('data');

  const startSchicht = () => {
    const neu = {
      id:genId(), kassiererId:user.id, kassiererName:user.name,
      start:new Date().toISOString(), ende:null,
      kassenstart:parseFloat(kassenstart)||0, kassenende:null,
      bestellungen_count:0, umsatz:0,
    };
    setActiveSchicht(neu);
    toast('Schicht gestartet ✓');
    ref().set({...DEFAULT_CAFE(),...cafe, schichten:[...(cafe.schichten||[]),neu]}).catch(e=>toast(e.message,'error'));
  };

  const endeSchicht = () => {
    const updated = {...activeSchicht, ende:new Date().toISOString(), kassenende:parseFloat(kassenende)||0};
    setActiveSchicht(null);
    setShowBericht(false);
    toast('Schicht beendet ✓');
    ref().set({...DEFAULT_CAFE(),...cafe, schichten:(cafe.schichten||[]).map(s=>s.id===activeSchicht.id?updated:s)}).catch(e=>toast(e.message,'error'));
  };

  const schichtBestellungen = useMemo(() =>
    activeSchicht ? (cafe.bestellungen||[]).filter(b=>b.schicht_id===activeSchicht.id&&b.status!=='storniert') : [],
    [cafe.bestellungen, activeSchicht]);

  const zahlungsBreakdown = useMemo(() => {
    const map = {};
    schichtBestellungen.forEach(b=>{
      (b.zahlung||[]).forEach(z=>{
        map[z.art] = (map[z.art]||0) + z.betrag;
      });
    });
    return map;
  }, [schichtBestellungen]);

  const dauer = useMemo(() => {
    if (!activeSchicht) return '';
    const ms = Date.now() - new Date(activeSchicht.start).getTime();
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
    return `${h}h ${m}min`;
  }, [activeSchicht]);

  const vergangeneSchichten = useMemo(() =>
    (cafe.schichten||[]).filter(s=>s.ende).sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,10),
    [cafe.schichten]);

  if (!activeSchicht) {
    return (
      <div>
        <div className="glass rounded-2xl glow p-6 max-w-md mb-6">
          <h2 className="text-sm font-bold text-slate-800 mb-4">Neue Schicht starten</h2>
          <label className="text-xs font-semibold text-slate-600 mb-1 block">Kassenstart (Bargeld in Kasse)</label>
          <input type="number" className={INP + ' mb-4'} placeholder="z.B. 50.00"
            value={kassenstart} onChange={e=>setKassenstart(e.target.value)} step="0.01"/>
          <button onClick={startSchicht}
            className="w-full py-3 rounded-xl text-sm font-bold text-white"
            style={{background:'#0f172a'}}>
            Schicht starten
          </button>
        </div>
        {vergangeneSchichten.length > 0 && (
          <div>
            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Vergangene Schichten</h3>
            <div className="flex flex-col gap-2">
              {vergangeneSchichten.map(s=>(
                <div key={s.id} className="glass rounded-xl px-4 py-3 flex items-center justify-between">
                  <div>
                    <div className="text-sm font-semibold text-slate-700">{s.kassiererName}</div>
                    <div className="text-xs text-slate-400">{fmtDateTime(s.start)} – {fmtTime(s.ende)}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-sm font-bold text-slate-800">{fmtEur(s.umsatz||0)}</div>
                    <div className="text-xs text-slate-400">{s.bestellungen_count||0} Bestellungen</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="max-w-xl">
      <div className="glass rounded-2xl glow p-6 mb-4">
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-sm font-bold text-slate-800">Aktive Schicht</h2>
          <span className="pill" style={{background:'#d1fae5',color:'#065f46'}}>● Läuft</span>
        </div>
        <div className="grid grid-cols-2 gap-4 mb-4">
          {[
            ['Kassierer',activeSchicht.kassiererName],
            ['Gestartet',fmtDateTime(activeSchicht.start)],
            ['Dauer',dauer],
            ['Kassenstart',fmtEur(activeSchicht.kassenstart||0)],
            ['Bestellungen',activeSchicht.bestellungen_count||0],
            ['Umsatz',fmtEur(activeSchicht.umsatz||0)],
          ].map(([l,v])=>(
            <div key={l}>
              <div className="text-xs text-slate-400">{l}</div>
              <div className="text-sm font-bold text-slate-800">{v}</div>
            </div>
          ))}
        </div>
        {Object.entries(zahlungsBreakdown).length > 0 && (
          <div className="rounded-xl p-3 mb-4" style={{background:'#f8fafc'}}>
            <p className="text-xs font-semibold text-slate-500 mb-2">Zahlungsarten</p>
            {Object.entries(zahlungsBreakdown).map(([art,betrag])=>(
              <div key={art} className="flex justify-between text-xs py-0.5">
                <span className="text-slate-600">{art}</span>
                <span className="font-semibold">{fmtEur(betrag)}</span>
              </div>
            ))}
          </div>
        )}
        <label className="text-xs font-semibold text-slate-600 mb-1 block">Kassenende (Bargeld in Kasse)</label>
        <input type="number" className={INP + ' mb-3'} placeholder="z.B. 80.00"
          value={kassenende} onChange={e=>setKassenende(e.target.value)} step="0.01"/>
        <button onClick={endeSchicht}
          className="w-full py-3 rounded-xl text-sm font-bold text-red-600 border border-red-200 hover:bg-red-50 transition-all">
          Schicht beenden
        </button>
      </div>
    </div>
  );
};

// ─── ProdukteView ─────────────────────────────────────────────────────────────
const ProdukteView = ({ cafe, toast, profile }) => {
  const [modal, setModal]       = useState(null);
  const [katModal, setKatModal] = useState(null);
  const [form, setForm]         = useState({name:'',preis:'',kategorie_id:'',beschreibung:'',aktiv:true});
  const [katForm, setKatForm]   = useState({name:'',farbe:'#6366f1'});
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#10b981','#06b6d4','#3b82f6'];
  const ref   = () => db.collection(profile||'k21-cafe').doc('data');
  const write = (patch) => ref().set({...DEFAULT_CAFE(),...cafe,...patch}).catch(e=>toast(e.message,'error'));

  const saveProdukt = () => {
    if (!form.name.trim()||!form.preis) { toast('Name und Preis erforderlich','error'); return; }
    let produkte = [...(cafe.produkte||[])];
    if (modal==='add') {
      produkte = [...produkte, {id:genId(),name:form.name.trim(),preis:parseFloat(form.preis),kategorie_id:form.kategorie_id,beschreibung:form.beschreibung,aktiv:true}];
    } else {
      produkte = produkte.map(p=>p.id===modal?{...p,name:form.name.trim(),preis:parseFloat(form.preis),kategorie_id:form.kategorie_id,beschreibung:form.beschreibung}:p);
    }
    setModal(null);
    toast(modal==='add'?'Produkt hinzugefügt ✓':'Produkt aktualisiert ✓');
    write({produkte});
  };

  const toggleAktiv   = (p) => write({produkte:(cafe.produkte||[]).map(x=>x.id===p.id?{...x,aktiv:!x.aktiv}:x)});
  const deleteProdukt = (id) => { write({produkte:(cafe.produkte||[]).filter(p=>p.id!==id)}); toast('Produkt gelöscht','warn'); };

  const saveKat = () => {
    if (!katForm.name.trim()) return;
    let kategorien = [...(cafe.kategorien||[])];
    if (katModal==='add') {
      kategorien = [...kategorien,{id:genId(),name:katForm.name.trim(),farbe:katForm.farbe}];
    } else {
      kategorien = kategorien.map(k=>k.id===katModal?{...k,name:katForm.name.trim(),farbe:katForm.farbe}:k);
    }
    setKatModal(null);
    toast('Kategorie gespeichert ✓');
    write({kategorien});
  };

  const deleteKat = (id) => { write({kategorien:(cafe.kategorien||[]).filter(k=>k.id!==id)}); toast('Kategorie gelöscht','warn'); };

  const openAdd  = () => { setForm({name:'',preis:'',kategorie_id:cafe.kategorien?.[0]?.id||'',beschreibung:'',aktiv:true}); setModal('add'); };
  const openEdit = (p) => { setForm({name:p.name,preis:p.preis,kategorie_id:p.kategorie_id||'',beschreibung:p.beschreibung||'',aktiv:p.aktiv!==false}); setModal(p.id); };

  const groupedByKat = useMemo(() => {
    const map = {};
    (cafe.kategorien||[]).forEach(k=>{ map[k.id]={kat:k,produkte:[]}; });
    map['_none'] = {kat:{id:'_none',name:'Ohne Kategorie',farbe:'#94a3b8'},produkte:[]};
    (cafe.produkte||[]).forEach(p=>{
      if (map[p.kategorie_id]) map[p.kategorie_id].produkte.push(p);
      else map['_none'].produkte.push(p);
    });
    return Object.values(map).filter(g=>g.produkte.length>0);
  }, [cafe.produkte, cafe.kategorien]);

  const totalProdukte = (cafe.produkte||[]).length;
  const aktivCount    = (cafe.produkte||[]).filter(p=>p.aktiv!==false).length;

  return (
    <div>
      {/* Toolbar */}
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-sm font-bold text-slate-800">Produkte</h2>
          <p className="text-xs text-slate-400 mt-0.5">{aktivCount} aktiv · {totalProdukte} gesamt</p>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>{setKatForm({name:'',farbe:'#6366f1'});setKatModal('add');}}
            className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border border-black/10 text-slate-600 hover:bg-black/5 transition-all">
            <SI p={IC.tag} size={13}/>Kategorie
          </button>
          <button onClick={openAdd}
            className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white"
            style={{background:'#0f172a'}}>
            <SI p={IC.plus} size={14}/>Produkt
          </button>
        </div>
      </div>

      {totalProdukte===0 && (
        <div className="text-center py-20 text-slate-400 text-sm">
          <div className="text-3xl mb-3">🗂</div>
          Noch keine Produkte. Erstelle zuerst eine Kategorie, dann füge Produkte hinzu.
        </div>
      )}

      {/* Grouped sections */}
      <div className="flex flex-col gap-6">
        {groupedByKat.map(({kat,produkte}) => (
          <div key={kat.id}>
            {/* Category header */}
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <div style={{width:4,height:20,borderRadius:2,background:kat.farbe,flexShrink:0}}/>
                <span className="text-sm font-bold text-slate-800">{kat.name}</span>
                <span className="pill text-xs" style={{background:kat.farbe+'18',color:kat.farbe}}>
                  {produkte.length} {produkte.length===1?'Produkt':'Produkte'}
                </span>
              </div>
              {kat.id !== '_none' && (
                <div className="flex items-center gap-1">
                  <button onClick={()=>{setKatForm({name:kat.name,farbe:kat.farbe});setKatModal(kat.id);}}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-black/5 transition-all">
                    <SI p={IC.edit} size={13}/>
                  </button>
                  <button onClick={()=>deleteKat(kat.id)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all">
                    <SI p={IC.trash} size={13}/>
                  </button>
                </div>
              )}
            </div>

            {/* Product table */}
            <div className="glass rounded-2xl glow overflow-hidden">
              {produkte.map((p,i) => (
                <div key={p.id}
                  className={`flex items-center gap-4 px-4 py-3 transition-all ${p.aktiv===false?'opacity-40 bg-slate-50':''}`}
                  style={{borderBottom: i<produkte.length-1 ? '1px solid rgba(0,0,0,0.05)' : 'none'}}>

                  {/* Color dot */}
                  <div style={{width:8,height:8,borderRadius:'50%',background:p.aktiv!==false?kat.farbe:'#cbd5e1',flexShrink:0}}/>

                  {/* Name + description */}
                  <div style={{flex:1,minWidth:0}}>
                    <div className="text-sm font-semibold text-slate-800 truncate">{p.name}</div>
                    {p.beschreibung && <div className="text-xs text-slate-400 truncate">{p.beschreibung}</div>}
                  </div>

                  {/* Price */}
                  <span className="text-sm font-bold text-slate-900 flex-shrink-0">{fmtEur(p.preis)}</span>

                  {/* Active toggle */}
                  <button onClick={()=>toggleAktiv(p)}
                    className={`toggle flex-shrink-0 ${p.aktiv!==false?'on':''}`}
                    style={{background:p.aktiv!==false?kat.farbe:'#cbd5e1'}}/>

                  {/* Edit / Delete */}
                  <button onClick={()=>openEdit(p)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-black/5 transition-all flex-shrink-0">
                    <SI p={IC.edit} size={14}/>
                  </button>
                  <button onClick={()=>deleteProdukt(p.id)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all flex-shrink-0">
                    <SI p={IC.trash} size={14}/>
                  </button>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      {/* Produkt Modal */}
      {modal && (
        <Modal title={modal==='add'?'Produkt hinzufügen':'Produkt bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={form.name} onChange={e=>set('name',e.target.value)} placeholder="z.B. Cappuccino" autoFocus/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Preis (€)</label>
              <input type="number" className={INP} value={form.preis} onChange={e=>set('preis',e.target.value)} step="0.10" min="0" placeholder="2.50"/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Kategorie</label>
              <select className={INP} value={form.kategorie_id} onChange={e=>set('kategorie_id',e.target.value)}>
                <option value="">Keine Kategorie</option>
                {(cafe.kategorien||[]).map(k=><option key={k.id} value={k.id}>{k.name}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Beschreibung (optional)</label>
              <input className={INP} value={form.beschreibung} onChange={e=>set('beschreibung',e.target.value)} placeholder="z.B. Mit Oatly Haferdrink"/>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700 hover:bg-black/5 transition-all">Abbrechen</button>
              <button onClick={saveProdukt} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}

      {/* Kategorie Modal */}
      {katModal && (
        <Modal title={katModal==='add'?'Kategorie hinzufügen':'Kategorie bearbeiten'} onClose={()=>setKatModal(null)}>
          <div className="flex flex-col gap-3">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={katForm.name} onChange={e=>setKatForm(p=>({...p,name:e.target.value}))} placeholder="z.B. Heißgetränke" autoFocus/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-2 block">Farbe</label>
              <div className="flex flex-wrap gap-2">
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>setKatForm(p=>({...p,farbe:c}))}
                    className="w-8 h-8 rounded-full transition-all hover:scale-110 flex items-center justify-center"
                    style={{background:c,outline:katForm.farbe===c?`3px solid ${c}`:'3px solid transparent',outlineOffset:'2px'}}>
                    {katForm.farbe===c && <SI p={IC.check} size={12} stroke={3}/>}
                  </button>
                ))}
              </div>
            </div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>setKatModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={saveKat} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── ZahlungsMethodenView ─────────────────────────────────────────────────────
const EMPTY_ZM = () => ({name:'', mindestbetrag:'', gutschein:false, gutschein_typ:'betrag', gutschein_wert:''});

const ZahlungsMethodenView = ({ cafe, toast, profile }) => {
  const [modal, setModal] = useState(null);
  const [form, setForm]   = useState(EMPTY_ZM());
  const sf = (k,v) => setForm(p=>({...p,[k]:v}));
  const methoden = cafe.zahlungsmethoden || [];

  const ref   = () => db.collection(profile||'k21-cafe').doc('data');
  const write = (zm) => ref().set({...DEFAULT_CAFE(),...cafe,zahlungsmethoden:zm}).catch(e=>toast(e.message,'error'));

  const save = () => {
    if (!form.name.trim()) { toast('Name erforderlich','error'); return; }
    const entry = {
      name: form.name.trim(),
      mindestbetrag: parseFloat(form.mindestbetrag)||0,
      gutschein: !!form.gutschein,
      gutschein_typ: form.gutschein ? form.gutschein_typ : null,
      gutschein_wert: form.gutschein ? (parseFloat(form.gutschein_wert)||0) : null,
    };
    let zm = [...methoden];
    if (modal==='add') {
      zm = [...zm, {id:genId(), ...entry, aktiv:true}];
    } else {
      zm = zm.map(m=>m.id===modal ? {...m, ...entry} : m);
    }
    setModal(null);
    toast(modal==='add'?'Hinzugefügt ✓':'Aktualisiert ✓');
    write(zm);
  };

  const toggleAktiv = (m) => write(methoden.map(x=>x.id===m.id?{...x,aktiv:!x.aktiv}:x));
  const del = (id) => { write(methoden.filter(x=>x.id!==id)); toast('Gelöscht','warn'); };

  const openAdd  = () => { setForm(EMPTY_ZM()); setModal('add'); };
  const openEdit = (m) => {
    setForm({
      name: m.name,
      mindestbetrag: m.mindestbetrag||'',
      gutschein: !!m.gutschein,
      gutschein_typ: m.gutschein_typ||'betrag',
      gutschein_wert: m.gutschein_wert||'',
    });
    setModal(m.id);
  };

  // Badge helper
  const badges = (m) => {
    const out = [];
    if (m.aktiv) out.push({label:'Aktiv', bg:'#d1fae5', col:'#065f46'});
    else         out.push({label:'Inaktiv', bg:'#f1f5f9', col:'#64748b'});
    if (m.mindestbetrag>0) out.push({label:`Min. ${fmtEur(m.mindestbetrag)}`, bg:'#fef3c7', col:'#92400e'});
    if (m.gutschein) {
      const v = m.gutschein_typ==='produkte'
        ? `${m.gutschein_wert} Produkt${m.gutschein_wert===1?'':'e'}`
        : fmtEur(m.gutschein_wert||0);
      out.push({label:`Gutschein · ${v}`, bg:'#ede9fe', col:'#6d28d9'});
    }
    return out;
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-sm font-bold text-slate-800">Zahlungsmethoden</h2>
          <p className="text-xs text-slate-400 mt-0.5">{methoden.filter(m=>m.aktiv).length} von {methoden.length} aktiv</p>
        </div>
        <button onClick={openAdd}
          className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>
          <SI p={IC.plus} size={14}/>Methode
        </button>
      </div>

      {methoden.length===0 && (
        <div className="text-center py-16 text-slate-400 text-sm">
          <div className="text-3xl mb-3">💳</div>Noch keine Zahlungsmethoden
        </div>
      )}

      <div className="glass rounded-2xl glow overflow-hidden">
        {methoden.map((m,i)=>(
          <div key={m.id}
            className={`flex items-center gap-4 px-4 py-4 transition-all ${!m.aktiv?'opacity-50 bg-slate-50':''}`}
            style={{borderBottom:i<methoden.length-1?'1px solid rgba(0,0,0,0.05)':'none'}}>

            {/* Left: name + badges */}
            <div style={{flex:1,minWidth:0}}>
              <div className="text-sm font-bold text-slate-800 mb-1.5">{m.name}</div>
              <div className="flex flex-wrap gap-1">
                {badges(m).map(b=>(
                  <span key={b.label} className="pill text-xs" style={{background:b.bg,color:b.col}}>{b.label}</span>
                ))}
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center gap-2 flex-shrink-0">
              <button onClick={()=>toggleAktiv(m)}
                className={`toggle ${m.aktiv?'on':''}`}
                style={{background:m.aktiv?'#10b981':'#cbd5e1'}}/>
              <button onClick={()=>openEdit(m)}
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-black/5 transition-all">
                <SI p={IC.edit} size={14}/>
              </button>
              <button onClick={()=>del(m.id)}
                className="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all">
                <SI p={IC.trash} size={14}/>
              </button>
            </div>
          </div>
        ))}
      </div>

      {modal && (
        <Modal title={modal==='add'?'Zahlungsmethode hinzufügen':'Methode bearbeiten'} onClose={()=>setModal(null)}>
          <div className="flex flex-col gap-4">

            {/* Name */}
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Name</label>
              <input className={INP} value={form.name} onChange={e=>sf('name',e.target.value)}
                placeholder="z.B. Bar, Karte, PayPal" autoFocus/>
            </div>

            {/* Mindestbetrag */}
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Mindestbetrag (€)</label>
              <input type="number" className={INP} value={form.mindestbetrag}
                onChange={e=>sf('mindestbetrag',e.target.value)} step="0.50" min="0"
                placeholder="0 = kein Minimum"/>
              <p className="text-xs text-slate-400 mt-1">Mindestbetrag damit diese Zahlart gewählt werden kann.</p>
            </div>

            {/* Gutschein */}
            <div className="rounded-xl p-4" style={{background:'#f8fafc',border:'1px solid rgba(0,0,0,0.06)'}}>
              <label className="flex items-center gap-3 cursor-pointer mb-3">
                <button onClick={()=>sf('gutschein',!form.gutschein)}
                  className={`toggle ${form.gutschein?'on':''}`}
                  style={{background:form.gutschein?'#6d28d9':'#cbd5e1'}}/>
                <div>
                  <span className="text-sm font-semibold text-slate-700">Gutschein</span>
                  <p className="text-xs text-slate-400">Diese Methode ist ein Gutschein mit festem Wert</p>
                </div>
              </label>

              {form.gutschein && (
                <div className="flex flex-col gap-3 pt-3" style={{borderTop:'1px solid rgba(0,0,0,0.06)'}}>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-2 block">Gutschein-Typ</label>
                    <div className="flex gap-2">
                      {[['betrag','Fixer Betrag (€)'],['produkte','Anzahl Produkte']].map(([v,l])=>(
                        <button key={v} onClick={()=>sf('gutschein_typ',v)}
                          className={`flex-1 py-2.5 rounded-xl text-xs font-semibold border transition-all ${form.gutschein_typ===v?'text-white border-transparent':'text-slate-600 border-black/10 hover:bg-black/5'}`}
                          style={form.gutschein_typ===v?{background:'#6d28d9'}:{}}>
                          {l}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-1 block">
                      {form.gutschein_typ==='produkte' ? 'Anzahl Produkte' : 'Betrag (€)'}
                    </label>
                    <input type="number" className={INP} value={form.gutschein_wert}
                      onChange={e=>sf('gutschein_wert',e.target.value)} min="0"
                      step={form.gutschein_typ==='produkte'?'1':'0.50'}
                      placeholder={form.gutschein_typ==='produkte'?'z.B. 2':'z.B. 5.00'}/>
                    <p className="text-xs text-slate-400 mt-1">
                      {form.gutschein_typ==='produkte'
                        ? 'Anzahl der Produkte die mit diesem Gutschein gratis sind (teuerste werden abgezogen).'
                        : 'Fixer Betrag den dieser Gutschein abdeckt.'}
                    </p>
                  </div>
                </div>
              )}
            </div>

            <div className="flex gap-2 mt-1">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-black/10 text-slate-700">Abbrechen</button>
              <button onClick={save} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style={{background:'#0f172a'}}>Speichern</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── FinanzenView ─────────────────────────────────────────────────────────────
const FinanzenView = ({ cafe, toast, profile, profiles, user }) => {
  const [periode, setPeriode] = useState('woche');
  const [gesamt, setGesamt]   = useState(false);
  const [allData, setAllData]  = useState([]);
  const [loadingAll, setLoadingAll] = useState(false);
  const [customFrom, setCustomFrom] = useState('');
  const [customTo, setCustomTo]     = useState('');
  const [tab, setTab]          = useState('uebersicht');
  const [minKarte, setMinKarte] = useState((cafe.einstellungen||{}).min_karten_betrag||10);
  // Vergleich state
  const [cmpMode,    setCmpMode]    = useState('zeitraum'); // 'zeitraum' | 'produkt'
  const [cmpA,       setCmpA]       = useState('woche');
  const [cmpB,       setCmpB]       = useState('monat');
  const [cmpFromA,   setCmpFromA]   = useState('');
  const [cmpToA,     setCmpToA]     = useState('');
  const [cmpFromB,   setCmpFromB]   = useState('');
  const [cmpToB,     setCmpToB]     = useState('');
  const [selProdukte,setSelProdukte]= useState([]);

  // Load all areas for Gesamt view
  useEffect(() => {
    if (!gesamt || !profiles) return;
    setLoadingAll(true);
    Promise.all(
      profiles.map(pp => db.collection(pp.id).doc('data').get().then(snap => ({
        id: pp.id, label: pp.label, color: pp.color||'#8b5cf6',
        data: snap.exists ? {...DEFAULT_CAFE(), ...snap.data()} : DEFAULT_CAFE()
      })).catch(()=>({ id:pp.id, label:pp.label, color:pp.color||'#8b5cf6', data:DEFAULT_CAFE() })))
    ).then(r => { setAllData(r); setLoadingAll(false); });
  }, [gesamt, profiles]);

  const sourceList = useMemo(() => {
    if (gesamt && allData.length) return allData;
    return [{ id: profile, label: 'Aktuell', color: '#6366f1', data: cafe }];
  }, [gesamt, allData, profile, cafe]);

  const allBestellungen = useMemo(() =>
    sourceList.flatMap(src =>
      (src.data.bestellungen||[]).filter(b=>b.status!=='storniert')
        .map(b=>({...b,_area:src.label,_areaId:src.id,_areaColor:src.color}))
    ), [sourceList]);

  const allStorniert = useMemo(() =>
    sourceList.flatMap(src => (src.data.bestellungen||[]).filter(b=>b.status==='storniert')),
    [sourceList]);

  const getRange = useCallback(p => {
    const now = new Date();
    const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if (p==='heute')        return [today, new Date(today.getTime()+86400000)];
    if (p==='gestern')      { const g=new Date(today.getTime()-86400000); return [g,today]; }
    if (p==='woche')        { const m=new Date(today); m.setDate(today.getDate()-(today.getDay()||7)+1); return [m,new Date(m.getTime()+7*86400000)]; }
    if (p==='letzteWoche')  { const m=new Date(today); m.setDate(today.getDate()-(today.getDay()||7)+1); const pm=new Date(m.getTime()-7*86400000); return [pm,m]; }
    if (p==='monat')        return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)];
    if (p==='letzterMonat') { const s=new Date(now.getFullYear(),now.getMonth()-1,1); return [s,new Date(now.getFullYear(),now.getMonth(),1)]; }
    if (p==='quartal')      { const q=Math.floor(now.getMonth()/3); return [new Date(now.getFullYear(),q*3,1),new Date(now.getFullYear(),q*3+3,1)]; }
    if (p==='jahr')         return [new Date(now.getFullYear(),0,1),new Date(now.getFullYear()+1,0,1)];
    if (p==='custom')       {
      const s = customFrom ? new Date(customFrom) : new Date(0);
      const e = customTo   ? new Date(new Date(customTo).getTime()+86400000) : new Date(now.getTime()+86400000);
      return [s,e];
    }
    return [new Date(0), new Date(now.getTime()+86400000)];
  }, [customFrom, customTo]);

  const [rs,re] = useMemo(()=>getRange(periode),[periode,getRange]);
  const [ps,pe] = useMemo(()=>{ const [s,e]=getRange(periode); const d=Math.max(e-s,86400000); return [new Date(s-d),new Date(s)]; },[periode,getRange]);

  const filterBy = useCallback((list,[s,e])=>list.filter(b=>{ const d=new Date(b.erstellt_am); return d>=s&&d<e; }),[]);
  const periodeB = useMemo(()=>filterBy(allBestellungen,[rs,re]),[allBestellungen,rs,re,filterBy]);
  const prevB    = useMemo(()=>filterBy(allBestellungen,[ps,pe]),[allBestellungen,ps,pe,filterBy]);

  const periodeUmsatz = periodeB.reduce((s,b)=>s+b.gesamt,0);
  const prevUmsatz    = prevB.reduce((s,b)=>s+b.gesamt,0);
  const umsatzDelta   = prevUmsatz>0 ? (periodeUmsatz-prevUmsatz)/prevUmsatz*100 : null;
  const countDelta    = prevB.length>0 ? periodeB.length-prevB.length : null;
  const avgBasket     = periodeB.length ? periodeUmsatz/periodeB.length : 0;
  const avgItems      = periodeB.length ? periodeB.reduce((s,b)=>s+(b.artikel||[]).reduce((a,x)=>a+x.menge,0),0)/periodeB.length : 0;
  const stornoCount   = filterBy(allStorniert,[rs,re]).length;

  const schichten = useMemo(()=>
    sourceList.flatMap(src=>(src.data.schichten||[]).map(s=>({...s,_area:src.label})))
      .sort((a,b)=>new Date(b.start)-new Date(a.start)),
    [sourceList]);
  const periodeSchichten = useMemo(()=>schichten.filter(s=>{
    const d=new Date(s.start); return d>=rs&&d<re;
  }),[schichten,rs,re]);

  const zahlungsBreakdown = useMemo(()=>{
    const map={};
    periodeB.forEach(b=>(b.zahlung||[]).forEach(z=>{map[z.name||z.art]=(map[z.name||z.art]||0)+z.betrag;}));
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[periodeB]);

  const katBreakdown = useMemo(()=>{
    const map={};
    periodeB.forEach(b=>(b.artikel||[]).forEach(a=>{
      const kat=(cafe.kategorien||[]).find(k=>k.id===a.kategorie_id);
      const key=kat?.name||'Sonstige'; const col=kat?.farbe||'#8b5cf6';
      if(!map[key]) map[key]={betrag:0,count:0,color:col};
      map[key].betrag+=a.preis*a.menge; map[key].count+=a.menge;
    }));
    return Object.entries(map).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.betrag-a.betrag);
  },[periodeB,cafe.kategorien]);

  const topProdukte = useMemo(()=>{
    const map={};
    periodeB.forEach(b=>(b.artikel||[]).forEach(a=>{
      if(!map[a.name]) map[a.name]={name:a.name,emoji:a.emoji||'',betrag:0,count:0};
      map[a.name].betrag+=a.preis*a.menge; map[a.name].count+=a.menge;
    }));
    return Object.values(map).sort((a,b)=>b.betrag-a.betrag).slice(0,10);
  },[periodeB]);

  // 7/30-day chart
  const chartDays = periode==='monat'||periode==='letzterMonat'||periode==='quartal'||periode==='jahr' ? 30 : 7;
  const chartData = useMemo(()=>{
    const days=[];
    const endDay = periode==='gestern'||periode==='letzteWoche'||periode==='letzterMonat' ? re : new Date();
    for(let i=chartDays-1;i>=0;i--){
      const d=new Date(endDay); d.setDate(d.getDate()-i);
      const s=new Date(d.getFullYear(),d.getMonth(),d.getDate());
      const e=new Date(s.getTime()+86400000);
      days.push({
        label: chartDays<=7 ? d.toLocaleDateString('de-DE',{weekday:'short'}) : d.toLocaleDateString('de-DE',{day:'numeric',month:'short'}),
        umsatz: filterBy(allBestellungen,[s,e]).reduce((s,b)=>s+b.gesamt,0),
        count:  filterBy(allBestellungen,[s,e]).length,
      });
    }
    return days;
  },[allBestellungen,chartDays,periode,re,filterBy]);
  const maxChartUmsatz = Math.max(...chartData.map(d=>d.umsatz),1);

  // Hourly distribution
  const stunden = useMemo(()=>{
    const arr=Array(24).fill(0);
    periodeB.forEach(b=>{ const h=new Date(b.erstellt_am).getHours(); arr[h]+=b.gesamt; });
    return arr;
  },[periodeB]);
  const maxStunde = Math.max(...stunden,1);

  // Weekday distribution
  const wochentage = useMemo(()=>{
    const LABELS=['Mo','Di','Mi','Do','Fr','Sa','So'];
    const arr=Array(7).fill(0);
    allBestellungen.forEach(b=>{ const d=((new Date(b.erstellt_am).getDay()||7)-1); arr[d]+=b.gesamt; });
    return LABELS.map((l,i)=>({label:l,umsatz:arr[i]}));
  },[allBestellungen]);
  const maxWT = Math.max(...wochentage.map(d=>d.umsatz),1);

  // Per-area breakdown (Gesamt mode)
  const areaBreakdown = useMemo(()=>{
    if (!gesamt || !allData.length) return [];
    return allData.map(src=>({
      label:src.label, color:src.color,
      umsatz: filterBy((src.data.bestellungen||[]).filter(b=>b.status!=='storniert'),[rs,re]).reduce((s,b)=>s+b.gesamt,0),
      count:  filterBy((src.data.bestellungen||[]).filter(b=>b.status!=='storniert'),[rs,re]).length,
    })).sort((a,b)=>b.umsatz-a.umsatz);
  },[gesamt,allData,rs,re,filterBy]);
  const maxAreaUmsatz = Math.max(...areaBreakdown.map(d=>d.umsatz),1);

  const periodeLabels = {woche:'Diese Woche',monat:'Dieser Monat',jahr:'Dieses Jahr',custom:'Benutzerdefiniert'};

  const saveMinKarte = () => {
    db.collection(profile||'k21-cafe').doc('data')
      .set({...DEFAULT_CAFE(),...cafe, einstellungen:{...(cafe.einstellungen||{}), min_karten_betrag:parseFloat(minKarte)||10}})
      .catch(e=>toast(e.message,'error'));
    toast('Gespeichert ✓');
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(cafe,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`k21-cafe-${profile}-${Date.now()}.json`; a.click();
    toast('Export erfolgreich');
  };

  const Delta = ({val,suffix=''}) => val===null?null:(
    <div className={`text-xs font-semibold mt-0.5 flex items-center gap-0.5 ${val>=0?'text-emerald-600':'text-red-500'}`}>
      {val>=0?'↑':'↓'} {Math.abs(val).toFixed(1)}{suffix}
    </div>
  );

  const TABS = [{id:'uebersicht',label:'Übersicht'},{id:'vergleich',label:'Vergleich'},{id:'produkte',label:'Produkte'},{id:'schichten',label:'Schichten'},{id:'einstellungen',label:'Einstellungen'}];

  // ── Vergleich helpers ──────────────────────────────────────────────────────
  const getRangeFor = useCallback((p, fromC, toC) => {
    const now = new Date();
    const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if (p==='woche')  { const m=new Date(today); m.setDate(today.getDate()-(today.getDay()||7)+1); return [m,new Date(m.getTime()+7*86400000)]; }
    if (p==='monat')  return [new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)];
    if (p==='jahr')   return [new Date(now.getFullYear(),0,1),new Date(now.getFullYear()+1,0,1)];
    if (p==='custom') {
      const s = fromC ? new Date(fromC) : new Date(0);
      const e = toC   ? new Date(new Date(toC).getTime()+86400000) : new Date(now.getTime()+86400000);
      return [s,e];
    }
    return [new Date(0), new Date(now.getTime()+86400000)];
  }, []);

  const cmpPeriodLabels = {woche:'Diese Woche',monat:'Dieser Monat',jahr:'Dieses Jahr',custom:'Benutzerdefiniert'};

  const [rasA,reA] = useMemo(()=>getRangeFor(cmpA,cmpFromA,cmpToA),[cmpA,cmpFromA,cmpToA,getRangeFor]);
  const [rasB,reB] = useMemo(()=>getRangeFor(cmpB,cmpFromB,cmpToB),[cmpB,cmpFromB,cmpToB,getRangeFor]);

  const cmpBestellungenA = useMemo(()=>filterBy(allBestellungen,[rasA,reA]),[allBestellungen,rasA,reA,filterBy]);
  const cmpBestellungenB = useMemo(()=>filterBy(allBestellungen,[rasB,reB]),[allBestellungen,rasB,reB,filterBy]);

  const cmpStats = useCallback((bestellungen) => {
    const umsatz = bestellungen.reduce((s,b)=>s+b.gesamt,0);
    const count  = bestellungen.length;
    const avg    = count ? umsatz/count : 0;
    const produktMap = {};
    bestellungen.forEach(b=>(b.artikel||[]).forEach(a=>{
      if (!produktMap[a.name]) produktMap[a.name]={name:a.name,betrag:0,count:0};
      produktMap[a.name].betrag+=a.preis*a.menge; produktMap[a.name].count+=a.menge;
    }));
    const topP = Object.values(produktMap).sort((a,b)=>b.betrag-a.betrag).slice(0,5);
    const katMap = {};
    bestellungen.forEach(b=>(b.artikel||[]).forEach(a=>{
      const kat=(cafe.kategorien||[]).find(k=>k.id===a.kategorie_id);
      const key=kat?.name||'Sonstige'; const col=kat?.farbe||'#8b5cf6';
      if(!katMap[key]) katMap[key]={betrag:0,color:col};
      katMap[key].betrag+=a.preis*a.menge;
    }));
    const topK = Object.entries(katMap).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.betrag-a.betrag);
    return {umsatz,count,avg,topP,topK};
  }, [cafe.kategorien]);

  const statsA = useMemo(()=>cmpStats(cmpBestellungenA),[cmpBestellungenA,cmpStats]);
  const statsB = useMemo(()=>cmpStats(cmpBestellungenB),[cmpBestellungenB,cmpStats]);

  // Produkt-Vergleich: for each selected product, get revenue+count per period
  const allProdukteNamen = useMemo(()=>{
    const map={};
    allBestellungen.forEach(b=>(b.artikel||[]).forEach(a=>{ map[a.name]=true; }));
    return Object.keys(map).sort();
  },[allBestellungen]);

  const prodVglData = useMemo(()=>{
    if (!selProdukte.length) return [];
    return selProdukte.map(name => {
      const [s,e] = getRangeFor(periode, customFrom, customTo);
      const filtered = filterBy(allBestellungen,[s,e]);
      let betrag=0, count=0;
      filtered.forEach(b=>(b.artikel||[]).forEach(a=>{ if(a.name===name){betrag+=a.preis*a.menge; count+=a.menge;} }));
      return {name, betrag, count};
    }).sort((a,b)=>b.betrag-a.betrag);
  },[selProdukte,allBestellungen,periode,customFrom,customTo,getRangeFor,filterBy]);
  const maxProdVgl = Math.max(...prodVglData.map(d=>d.betrag),1);

  return (
    <div className="flex flex-col gap-5">

      {/* Controls row */}
      <div className="flex flex-wrap items-center gap-2">
        {profiles && profiles.length > 1 && (
          <button onClick={()=>setGesamt(g=>!g)}
            className={`pill transition-all font-semibold ${gesamt?'text-white':'text-slate-600 bg-white border border-black/10'}`}
            style={gesamt?{background:'#6366f1'}:{}}>
            🌐 Alle Bereiche {gesamt && allData.length ? `(${allData.length})` : ''}
          </button>
        )}
        <div style={{flex:'1 1 0',minWidth:0}}/>
        {tab !== 'vergleich' && (
          <div className="flex gap-1.5">
            {Object.entries(periodeLabels).map(([v,l])=>(
              <button key={v} onClick={()=>setPeriode(v)}
                className={`pill transition-all ${periode===v?'text-white':'text-slate-600 bg-white border border-black/10'}`}
                style={periode===v?{background:'#0f172a'}:{}}>
                {l}
              </button>
            ))}
          </div>
        )}
      </div>

      {tab !== 'vergleich' && periode==='custom' && (
        <div className="glass rounded-xl p-3 flex flex-wrap gap-3 items-center">
          <div className="flex items-center gap-2">
            <label className="text-xs text-slate-500 font-semibold">Von</label>
            <input type="date" className={INP_SM} value={customFrom} onChange={e=>setCustomFrom(e.target.value)} style={{width:'140px'}}/>
          </div>
          <div className="flex items-center gap-2">
            <label className="text-xs text-slate-500 font-semibold">Bis</label>
            <input type="date" className={INP_SM} value={customTo} onChange={e=>setCustomTo(e.target.value)} style={{width:'140px'}}/>
          </div>
        </div>
      )}

      {/* Sub-tabs */}
      <div className="flex gap-1" style={{borderBottom:'2px solid #f1f5f9'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            className="px-4 py-2 text-xs font-semibold transition-all"
            style={{color:tab===t.id?'#0f172a':'#94a3b8',borderBottom:tab===t.id?'2px solid #0f172a':'2px solid transparent',marginBottom:'-2px'}}>
            {t.label}
          </button>
        ))}
      </div>

      {loadingAll && gesamt && (
        <div className="text-center py-8 text-slate-400 text-sm">Lade alle Bereiche…</div>
      )}

      {/* ── ÜBERSICHT ── */}
      {tab==='uebersicht' && (
        <div className="flex flex-col gap-5">

          {/* KPI cards */}
          <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))'}}>
            {[
              {label:'Umsatz',     val:fmtEur(periodeUmsatz), delta:<Delta val={umsatzDelta} suffix="%"/>, col:'#0f172a'},
              {label:'Bestellungen', val:periodeB.length, delta:<Delta val={countDelta} suffix=" vs. vorher"/>, col:'#6366f1'},
              {label:'Ø Bestellung', val:periodeB.length?fmtEur(avgBasket):'—', col:'#f59e0b'},
              {label:'Ø Artikel',  val:periodeB.length?avgItems.toFixed(1):'—', col:'#06b6d4'},
              {label:'Schichten',  val:periodeSchichten.length, col:'#10b981'},
              {label:'Stornierungen', val:stornoCount, col:'#ef4444'},
            ].map(({label,val,delta,col})=>(
              <div key={label} className="glass rounded-2xl p-4 glow" style={{borderTop:`3px solid ${col}`}}>
                <div className="text-xs text-slate-400 mb-1">{label}</div>
                <div className="text-xl font-bold" style={{color:col}}>{val}</div>
                {delta||null}
              </div>
            ))}
          </div>

          {/* Per-area breakdown (Gesamt only) */}
          {gesamt && areaBreakdown.length > 1 && (
            <div className="glass rounded-2xl p-5 glow">
              <h3 className="text-sm font-bold text-slate-700 mb-4">Bereiche im Vergleich</h3>
              <div className="flex flex-col gap-3">
                {areaBreakdown.map(a=>(
                  <div key={a.label} className="flex items-center gap-3">
                    <div className="w-24 flex-shrink-0">
                      <div className="text-xs font-semibold text-slate-700 truncate">{a.label}</div>
                      <div className="text-xs text-slate-400">{a.count} Best.</div>
                    </div>
                    <div className="flex-1 rounded-full overflow-hidden" style={{height:'10px',background:'#f1f5f9'}}>
                      <div style={{height:'100%',width:`${(a.umsatz/maxAreaUmsatz*100).toFixed(1)}%`,background:a.color||'#6366f1',borderRadius:'9px',transition:'width .4s'}}/>
                    </div>
                    <span className="text-sm font-bold text-slate-800 w-20 text-right">{fmtEur(a.umsatz)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Umsatz chart */}
          <div className="glass rounded-2xl p-5 glow">
            <h3 className="text-sm font-bold text-slate-700 mb-4">Umsatz letzte {chartDays} Tage</h3>
            <div className="flex items-end gap-1" style={{height:'120px'}}>
              {chartData.map((d,i)=>(
                <div key={i} className="flex-1 flex flex-col items-center gap-1 min-w-0" title={`${d.label}: ${fmtEur(d.umsatz)}`}>
                  {d.umsatz>0 && <span className="text-slate-400 truncate w-full text-center" style={{fontSize:'7px'}}>{fmtEur(d.umsatz)}</span>}
                  <div style={{width:'100%',height:`${Math.max(4,d.umsatz/maxChartUmsatz*90)}px`,background:'#6366f1',borderRadius:'4px 4px 0 0',opacity:d.umsatz===0?0.12:1,transition:'height .3s'}}/>
                  <span className="text-slate-400 truncate w-full text-center" style={{fontSize:'7px'}}>{d.label}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Two-column: Wochentage + Uhrzeiten */}
          <div className="grid gap-4" style={{gridTemplateColumns:'1fr 1fr'}}>
            <div className="glass rounded-2xl p-5 glow">
              <h3 className="text-sm font-bold text-slate-700 mb-3">Wochentage</h3>
              <div className="flex items-end gap-2" style={{height:'80px'}}>
                {wochentage.map((d,i)=>(
                  <div key={i} className="flex-1 flex flex-col items-center gap-1">
                    <div style={{width:'100%',height:`${Math.max(3,d.umsatz/maxWT*65)}px`,background:'#10b981',borderRadius:'3px 3px 0 0',opacity:d.umsatz===0?0.12:1,transition:'height .3s'}}/>
                    <span className="text-slate-500" style={{fontSize:'9px'}}>{d.label}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="glass rounded-2xl p-5 glow">
              <h3 className="text-sm font-bold text-slate-700 mb-3">Uhrzeiten</h3>
              <div className="flex items-end gap-0.5" style={{height:'80px'}}>
                {stunden.map((v,i)=>(
                  <div key={i} className="flex-1 flex flex-col items-center" title={`${i}:00 — ${fmtEur(v)}`}>
                    <div style={{width:'100%',height:`${Math.max(2,v/maxStunde*65)}px`,background:'#f59e0b',borderRadius:'2px 2px 0 0',opacity:v===0?0.1:1,transition:'height .3s'}}/>
                  </div>
                ))}
              </div>
              <div className="flex justify-between mt-1">
                <span className="text-slate-400" style={{fontSize:'8px'}}>0h</span>
                <span className="text-slate-400" style={{fontSize:'8px'}}>12h</span>
                <span className="text-slate-400" style={{fontSize:'8px'}}>23h</span>
              </div>
            </div>
          </div>

          {/* Zahlungsarten + Kategorien */}
          <div className="grid gap-4" style={{gridTemplateColumns:'1fr 1fr'}}>
            {zahlungsBreakdown.length > 0 && (
              <div className="glass rounded-2xl p-5 glow">
                <h3 className="text-sm font-bold text-slate-700 mb-3">Zahlungsarten</h3>
